name: D'AUBE Money First Cross-Repo Gate

on:
  push:
    branches:
      - ci/money-first-cross-repo-gate-20260829
    paths:
      - 'release/money-first-cross-repo-target.json'
      - '.github/workflows/money-first-cross-repo-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: money-first-cross-repo-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout CI farm control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate pinned Business OS state and live MF-002 runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request

          target = json.loads(pathlib.Path('release/money-first-cross-repo-target.json').read_text())
          repo = target['repository']
          rev = target['revision']
          path = target['path']
          raw_url = f'https://raw.githubusercontent.com/{repo}/{rev}/{path}'

          def get(url, timeout=15):
              req = urllib.request.Request(url, headers={'User-Agent':'DAUBE-Money-First-Cross-Repo-Gate/1.0','Accept':'application/json,text/html,*/*'})
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.status, dict(r.headers), r.read()

          status, headers, body = get(raw_url)
          if status != 200:
              raise SystemExit(f'target_http_{status}')
          doc = json.loads(body.decode('utf-8'))
          packet = next((p for p in doc.get('packets',[]) if p.get('id') == target['packet']), None)
          rr = doc.get('runtime_reality',{})
          er = doc.get('economic_reality',{})
          boundaries = {x.get('id'): x for x in doc.get('infrastructure_boundaries',[]) if isinstance(x,dict)}
          cf = boundaries.get('CLOUDFLARE_BARE_APEX_CACHE',{})
          evidence = packet.get('evidence',[]) if isinstance(packet,dict) else []
          evidence_text = '\n'.join(str(x) for x in evidence)

          live = {}
          for key, url, marker in [
              ('automation','https://daubesonntag.com/automation-sprint/','DAUBE-AUTOMATION-SPRINT-V1'),
              ('automation_js','https://daubesonntag.com/assets/automation-sprint-v2.js','daube-money-first-lead'),
              ('lead_health','https://wilqsqndjgckqxbjptxm.supabase.co/functions/v1/daube-money-first-lead/health','"status":"READY"'),
              ('root','https://daubesonntag.com/','D’AUBE SONNTAG'),
          ]:
              s,h,b = get(url)
              text = b.decode('utf-8','replace')
              live[key] = {'status':s,'marker':marker in text,'bytes':len(b),'cfCacheStatus':h.get('cf-cache-status') or h.get('CF-Cache-Status'),'hasAutomationSprint':'/automation-sprint/' in text}

          checks = []
          def check(cid, ok, detail):
              checks.append({'id':cid,'pass':bool(ok),'points':5,'earned':5 if ok else 0,'detail':detail})

          check('schema-version', doc.get('schema_version') == '1.1.0', 'Business OS status schema upgraded to 1.1.0.')
          check('program-id', doc.get('program_id') == 'DAUBE-MONEY-FIRST-ENTERPRISE-V1', 'Money First program identity is exact.')
          check('mf002-present', isinstance(packet,dict), 'MF-002 packet exists.')
          check('mf002-status', isinstance(packet,dict) and packet.get('status') == target['expectedStatus'], 'MF-002 is promoted only to public qualification runtime verified.')
          check('public-release-evidence', '3705ff6cbfdbd95e4c93369a67c73db8e15e6827' in evidence_text, 'Public Release #171 merge evidence is pinned.')
          check('forge-source-evidence', '03473ec8e959a6371b8aa64d670d3276795b6c4d' in evidence_text, 'Forge OS source reconciliation merge evidence is pinned.')
          check('qualification-runtime-flag', rr.get('customer_facing_qualification_runtime_verified') is True, 'Customer-facing qualification runtime flag is true.')
          check('persistence-flag', rr.get('qualification_persistence_verified') is True, 'Qualification persistence is verified.')
          check('no-public-table-access', rr.get('qualification_direct_public_table_access') is False, 'Direct public lead table access remains false.')
          check('cloudflare-conservative', rr.get('bare_apex_cloudflare_cache_converged') is False and cf.get('status') == 'BLOCKED_EXTERNAL_AUTHORITY', 'Bare-apex cache is not cosmetically promoted.')
          check('checkout-fail-closed', er.get('checkout_live_verified') is False, 'Checkout remains unverified.')
          check('provider-fail-closed', er.get('payment_provider_live_verified') is False, 'Payment provider remains unverified.')
          check('settlement-fail-closed', er.get('settled_external_cash_verified') is False, 'Settlement remains unverified.')
          check('delivery-fail-closed', er.get('customer_delivery_verified_under_program') is False, 'Customer delivery remains unverified.')
          check('revenue-fail-closed', er.get('revenue_verified_under_program') is False, 'Revenue remains unverified.')
          check('next-gate-independent', isinstance(packet,dict) and 'independent non-synthetic' in packet.get('next_truth_gate',''), 'Next gate requires an independent non-synthetic lead.')
          check('live-automation-route', live['automation']['status'] == 200 and live['automation']['marker'], 'Automation Sprint public route is live.')
          check('live-automation-js', live['automation_js']['status'] == 200 and live['automation_js']['marker'], 'Automation Sprint client points at the live lead runtime.')
          check('live-lead-health', live['lead_health']['status'] == 200 and live['lead_health']['marker'], 'Qualified-lead Edge health reports READY.')
          check('live-root-reachable', live['root']['status'] == 200 and live['root']['marker'], 'Bare apex remains reachable even while cache convergence is tracked separately.')

          score = sum(x['earned'] for x in checks)
          max_score = sum(x['points'] for x in checks)
          receipt = {
              'schema':'daube.money-first-cross-repo-receipt.v1',
              'target':target,
              'targetSha256':hashlib.sha256(body).hexdigest(),
              'score':score,
              'max':max_score,
              'threshold':target['minimumScore'],
              'status':'GREEN' if score >= target['minimumScore'] else 'RED',
              'failed':[x['id'] for x in checks if not x['pass']],
              'checks':checks,
              'live':live,
              'truthBoundary':'GREEN proves the pinned MF-002 qualification source/runtime contract only. It does not prove an independent customer, payment, settlement, delivery, revenue, or Cloudflare bare-apex cache convergence.'
          }
          pathlib.Path('artifacts').mkdir(exist_ok=True)
          pathlib.Path('artifacts/money-first-cross-repo.json').write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+'\n')
          print(json.dumps(receipt,indent=2,ensure_ascii=False))
          if score < target['minimumScore']:
              raise SystemExit(f'money_first_score_{score}_below_{target["minimumScore"]}')
          PY

      - name: Upload sanitized cross-repo evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: money-first-cross-repo-evidence
          path: artifacts/money-first-cross-repo.json
          if-no-files-found: error
          retention-days: 7
