name: 5-minute Volunteer Viewer report
description: Report the first public-surface friction you notice. No purchase, positive review or private access required.
title: "[Break the Dawn] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us find friction before launch.

        **A short negative observation is enough.** Test only a public D’AUBE surface. Stop at the first moment you feel confused, hesitant, distrustful, blocked, or ready to leave.

        No purchase, positive rating, OAuth, private-system access, or production work is required.

        A genuine report may count only as external usability/viewer evidence for the behavior observed. It is not customer, payment, settlement, production, shipping, revenue, or commercial-acceptance evidence.

  - type: input
    id: surface
    attributes:
      label: What public page or surface did you open?
      placeholder: URL or page name
    validations:
      required: true

  - type: textarea
    id: friction
    attributes:
      label: What was the first moment you hesitated, got confused, or wanted to leave?
      description: One or two sentences are enough. This is the most valuable field.
      placeholder: I expected ... but when I saw/clicked ... I wasn't sure ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Device / browser (optional)
      description: Add this only if it helps reproduce the problem.
      placeholder: Android · Chrome / iPhone · Safari / Windows · Firefox

  - type: dropdown
    id: severity
    attributes:
      label: How much did it affect you?
      options:
        - Small annoyance
        - Friction — made me hesitate or trust it less
        - Blocker — I could not continue
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Extra detail or screenshot (optional)
      description: Public-safe reproduction steps are welcome. Do not include passwords, tokens, payment data, ID data, or private customer information.

  - type: checkboxes
    id: boundaries
    attributes:
      label: Safety boundary
      options:
        - label: I tested only public surfaces and have not included secrets or sensitive/private data.
          required: true
        - label: I understand this is volunteer usability/viewer feedback; no purchase, positive review, or positive rating is required.
          required: true
