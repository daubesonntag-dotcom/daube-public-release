name: Payment Readiness Public Gate

on:
  pull_request:
    paths:
      - 'release/payment/payment-system-readiness-v1.json'
      - '.github/workflows/payment-readiness-public-gate.yml'
  push:
    branches: [main]
    paths:
      - 'release/payment/payment-system-readiness-v1.json'
      - '.github/workflows/payment-readiness-public-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-payment-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify sanitized readiness truth
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x = JSON.parse(fs.readFileSync('release/payment/payment-system-readiness-v1.json','utf8'));
          if (x.systemReadiness !== 100 || x.maxScore !== 100 || x.color !== 'GREEN') throw new Error('readiness_not_green_100');
          if (x.systemBlocked !== false) throw new Error('system_blocked');
          if (x.paymentInstructionLive !== true || x.settlementIngressConfigured !== true) throw new Error('payment_runtime_not_ready');
          if (!/^[0-9a-f]{40}$/.test(x.canonicalCommerceRevision || '')) throw new Error('canonical_commerce_revision_invalid');
          if (x.canonicalCommerceRevisionStatus !== 'CURRENT_MAIN_NO_CIRCLECI_FAILURE_STATUS') throw new Error('canonical_revision_status_invalid');
          if (JSON.stringify(x.directInternationalBankCandidateCurrencies) !== JSON.stringify(['USD'])) throw new Error('direct_bank_candidate_currency_scope_invalid');
          if (JSON.stringify(x.directInternationalBankUnadmittedCurrencies) !== JSON.stringify(['EUR'])) throw new Error('direct_bank_unadmitted_currency_scope_invalid');
          for (const key of ['independentCustomerRevenueProven','commercialRevenueVerified','complianceComplete','historyPurgeComplete','usdCardLive','eurRuntimeAdmitted']) {
            if (x[key] !== false) throw new Error(`${key}_must_remain_false_without_external_evidence`);
          }
          console.log(`PAYMENT_READINESS_PUBLIC_GATE=GREEN_100 revision=${x.canonicalCommerceRevision}`);
          console.log('DIRECT_INTERNATIONAL_BANK_SCOPE=USD_ONLY');
          console.log('EUR_DIRECT_BANK_SCOPE=UNADMITTED');
          console.log('EXTERNAL_CLAIMS_FAIL_CLOSED=true');
          NODE
