name: UX & UI Quality Gate

on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.svg"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
      - "**/*.webp"
      - ".daube/visual-locks/**"
      - ".daube/releases/**"
      - "scripts/ux-quality-audit.mjs"
      - "scripts/homepage-browser-evidence.mjs"
      - "config/ux-quality-budget.json"
      - "tests/founder-visual-lock-homepage.test.mjs"
      - "tests/free-first-homepage-convergence.test.mjs"
      - ".github/workflows/ux-quality-gate.yml"
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.svg"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.png"
      - "**/*.webp"
      - ".daube/visual-locks/**"
      - ".daube/releases/**"
      - "scripts/ux-quality-audit.mjs"
      - "scripts/homepage-browser-evidence.mjs"
      - "config/ux-quality-budget.json"
      - "tests/founder-visual-lock-homepage.test.mjs"
      - "tests/free-first-homepage-convergence.test.mjs"
      - ".github/workflows/ux-quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify approved homepage visual lock contract
        run: node --test tests/founder-visual-lock-homepage.test.mjs
      - name: Verify Free-First homepage convergence
        run: node --test tests/free-first-homepage-convergence.test.mjs
      - name: Audit UX, accessibility, email safety and asset budgets
        run: node scripts/ux-quality-audit.mjs --report artifacts/ux-quality-report.json
      - name: Render approved desktop, mobile and reduced-motion homepage evidence in Chromium
        run: node scripts/homepage-browser-evidence.mjs
      - name: Upload audit and approved-mockup browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ux-quality-report
          path: |
            artifacts/ux-quality-report.json
            .daube/evidence/approved-mockup-homepage/
          retention-days: 7
