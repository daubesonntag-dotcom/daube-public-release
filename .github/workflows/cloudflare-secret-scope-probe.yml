name: Cloudflare secret scope probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-secret-scope-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXACT: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ALT_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ALT_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
      ALT_CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          present() { if [[ -n "$2" ]]; then echo "$1=present"; else echo "$1=missing"; fi; }
          present CLOUDFLARE_API_TOKEN "$EXACT"
          present CF_API_TOKEN "$ALT_CF_API_TOKEN"
          present CLOUDFLARE_TOKEN "$ALT_CLOUDFLARE_TOKEN"
          present CLOUDFLARE_API_KEY "$ALT_CLOUDFLARE_API_KEY"
          echo 'No secret value is printed by this probe.'
