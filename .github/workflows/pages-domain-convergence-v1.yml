name: Launch Critical Public Readback V5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-domain-convergence-v1.yml"
      - "release/runtime-admission-target.json"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-critical-public-readback-v5
  cancel-in-progress: true

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout release target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate frozen provider-neutral target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          test -f release/runtime-admission-target.json
          expected_sha="$(jq -r '.expectedSha' release/runtime-admission-target.json)"
          repository="$(jq -r '.repository' release/runtime-admission-target.json)"
          gate="$(jq -r '.runtimeGate' release/runtime-admission-target.json)"
          runtime_origin="$(jq -r '.runtimeOrigin' release/runtime-admission-target.json)"
          provider="$(jq -r '.requiredProvider | if . == null then "none" else . end' release/runtime-admission-target.json)"
          rail="$(jq -r '.primaryDomesticRail' release/runtime-admission-target.json)"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$repository" == 'daubesonntag-dotcom/daube-commerce' ]]
          [[ "$gate" == 'provider_neutral_runtime_admission' ]]
          [[ "$provider" == 'none' ]]
          [[ "$rail" == 'direct_vietqr' ]]
          python3 - "$runtime_origin" <<'PY'
          import sys
          from urllib.parse import urlparse
          value=sys.argv[1]
          parsed=urlparse(value)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.username or parsed.password or parsed.query or parsed.fragment:
              raise SystemExit('runtime_origin_invalid')
          if parsed.path.endswith('/'):
              raise SystemExit('runtime_origin_must_not_end_slash')
          PY
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "runtime_origin=$runtime_origin" >> "$GITHUB_OUTPUT"

      - name: Verify canonical public apex
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 20 \
            https://daubesonntag.com/ --output /tmp/apex.html
          test -s /tmp/apex.html
          grep -Fq 'D’AUBE SONNTAG' /tmp/apex.html
          grep -Fq 'RẠNG TRONG' /tmp/apex.html
          grep -Eq '/assets/[^"'\''[:space:]]+' /tmp/apex.html

      - name: Probe provider-neutral commerce runtime
        id: runtime
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
          RUNTIME_ORIGIN: ${{ steps.target.outputs.runtime_origin }}
        run: |
          set -u -o pipefail
          common=(--silent --show-error --connect-timeout 10 --max-time 20 --header 'Accept: application/json' --header 'Origin: https://daubesonntag.com' --header 'Cache-Control: no-cache')
          health_http="$(curl "${common[@]}" --output /tmp/health.json --write-out '%{http_code}' "${RUNTIME_ORIGIN}/healthz" || true)"
          products_http="$(curl "${common[@]}" --output /tmp/products.json --write-out '%{http_code}' "${RUNTIME_ORIGIN}/v1/products" || true)"
          turns_http="$(curl "${common[@]}" --output /tmp/turns.json --write-out '%{http_code}' "${RUNTIME_ORIGIN}/v1/turns" || true)"
          [[ "$health_http" =~ ^[0-9]{3}$ ]] || health_http=000
          [[ "$products_http" =~ ^[0-9]{3}$ ]] || products_http=000
          [[ "$turns_http" =~ ^[0-9]{3}$ ]] || turns_http=000
          export HEALTH_HTTP="$health_http" PRODUCTS_HTTP="$products_http" TURNS_HTTP="$turns_http" EXPECTED_SHA

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          def load(path, default):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return default

          health = load('/tmp/health.json', {})
          products = load('/tmp/products.json', None)
          turns = load('/tmp/turns.json', {})
          expected = os.environ['EXPECTED_SHA']
          pending = []

          if os.environ['HEALTH_HTTP'] != '200': pending.append('HEALTH_HTTP_NOT_200')
          if os.environ['PRODUCTS_HTTP'] != '200': pending.append('PRODUCTS_HTTP_NOT_200')
          if os.environ['TURNS_HTTP'] != '200': pending.append('TURNS_HTTP_NOT_200')

          health_schema = health.get('schema') if isinstance(health, dict) else None
          if health_schema == 'daube.commerce.provider-neutral-health.v2':
              source = health.get('commerceRuntimeSourceRevision')
              binding = health.get('commerceRuntimeBindingVerified') is True
          elif health_schema == 'daube.commerce.provider-neutral-health.v1':
              source = health.get('sourceRevision')
              binding = health.get('releaseBindingVerified') is True
          else:
              source = None
              binding = False
              pending.append('HEALTH_SCHEMA_UNSUPPORTED')

          if source != expected: pending.append('EXACT_SHA_NOT_DEPLOYED')
          if not binding: pending.append('RELEASE_BINDING_NOT_VERIFIED')
          if not isinstance(health, dict) or health.get('status') != 'READY': pending.append('HEALTH_NOT_READY')
          if isinstance(health, dict) and health.get('secretMaterialSerialized') is not False:
              pending.append('SECRET_SERIALIZATION_GUARD_FAILED')

          product_ok = bool(isinstance(products, list) and products) and all(
              isinstance(p, dict) and isinstance(p.get('id'), str) and p.get('id') and
              isinstance(p.get('sku'), str) and p.get('sku') and
              isinstance(p.get('price'), dict) and isinstance(p['price'].get('amountMinor'), int) and
              p['price'].get('currency') in ('VND', 'USD')
              for p in products
          )
          first_dawn_product = bool(isinstance(products, list)) and any(
              isinstance(p, dict) and p.get('id') == 'paradox-decision-veto' and
              p.get('sku') == 'DS-PARADOX-VETO-01' and
              isinstance(p.get('price'), dict) and p['price'].get('amountMinor') == 49000 and
              p['price'].get('currency') == 'VND'
              for p in products
          )
          if not product_ok: pending.append('PUBLIC_PRODUCTS_INVALID')
          if not first_dawn_product: pending.append('FIRST_DAWN_PRODUCT_MISSING')

          first_dawn_turn = bool(
              isinstance(turns, dict) and
              turns.get('schema') == 'daube.experience-turn-list.v1' and
              isinstance(turns.get('turns'), list) and
              any(
                  isinstance(t, dict) and t.get('turnId') == 'first-dawn-decision-veto-v1' and
                  t.get('availability') == 'AVAILABLE' and t.get('claimable') is True and
                  t.get('capacity') == 36 and
                  isinstance(t.get('product'), dict) and t['product'].get('id') == 'paradox-decision-veto' and
                  isinstance(t['product'].get('price'), dict) and t['product']['price'].get('amountMinor') == 49000
                  for t in turns['turns']
              )
          )
          if not first_dawn_turn: pending.append('FIRST_DAWN_TURN_MISSING_OR_UNAVAILABLE')

          runtime_ready = not pending
          receipt = {
              'schema': 'daube.provider-neutral-public-readback.v5',
              'healthSchema': health_schema,
              'expectedRevision': expected,
              'reportedRevision': source,
              'runtimeAdmission': 'PASS' if runtime_ready else 'CONTINUING',
              'requiredProvider': None,
              'observedRuntimeProvider': health.get('runtimeProvider') if isinstance(health, dict) else None,
              'healthHttp': os.environ['HEALTH_HTTP'],
              'productsHttp': os.environ['PRODUCTS_HTTP'],
              'turnsHttp': os.environ['TURNS_HTTP'],
              'healthStatus': health.get('status') if isinstance(health, dict) else None,
              'releaseBindingVerified': binding,
              'publicProductsValid': product_ok,
              'firstDawnProductPresent': first_dawn_product,
              'firstDawnTurnAvailable': first_dawn_turn,
              'directVietQrInstructionRuntimeOperational': bool(
                  isinstance(health, dict) and
                  health.get('directPayOperational') is True and
                  health.get('directPayApproved') is True
              ),
              'directVietQrAccountOwnershipVerified': bool(
                  isinstance(health, dict) and
                  health.get('directPayAccountOwnershipVerified') is True
              ),
              'directVietQrSettlementProvenByThisReceipt': False,
              'independentCustomerRevenueProvenByThisReceipt': False,
              'refundProvenByThisReceipt': False,
              'productionMutationPerformed': False,
              'secretMaterialSerialized': False,
              'globalFlowStalled': False,
              'pendingGates': pending,
          }
          Path('/tmp/provider-neutral-public-readback.json').write_text(
              json.dumps(receipt, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

          runtime_state="$(jq -r '.runtimeAdmission' /tmp/provider-neutral-public-readback.json)"
          echo "runtime_state=$runtime_state" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized runtime receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-neutral-runtime-readback-${{ steps.target.outputs.expected_sha }}
          if-no-files-found: error
          retention-days: 7
          path: /tmp/provider-neutral-public-readback.json

      - name: Enforce frozen exact-candidate runtime gate
        if: always()
        shell: bash
        env:
          RUNTIME_STATE: ${{ steps.runtime.outputs.runtime_state }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_STATE" == 'PASS' ]] || {
            echo '::error::Frozen exact-candidate runtime admission is still converging; unrelated D’AUBE lanes continue.'
            exit 22
          }
          echo 'PROVIDER_NEUTRAL_EXACT_CANDIDATE_RUNTIME_VERIFIED' >> "$GITHUB_STEP_SUMMARY"
