name: Cloudflare payment-surface cache diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-root-cache-purge.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  purge-root:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: daubesonntag.com
    steps:
      - name: Checkout recovery truth
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Purge when authorized, otherwise verify bounded Pages recovery
        id: purge
        shell: bash
        run: |
          set -euo pipefail
          RESULT=/tmp/daube-cloudflare-result
          echo 'unknown_failure' > "$RESULT"

          RECOVERY_ACTIVE="$(node - <<'NODE'
          const fs=require('node:fs');
          try {
            const x=JSON.parse(fs.readFileSync('release/payment-domain-recovery-v1.json','utf8'));
            process.stdout.write(String(x?.schema==='daube.payment-domain-recovery.v1' && x?.status==='ACTIVE_RECOVERY' && x?.recoveryAuthority?.publisher==='github-pages' && x?.recoveryAuthority?.temporary===true));
          } catch { process.stdout.write('false'); }
          NODE
          )"

          verify_recovery() {
            root_origin_code="$(curl --silent --show-error --location --max-time 20 --output /tmp/root-origin.html --write-out '%{http_code}' "https://daubesonntag.com/?daube-recovery-sha=${GITHUB_SHA}" || true)"
            pay_code="$(curl --silent --show-error --location --max-time 20 --output /tmp/pay.html --write-out '%{http_code}' "https://daubesonntag.com/pay/" || true)"
            if [[ "$root_origin_code" == 200 && "$pay_code" == 200 ]] \
              && grep -Fq '/pay/' /tmp/root-origin.html \
              && grep -Fq 'Workflow Kit' /tmp/root-origin.html \
              && grep -Fq 'Workflow Kit — Single' /tmp/pay.html \
              && grep -Fq 'US$15' /tmp/pay.html \
              && grep -Fq 'US$39' /tmp/pay.html \
              && grep -Fq 'US$95' /tmp/pay.html \
              && grep -Fq 'Refund' /tmp/pay.html \
              && grep -Fq 'Privacy' /tmp/pay.html; then
              return 0
            fi
            return 1
          }

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            if [[ "$RECOVERY_ACTIVE" == true ]] && verify_recovery; then
              echo 'pages_recovery_active_cloudflare_token_absent_origin_verified' > "$RESULT"
              exit 0
            fi
            echo 'cloudflare_token_absent_without_verified_recovery' > "$RESULT"
            exit 41
          fi

          code="$(curl --silent --show-error --output /tmp/zones.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}&status=active" || true)"
          if [[ "$code" != 200 ]]; then
            echo "zone_lookup_http_${code:-none}" > "$RESULT"
            exit 42
          fi

          ZONE_ID="$(python3 - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/zones.json', encoding='utf-8'))
              print(data['result'][0]['id'] if data.get('success') is True and data.get('result') else '')
          except Exception:
              print('')
          PY
          )"
          if [[ -z "$ZONE_ID" ]]; then
            echo 'zone_not_found_or_token_scope' > "$RESULT"
            exit 43
          fi

          python3 - <<'PY' >/tmp/purge.json
          import json
          base='https://daubesonntag.com'
          paths=['/','/index.html','/pay/','/pay/index.html','/pricing/','/terms/','/privacy/','/refund/','/contact/']
          print(json.dumps({'files':[base+p for p in paths] + ['https://www.daubesonntag.com/']}))
          PY

          purge_code="$(curl --silent --show-error --output /tmp/purge-result.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data @/tmp/purge.json \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" || true)"
          if [[ "$purge_code" != 200 ]]; then
            echo "purge_http_${purge_code:-none}" > "$RESULT"
            exit 44
          fi
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/purge-result.json', encoding='utf-8'))
          raise SystemExit(0 if data.get('success') is True else 1)
          PY

          for attempt in 1 2 3 4 5 6 7 8; do
            root_code="$(curl --silent --show-error --location --header 'Cache-Control: no-cache' --max-time 20 --output /tmp/root.html --write-out '%{http_code}' https://daubesonntag.com/ || true)"
            pay_code="$(curl --silent --show-error --location --header 'Cache-Control: no-cache' --max-time 20 --output /tmp/pay.html --write-out '%{http_code}' https://daubesonntag.com/pay/ || true)"
            if [[ "$root_code" == 200 && "$pay_code" == 200 ]] \
              && grep -Fq '/pay/' /tmp/root.html \
              && grep -Fq 'Workflow Kit — Single' /tmp/pay.html \
              && grep -Fq 'US$15' /tmp/pay.html \
              && grep -Fq 'US$39' /tmp/pay.html \
              && grep -Fq 'US$95' /tmp/pay.html; then
              echo 'cloudflare_purged_and_payment_surface_verified' > "$RESULT"
              exit 0
            fi
            sleep 2
          done
          echo 'purge_accepted_bare_root_still_stale' > "$RESULT"
          exit 45

      - name: Publish truthful diagnostic receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reason="$(cat /tmp/daube-cloudflare-result 2>/dev/null || printf '%s' 'runner_failed_before_probe')"
          case "$reason" in
            cloudflare_purged_and_payment_surface_verified)
              state=success; description='Cloudflare purged; D’AUBE Pay review surface verified' ;;
            pages_recovery_active_cloudflare_token_absent_origin_verified)
              state=success; description='Pages recovery verified; Cloudflare token absent, purge not claimed' ;;
            *)
              state=failure; description="Cloudflare boundary: ${reason}" ;;
          esac
          description="${description:0:140}"
          payload="$(python3 - "$state" "$description" <<'PY'
          import json,sys
          print(json.dumps({'state':sys.argv[1],'context':'ops/cloudflare-root-purge','description':sys.argv[2]}))
          PY
          )"
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
