name: Cloudflare root cache purge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-root-cache-purge.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  purge-root:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: daubesonntag.com
    steps:
      - name: Purge stale root cache and classify boundary
        id: purge
        continue-on-error: true
        shell: bash
        run: |
          set -u
          RESULT=/tmp/daube-cloudflare-result
          echo 'unknown_failure' > "$RESULT"

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo 'credential_absent' > "$RESULT"
            exit 41
          fi

          code="$(curl --silent --show-error --output /tmp/zones.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/zones?name=${ZONE_NAME}&status=active" || true)"
          if [[ "$code" != "200" ]]; then
            echo "zone_lookup_http_${code:-none}" > "$RESULT"
            exit 42
          fi

          ZONE_ID="$(python3 - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/zones.json', encoding='utf-8'))
              print(data['result'][0]['id'] if data.get('success') is True and data.get('result') else '')
          except Exception:
              print('')
          PY
          )"
          if [[ -z "$ZONE_ID" ]]; then
            echo 'zone_not_found_or_token_scope' > "$RESULT"
            exit 43
          fi

          python3 - <<'PY' >/tmp/purge.json
          import json
          print(json.dumps({'files': [
            'https://daubesonntag.com/',
            'https://daubesonntag.com/index.html',
            'https://www.daubesonntag.com/'
          ]}))
          PY

          purge_code="$(curl --silent --show-error --output /tmp/purge-result.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data @/tmp/purge.json \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" || true)"
          if [[ "$purge_code" != "200" ]]; then
            echo "purge_http_${purge_code:-none}" > "$RESULT"
            exit 44
          fi

          if ! python3 - <<'PY'
          import json
          data=json.load(open('/tmp/purge-result.json', encoding='utf-8'))
          raise SystemExit(0 if data.get('success') is True else 1)
          PY
          then
            echo 'purge_rejected' > "$RESULT"
            exit 44
          fi

          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error \
                --header 'Cache-Control: no-cache' \
                --max-time 20 \
                https://daubesonntag.com/ -o /tmp/root.html; then
              if grep -Fq '/assets/mobile-first-flagship-v3.css' /tmp/root.html \
                && ! grep -Fq 'RẠNG TRONG · COMING SOON' /tmp/root.html; then
                echo 'purged_and_v3_verified' > "$RESULT"
                exit 0
              fi
            fi
            sleep 2
          done

          echo 'purge_accepted_root_still_stale' > "$RESULT"
          exit 45

      - name: Publish bounded diagnostic receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reason="$(cat /tmp/daube-cloudflare-result 2>/dev/null || printf '%s' 'runner_failed_before_probe')"
          if [[ "$reason" == 'purged_and_v3_verified' ]]; then
            state=success
            description='Cloudflare root purged; V3 verified'
          else
            state=failure
            description="Cloudflare boundary: ${reason}"
          fi
          description="${description:0:140}"
          payload="$(python3 - "$state" "$description" <<'PY'
          import json,sys
          print(json.dumps({
            'state': sys.argv[1],
            'context': 'ops/cloudflare-root-purge',
            'description': sys.argv[2]
          }))
          PY
          )"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null

      - name: Preserve fail-closed result
        if: steps.purge.outcome != 'success'
        shell: bash
        run: |
          echo 'Cloudflare root purge did not complete; see ops/cloudflare-root-purge commit status.'
          exit 1
