name: Publish D’AUBE Release Mirror

on:
  workflow_dispatch:
    inputs:
      release_manifest:
        description: "Path to an approved daube.public-release.handoff.v1 manifest on this exact ref"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-release-mirror
  cancel-in-progress: true

jobs:
  deploy-mirror:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact dispatched ref
        uses: actions/checkout@v7

      - name: Validate approved release handoff before any publication
        shell: bash
        env:
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_MANIFEST"
          node scripts/validate-release-mirror-handoff.mjs "$RELEASE_MANIFEST"

      - name: Fail closed if GitHub Pages still owns canonical apex
        id: pages-preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )

          status="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' "${headers[@]}" "$api")"
          if [[ "$status" == "404" ]]; then
            create_status="$(curl --silent --show-error --output /tmp/pages-create.json --write-out '%{http_code}' \
              --request POST "${headers[@]}" --header 'Content-Type: application/json' \
              --data '{"build_type":"workflow"}' "$api")"
            if [[ "$create_status" == "201" || "$create_status" == "409" ]]; then
              sleep 2
              status="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' "${headers[@]}" "$api")"
            fi
          fi

          if [[ "$status" != "200" ]]; then
            echo "::error title=GitHub Pages unavailable::Pages API returned HTTP $status"
            exit 1
          fi

          readarray -t page_fields < <(python3 - <<'PY'
          import json
          data = json.load(open('/tmp/pages.json', encoding='utf-8'))
          print(data.get('build_type') or '')
          print(data.get('cname') or '')
          print(data.get('html_url') or '')
          PY
          )
          build_type="${page_fields[0]:-}"
          cname="${page_fields[1]:-}"
          html_url="${page_fields[2]:-}"

          case "${cname,,}" in
            daubesonntag.com|www.daubesonntag.com)
              echo "::error title=Homepage authority collision::GitHub Pages custom domain is ${cname}. Canonical apex authority belongs to daube-web/Cloudflare. Detach the Pages custom domain before publishing this release mirror."
              exit 3
              ;;
          esac

          echo "Pages mirror preflight OK: build_type=${build_type:-unknown}; cname=${cname:-none}; url=${html_url:-unknown}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload immutable public release projection
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy release mirror
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify release mirror matches approved artifact
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          case "$PAGE_URL" in
            https://daubesonntag.com*|https://www.daubesonntag.com*)
              echo "::error title=Canonical apex is not a mirror endpoint::Refusing to treat ${PAGE_URL} as daube-public-release authority."
              exit 3
              ;;
          esac

          expected_sha="$(python3 - "$RELEASE_MANIFEST" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding='utf-8'))['artifactDigest'])
          PY
          )"
          verified=0
          code=unknown
          actual_sha=unknown
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --location --output /tmp/daube-release-mirror.html --write-out '%{http_code}' "$PAGE_URL" || true)"
            if [[ "$code" == "200" ]] && test -s /tmp/daube-release-mirror.html; then
              actual_sha="$(sha256sum /tmp/daube-release-mirror.html | awk '{print $1}')"
              if [[ "$actual_sha" == "$expected_sha" ]] \
                && grep -q 'Public release channel' /tmp/daube-release-mirror.html \
                && grep -q 'daube-web' /tmp/daube-release-mirror.html; then
                verified=1
                break
              fi
            fi
            sleep 2
          done

          if [[ "$verified" != "1" ]]; then
            echo "::error title=Release mirror readback failed::Mirror did not converge to the approved handoff artifact. expected_sha=${expected_sha} actual_sha=${actual_sha} code=${code}"
            exit 1
          fi

          {
            echo '## Release mirror verified'
            echo
            echo "Mirror endpoint: $PAGE_URL"
            echo "Approved index.html SHA-256: ${expected_sha}"
            echo "Release handoff: ${RELEASE_MANIFEST}"
            echo 'Canonical apex authority: daube-web / Cloudflare (NOT this repository)'
            echo 'Exact approved release mirror bytes: VERIFIED'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish observable mirror status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION='GitHub Pages release mirror verified; canonical apex remains external' ;;
            cancelled) STATE=error; DESCRIPTION='GitHub Pages release mirror publication cancelled' ;;
            *) STATE=failure; DESCRIPTION='GitHub Pages release mirror publication blocked or failed' ;;
          esac
          export STATE DESCRIPTION
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'state': os.environ['STATE'],
            'context': 'ci/github-pages: mirror',
            'description': os.environ['DESCRIPTION'][:140],
            'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }))
          PY
          )"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
