name: GitHub App public scope probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-app-public-scope-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      APP_ID: ${{ vars.DAUBE_GITHUB_APP_ID }}
      INSTALLATION_ID: ${{ vars.DAUBE_GITHUB_APP_INSTALLATION_ID }}
      PRIVATE_KEY: ${{ secrets.DAUBE_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - name: Emit presence only
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${APP_ID:-}" ]] && app=1 || app=0
          [[ -n "${INSTALLATION_ID:-}" ]] && installation=1 || installation=0
          [[ -n "${PRIVATE_KEY:-}" ]] && private_key=1 || private_key=0
          printf 'github_app_scope app_id=%s installation_id=%s private_key=%s\n' "$app" "$installation" "$private_key"
          test "$app" = 1
          test "$installation" = 1
          test "$private_key" = 1
