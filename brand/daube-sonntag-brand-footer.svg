    <path d="M334 229c48-71 109-91 145-65 40 29 10 86-65 113-36 13-68 6-84-8 13-8 18-23 4-40z"/>
    <path d="M301 264c-27 45-65 85-131 118-53 27-102 28-121 7 55-9 111-46 159-96 35-36 61-56 93-29z"/>
    <path d="M335 265c27 38 70 81 135 111 57 27 93 23 116 8-58-15-111-49-154-94-30-31-61-48-97-25z"/>
    <ellipse cx="318" cy="246" rx="43" ry="35"/>
