name: Resource Farm Public Runner Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/resource-farm-public-runner-evidence.yml'
      - 'farm/evidence/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/resource-farm-public-runner-evidence.yml'
      - 'farm/evidence/**'
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-farm-public-runner-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parallel-producers:
    name: producer-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - name: CPU production receipt
        shell: bash
        env:
          FARM_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, platform, time
          shard=int(os.environ['FARM_SHARD'])
          work_units=250000
          started=time.perf_counter()
          digest=hashlib.sha256()
          for i in range(work_units):
              digest.update(f'daube-farm-generation-4-{shard}-{i}'.encode())
          elapsed=max(time.perf_counter()-started, 1e-9)
          receipt={
            'schema':'daube.resource-farm-parallel-producer-receipt.v4',
            'generation':4,
            'resourceClasses':['compute','ci-build'],
            'poolId':f'github-public-runner-{shard}',
            'providerFamily':'github-public-runner',
            'backend':'github-hosted-linux-cpu',
            'shard':shard,
            'runnerOS':platform.system(),
            'arch':platform.machine(),
            'cpuCount':os.cpu_count(),
            'workUnits':work_units,
            'workUnitsPerSecond':round(work_units/elapsed,2),
            'latencyMs':round(elapsed*1000,2),
            'sha256':digest.hexdigest(),
            'success':True,
            'observedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
            'paidSpendAuthorized':False,
            'privateAssetsUsed':False,
          }
          path=f'/tmp/producer-{shard}.json'
          with open(path,'w',encoding='utf-8') as f:
              json.dump(receipt,f,sort_keys=True)
          print(json.dumps(receipt, sort_keys=True))
          assert receipt['runnerOS']=='Linux'
          assert receipt['cpuCount'] and receipt['cpuCount'] >= 1
          assert receipt['workUnitsPerSecond'] > 0
          PY

      - name: Compiler production receipt
        shell: bash
        env:
          FARM_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cat >/tmp/farm_canary.c <<'C'
          #include <stdio.h>
          #include <stdlib.h>
          int main(int argc, char **argv){ unsigned long s=(argc>1)?strtoul(argv[1],0,10):0; unsigned long x=2166136261u+s; for(unsigned long i=0;i<100000;i++){x^=(i+s);x*=16777619u;} printf("FARM_COMPILED_OK:%lu:%lu\n",s,x); return 0; }
          C
          gcc -O2 /tmp/farm_canary.c -o /tmp/farm_canary
          /tmp/farm_canary "$FARM_SHARD" | tee /tmp/farm_compiler_receipt.txt
          grep -q "^FARM_COMPILED_OK:${FARM_SHARD}:" /tmp/farm_compiler_receipt.txt

      - name: Store producer pollen receipt
        uses: actions/upload-artifact@v4
        with:
          name: farm-producer-${{ matrix.shard }}
          path: /tmp/producer-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  browser-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Headless browser production receipt
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          cat >/tmp/farm-browser.html <<'HTML'
          <!doctype html><html><body><div id="result">boot</div><script>
          const values=new Uint32Array(32768); for(let i=0;i<values.length;i++) values[i]=(i*2654435761)>>>0;
          let x=0; for(const v of values) x=(x^v)>>>0;
          document.getElementById('result').textContent='FARM_BROWSER_OK:'+navigator.userAgent+':'+values.length+':'+x;
          </script></body></html>
          HTML
          python3 -m http.server 8765 --directory /tmp >/tmp/farm-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          "$CHROME" --headless --no-sandbox --disable-gpu --dump-dom http://127.0.0.1:8765/farm-browser.html | tee /tmp/farm-browser-receipt.html
          grep -q 'FARM_BROWSER_OK:' /tmp/farm-browser-receipt.html
          echo "browser_binary=$CHROME"

  pollination-harvest:
    if: always()
    needs: [parallel-producers, browser-canary]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Admit pollen sources
        shell: bash
        env:
          PRODUCERS_RESULT: ${{ needs.parallel-producers.result }}
          BROWSER_RESULT: ${{ needs.browser-canary.result }}
        run: |
          set -euo pipefail
          test "$PRODUCERS_RESULT" = success
          test "$BROWSER_RESULT" = success

      - name: Collect GitHub producer pollen
        uses: actions/download-artifact@v4
        with:
          pattern: farm-producer-*
          path: /tmp/farm-pollen
          merge-multiple: true

      - name: Collect Supabase Edge pollen
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --max-time 15 \
            --header 'accept: application/json' \
            'https://wilqsqndjgckqxbjptxm.supabase.co/functions/v1/daube-resource-farm-pollen-edge/v1/farm/pollen' \
            --output /tmp/farm-pollen/supabase-edge.json
          python3 - <<'PY'
          import json
          with open('/tmp/farm-pollen/supabase-edge.json',encoding='utf-8') as f:
              r=json.load(f)
          assert r['schema']=='daube.resource-farm-pollen-receipt.v1'
          assert r['generation']==4
          assert r['providerFamily']=='supabase-edge'
          assert r['poolId']=='supabase-edge-cpu'
          assert 'compute' in r['resourceClasses']
          assert r['workUnits']==250000
          assert r['workUnitsPerSecond'] > 0
          assert r['success'] is True
          assert r['paidSpendAuthorized'] is False
          assert r['privateAssetsUsed'] is False
          print(json.dumps(r,sort_keys=True))
          PY

      - name: Cross-provider pollinate and harvest receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json
          files=sorted(glob.glob('/tmp/farm-pollen/producer-*.json'))
          if len(files) != 6:
              raise SystemExit(f'expected 6 GitHub producer receipts, got {len(files)}')
          producers=[]
          shards=set()
          for path in files:
              with open(path,encoding='utf-8') as f:
                  r=json.load(f)
              assert r['schema']=='daube.resource-farm-parallel-producer-receipt.v4'
              assert r['generation']==4
              assert r['providerFamily']=='github-public-runner'
              assert r['success'] is True
              assert r['paidSpendAuthorized'] is False
              assert r['privateAssetsUsed'] is False
              assert r['shard'] not in shards
              shards.add(r['shard'])
              producers.append(r)
          with open('/tmp/farm-pollen/supabase-edge.json',encoding='utf-8') as f:
              edge=json.load(f)
          github_work=sum(r['workUnits'] for r in producers)
          github_throughput=round(sum(r['workUnitsPerSecond'] for r in producers),2)
          best=max(producers,key=lambda r:r['workUnitsPerSecond'])
          families=sorted(set([r['providerFamily'] for r in producers]+[edge['providerFamily']]))
          harvest={
            'schema':'daube.resource-farm-pollination-harvest.v4',
            'generation':4,
            'producerReplicas':len(producers),
            'githubAggregateWorkUnits':github_work,
            'githubParallelThroughput':github_throughput,
            'externalPollinatorWorkUnits':edge['workUnits'],
            'externalPollinatorThroughput':edge['workUnitsPerSecond'],
            'totalEvidenceWorkUnits':github_work+edge['workUnits'],
            'providerFamilies':families,
            'providerFamilyCount':len(families),
            'monocultureRisk':len(families)<2,
            'crossProviderPollination':len(families)>=2,
            'bestGithubProducerShard':best['shard'],
            'bestGithubProducerThroughput':best['workUnitsPerSecond'],
            'pollinationMode':'cross-provider-receipt-exchange-and-selection',
            'paidSpendAuthorized':False,
            'privateAssetsUsed':False,
          }
          assert github_work == 1500000
          assert github_throughput > 0
          assert edge['workUnits']==250000
          assert len(families) >= 2
          assert harvest['monocultureRisk'] is False
          with open('/tmp/farm-harvest.json','w',encoding='utf-8') as f:
              json.dump(harvest,f,sort_keys=True)
          print(json.dumps(harvest,sort_keys=True))
          PY

      - name: Store external pollinator receipt
        uses: actions/upload-artifact@v4
        with:
          name: farm-pollinator-supabase-edge
          path: /tmp/farm-pollen/supabase-edge.json
          if-no-files-found: error
          retention-days: 1

      - name: Store generation 4 seed bank
        uses: actions/upload-artifact@v4
        with:
          name: farm-generation-4-seed-bank
          path: /tmp/farm-harvest.json
          if-no-files-found: error
          retention-days: 7

  prove-public-runner:
    if: always()
    needs: [parallel-producers, browser-canary, pollination-harvest]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: CPU compute receipt
        shell: bash
        env:
          PRODUCERS_RESULT: ${{ needs.parallel-producers.result }}
          POLLINATION_RESULT: ${{ needs.pollination-harvest.result }}
        run: |
          set -euo pipefail
          test "$PRODUCERS_RESULT" = success
          test "$POLLINATION_RESULT" = success
          echo 'CPU_HERD_OK:6:CROSS_PROVIDER'

      - name: Compiler and executable receipt
        shell: bash
        env:
          PRODUCERS_RESULT: ${{ needs.parallel-producers.result }}
        run: |
          set -euo pipefail
          test "$PRODUCERS_RESULT" = success
          echo 'COMPILER_HERD_OK:6'

      - name: Headless browser receipt
        shell: bash
        env:
          BROWSER_RESULT: ${{ needs.browser-canary.result }}
        run: |
          set -euo pipefail
          test "$BROWSER_RESULT" = success
          echo 'BROWSER_HERD_OK:1'

      - name: Harvest summary
        shell: bash
        env:
          PRODUCERS_RESULT: ${{ needs.parallel-producers.result }}
          BROWSER_RESULT: ${{ needs.browser-canary.result }}
          POLLINATION_RESULT: ${{ needs.pollination-harvest.result }}
        run: |
          set -euo pipefail
          test "$PRODUCERS_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$POLLINATION_RESULT" = success
          python3 - <<'PY'
          import json, os
          receipt={
            'schema':'daube.resource-farm-harvest-summary.v4',
            'generation':4,
            'parallelProducerReplicas':6,
            'declaredGithubCpuWorkUnits':1500000,
            'externalPollinatorWorkUnits':250000,
            'browserWorkUnits':32768,
            'crossProviderPollination':True,
            'producerResult':os.environ['PRODUCERS_RESULT'],
            'browserResult':os.environ['BROWSER_RESULT'],
            'pollinationResult':os.environ['POLLINATION_RESULT'],
            'paidSpendAuthorized':False,
            'privateAssetsUsed':False,
          }
          print(json.dumps(receipt, sort_keys=True))
          PY
