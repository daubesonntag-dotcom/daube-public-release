name: Public Release Contract

on:
  pull_request:
    paths:
      - "governance/**"
      - "scripts/validate-public-release-contract.mjs"
      - "scripts/validate-public-release-manifest.mjs"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/repository-contract-check.yml"
      - "AGENTS.md"
      - "README.md"
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "**/*.json"
  push:
    branches: [main]
  schedule:
    - cron: "53 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-release-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate public repository boundary and secret safety
        run: node scripts/validate-public-release-contract.mjs
      - name: Validate public release manifest contract
        run: node scripts/validate-public-release-manifest.mjs
