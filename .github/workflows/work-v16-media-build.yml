name: Work V16 Media Build

on:
  push:
    branches:
      - feat/work-v16-full-stack-pack
    paths:
      - 'scripts/build-work-v16-media.py'
      - '.github/workflows/work-v16-media-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/work-v16-full-stack-pack
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image codecs
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 pillow-avif-plugin==1.5.2
      - name: Generate truthful responsive pack
        run: python scripts/build-work-v16-media.py
      - name: Verify generated media contract
        run: node tests/work-v16-media-contract.test.mjs
      - name: Commit generated media
        shell: bash
        run: |
          if git diff --quiet -- assets/media/hero && git diff --cached --quiet; then
            echo 'No media changes to commit.'
            exit 0
          fi
          git config user.name 'D-AUBE Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/media/hero
          git commit -m 'assets: generate V16 responsive hero pack [skip ci]'
          git push origin HEAD:feat/work-v16-full-stack-pack
