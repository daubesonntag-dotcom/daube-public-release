<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
  <title id="title">D’AUBE SONNTAG — Meaning, made visible.</title>
  <desc id="desc">Canonical D’AUBE SONNTAG footer banner with champagne ribbon, dawn motif and ivory editorial plaque.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset=".55" stop-color="#f7ead8"/><stop offset="1" stop-color="#fff8ed"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dfcb"/><stop offset=".42" stop-color="#d8b594"/><stop offset=".72" stop-color="#f3d8bf"/><stop offset="1" stop-color="#b98b68"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d7b06f"/><stop offset=".5" stop-color="#a8783d"/><stop offset="1" stop-color="#e5c58d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#6c513e" flood-opacity=".18"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <g filter="url(#shadow)">
