name: Cloudflare public credential probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-credential-probe.yml'
      - 'release/cloudflare-credential-probe.trigger'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  credential-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify Cloudflare credential without disclosure
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo '::error title=Cloudflare credential absent::CLOUDFLARE_API_TOKEN is not bound to this GitHub Actions secret plane.'
            exit 41
          fi
          code="$(curl --silent --show-error --output /tmp/cf-token.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header 'Accept: application/json' \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          if [[ "$code" != "200" ]]; then
            echo "::error title=Cloudflare credential rejected::Token verification returned HTTP ${code}."
            exit 42
          fi
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/cf-token.json', encoding='utf-8'))
          if data.get('success') is not True or (data.get('result') or {}).get('status') != 'active':
              raise SystemExit('cloudflare_token_not_active')
          print('CLOUDFLARE_CREDENTIAL_ACTIVE')
          PY

      - name: Publish sanitized credential status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION='Cloudflare credential active on public release executor' ;;
            cancelled) STATE=error; DESCRIPTION='Cloudflare credential probe cancelled' ;;
            *) STATE=failure; DESCRIPTION='Cloudflare credential unavailable on public release executor' ;;
          esac
          export STATE DESCRIPTION
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'state': os.environ['STATE'],
            'context': 'ci/cloudflare-public: credential',
            'description': os.environ['DESCRIPTION'][:140],
            'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }))
          PY
          )"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
