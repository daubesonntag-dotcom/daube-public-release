name: Publish D’AUBE Public Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure GitHub Pages workflow hosting is enabled
        id: pages-preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )

          status="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' "${headers[@]}" "$api")"
          if [[ "$status" == "404" ]]; then
            create_status="$(curl --silent --show-error --output /tmp/pages-create.json --write-out '%{http_code}' \
              --request POST "${headers[@]}" --header 'Content-Type: application/json' \
              --data '{"build_type":"workflow"}' "$api")"
            if [[ "$create_status" == "201" || "$create_status" == "409" ]]; then
              sleep 2
              status="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' "${headers[@]}" "$api")"
            fi
          fi

          if [[ "$status" != "200" ]]; then
            echo "::error title=GitHub Pages unavailable::Pages API returned HTTP $status"
            exit 1
          fi

          build_type="$(python3 -c "import json; print((json.load(open('/tmp/pages.json', encoding='utf-8')).get('build_type') or ''))")"
          echo "Pages enabled with build type: ${build_type:-unknown}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload RẠNG TRONG flagship site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed endpoint is flagship
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --fail --location --silent --show-error \
            --retry 6 --retry-delay 2 --retry-all-errors \
            "$PAGE_URL" --output /tmp/daube-live.html
          test -s /tmp/daube-live.html
          grep -q 'D’AUBE SONNTAG · RẠNG TRONG' /tmp/daube-live.html
          grep -q 'Meaning, made visible.' /tmp/daube-live.html
          grep -q 'Quiet on the surface. Exact underneath.' /tmp/daube-live.html
          grep -q 'b55dbf9c10d2a81607d75d171d2a486fbc026f3f' /tmp/daube-live.html
          {
            echo '## Live flagship publication verified'
            echo
            echo "Endpoint: $PAGE_URL"
            echo 'RẠNG TRONG marker: VERIFIED'
            echo 'Meaning, made visible.: VERIFIED'
            echo 'Flagship proof section: VERIFIED'
            echo 'Canonical daube-web source revision b55dbf9c…: VERIFIED'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish observable commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION='GitHub Pages RẠNG TRONG flagship publication verified' ;;
            cancelled) STATE=error; DESCRIPTION='GitHub Pages flagship publication cancelled' ;;
            *) STATE=failure; DESCRIPTION='GitHub Pages flagship publication failed' ;;
          esac
          export STATE DESCRIPTION
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'state': os.environ['STATE'],
            'context': 'ci/github-pages: publish',
            'description': os.environ['DESCRIPTION'][:140],
            'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }))
          PY
          )"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
