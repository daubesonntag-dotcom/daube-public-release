name: Maison Institutional Projection

on:
  pull_request:
    paths:
      - "config/institution/**"
      - "scripts/institution/**"
      - "tests/maison-projection.test.mjs"
      - ".github/workflows/maison-projection.yml"
  push:
    branches: [main]
    paths:
      - "config/institution/**"
      - "scripts/institution/**"
      - "tests/maison-projection.test.mjs"
      - ".github/workflows/maison-projection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/institution/validate-maison-projection.mjs
      - run: node --test tests/maison-projection.test.mjs
