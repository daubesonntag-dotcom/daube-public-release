name: GitHub App credential presence probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-app-credential-presence-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      S_GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
      S_GH_APP_ID: ${{ secrets.GH_APP_ID }}
      S_DAUBE_GITHUB_APP_ID: ${{ secrets.DAUBE_GITHUB_APP_ID }}
      S_GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
      S_GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      S_DAUBE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.DAUBE_GITHUB_APP_PRIVATE_KEY }}
      S_GITHUB_APP_INSTALLATION_ID: ${{ secrets.GITHUB_APP_INSTALLATION_ID }}
      S_GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
      S_DAUBE_GITHUB_INSTALLATION_ID: ${{ secrets.DAUBE_GITHUB_INSTALLATION_ID }}
    steps:
      - name: Emit presence only
        shell: bash
        run: |
          set -euo pipefail
          for n in GITHUB_APP_ID GH_APP_ID DAUBE_GITHUB_APP_ID GITHUB_APP_PRIVATE_KEY GH_APP_PRIVATE_KEY DAUBE_GITHUB_APP_PRIVATE_KEY GITHUB_APP_INSTALLATION_ID GH_APP_INSTALLATION_ID DAUBE_GITHUB_INSTALLATION_ID; do
            v="S_${n}"
            if [[ -n "${!v:-}" ]]; then p=1; else p=0; fi
            printf '%s=%s\n' "$n" "$p"
          done
