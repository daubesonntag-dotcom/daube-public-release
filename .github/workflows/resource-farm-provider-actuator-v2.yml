name: Resource Farm Provider Actuator V2

on:
  push:
    paths:
      - 'farm/provider-actuator/request.json'
      - 'farm/provider-actuator/plan.mjs'
      - 'farm/provider-actuator/harvest.mjs'
      - 'farm/provider-actuator/publish-receipt.sh'
      - '.github/workflows/resource-farm-provider-actuator-v2.yml'
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resource-farm-provider-actuator-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  ECOLOGY_URL: https://wilqsqndjgckqxbjptxm.supabase.co/functions/v1/daube-resource-farm-ecology

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      request_id: ${{ steps.out.outputs.request_id }}
      github_matrix: ${{ steps.out.outputs.github_matrix }}
      github_replicas: ${{ steps.out.outputs.github_replicas }}
      supabase_replicas: ${{ steps.out.outputs.supabase_replicas }}
      requested_work_units: ${{ steps.out.outputs.requested_work_units }}
      previous_receipt_seen: ${{ steps.out.outputs.previous_receipt_seen }}
      ecology_score: ${{ steps.out.outputs.ecology_score }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require live Ecology GREEN >=95
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -H 'accept: application/json' -H 'cache-control: no-store' \
            "$ECOLOGY_URL" -o /tmp/ecology.json
          jq -e '
            .schema == "daube.resource-farm-ecology-runtime.v1" and
            .status == "GREEN" and
            .score >= 95 and
            .control.actuatorAdmitted == true and
            .guardrails.paidSpendAuthorized == false and
            .guardrails.automaticPrivilegeExpansion == false and
            .guardrails.newOAuthRequired == false and
            (.systems | length) == 10 and
            ([.systems[] | (.status == "GREEN" and .score >= 95)] | all)
          ' /tmp/ecology.json >/dev/null

      - name: Build bounded provider plan
        run: |
          set -euo pipefail
          node farm/provider-actuator/plan.mjs \
            farm/provider-actuator/request.json \
            farm/provider-actuator/latest-receipt.json \
            /tmp/plan.json \
            /tmp/ecology.json
          jq -e '.capacityMet == true and .policy.zeroSpendOnly == true and .providerFamilyCount == 2 and .ecologyGate.admitted == true and .ecologyGate.score >= 95' /tmp/plan.json >/dev/null

      - name: Export dynamic matrix
        id: out
        run: |
          set -euo pipefail
          echo "request_id=$(jq -r '.requestId' /tmp/plan.json)" >> "$GITHUB_OUTPUT"
          echo "github_replicas=$(jq -r '.githubReplicas' /tmp/plan.json)" >> "$GITHUB_OUTPUT"
          echo "supabase_replicas=$(jq -r '.supabaseReplicas' /tmp/plan.json)" >> "$GITHUB_OUTPUT"
          echo "requested_work_units=$(jq -r '.requestedWorkUnits' /tmp/plan.json)" >> "$GITHUB_OUTPUT"
          echo "previous_receipt_seen=$(jq -r '.feedback.previousReceiptSeen' /tmp/plan.json)" >> "$GITHUB_OUTPUT"
          echo "ecology_score=$(jq -r '.ecologyGate.score' /tmp/plan.json)" >> "$GITHUB_OUTPUT"
          echo "github_matrix=$(jq -c '{replica:[range(1;(.githubReplicas + 1))]}' /tmp/plan.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: provider-actuator-${{ steps.out.outputs.request_id }}-plan-${{ github.run_id }}
          path: |
            /tmp/plan.json
            /tmp/ecology.json
          if-no-files-found: error
          retention-days: 7

  github-provider:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.github_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute deterministic GitHub provider work
        run: |
          set -euo pipefail
          node farm/provider-actuator/github-worker.mjs \
            '${{ matrix.replica }}' \
            '${{ needs.plan.outputs.request_id }}' \
            '/tmp/github-${{ matrix.replica }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: provider-actuator-${{ needs.plan.outputs.request_id }}-github-${{ matrix.replica }}-${{ github.run_id }}
          path: /tmp/github-${{ matrix.replica }}.json
          if-no-files-found: error
          retention-days: 7

  supabase-provider:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute bounded Supabase Edge provider work
        run: |
          set -euo pipefail
          node farm/provider-actuator/supabase-dispatch.mjs \
            '${{ needs.plan.outputs.supabase_replicas }}' \
            '10' \
            '/tmp/supabase-bundle.json'
      - uses: actions/upload-artifact@v4
        with:
          name: provider-actuator-${{ needs.plan.outputs.request_id }}-supabase-${{ github.run_id }}
          path: /tmp/supabase-bundle.json
          if-no-files-found: error
          retention-days: 7

  harvest:
    needs: [plan, github-provider, supabase-provider]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          pattern: provider-actuator-${{ needs.plan.outputs.request_id }}-*-${{ github.run_id }}
          path: /tmp/evidence
          merge-multiple: true
      - name: Verify cross-provider harvest + ecology admission
        run: |
          set -euo pipefail
          node farm/provider-actuator/harvest.mjs \
            /tmp/evidence \
            /tmp/provider-actuator-receipt.json \
            '${{ needs.plan.outputs.github_replicas }}' \
            '${{ needs.plan.outputs.supabase_replicas }}' \
            '${{ needs.plan.outputs.requested_work_units }}'
          jq -e '.status == "ADMITTED" and .ecologyAdmission.enforced == true and .ecologyAdmission.admitted == true and .ecologyAdmission.score >= 95 and .ecologyAdmission.allSystemsGreen == true' /tmp/provider-actuator-receipt.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: provider-actuator-${{ needs.plan.outputs.request_id }}-harvest-${{ github.run_id }}
          path: /tmp/provider-actuator-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish audited feedback receipt with optimistic retry
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ needs.plan.outputs.request_id }}
        run: bash farm/provider-actuator/publish-receipt.sh /tmp/provider-actuator-receipt.json "$REQUEST_ID"

      - name: Report actuator truth boundary
        run: |
          jq '{status,requestId,providerFamilies,actualReplicas,totalEvidenceWorkUnits,ecologyAdmission,feedbackClosedLoopObserved,providerExecutionDispatchClosedLoopProven,providerCapacityProvisioningClosedLoopProven,truthBoundary}' \
            /tmp/provider-actuator-receipt.json >> "$GITHUB_STEP_SUMMARY"
