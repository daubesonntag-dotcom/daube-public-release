name: Launch Critical Public Readback V3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-domain-convergence-v1.yml"
      - "release/runtime-admission-target.json"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-critical-public-readback-v3
  cancel-in-progress: true

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout release target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate frozen provider-neutral target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          test -f release/runtime-admission-target.json
          expected_sha="$(jq -r '.expectedSha' release/runtime-admission-target.json)"
          repository="$(jq -r '.repository' release/runtime-admission-target.json)"
          gate="$(jq -r '.runtimeGate' release/runtime-admission-target.json)"
          provider="$(jq -r '.requiredProvider | if . == null then "none" else . end' release/runtime-admission-target.json)"
          rail="$(jq -r '.primaryDomesticRail' release/runtime-admission-target.json)"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$repository" == 'daubesonntag-dotcom/daube-commerce' ]]
          [[ "$gate" == 'provider_neutral_runtime_admission' ]]
          [[ "$provider" == 'none' ]]
          [[ "$rail" == 'direct_vietqr' ]]
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "Frozen commerce candidate: $expected_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Required runtime provider: NONE (provider-neutral)" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify canonical public apex
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 20 \
            https://daubesonntag.com/ --output /tmp/apex.html
          test -s /tmp/apex.html
          grep -Fq 'D’AUBE SONNTAG' /tmp/apex.html
          grep -Fq 'RẠNG TRONG' /tmp/apex.html
          grep -Eq '/assets/[^"'"'"'[:space:]]+' /tmp/apex.html
          apex_hash="$(sha256sum /tmp/apex.html | awk '{print $1}')"
          asset_count="$(grep -Eo '/assets/[^"'"'"'[:space:]]+' /tmp/apex.html | sort -u | wc -l | tr -d ' ')"
          {
            echo
            echo '## Public apex'
            echo '- state: LIVE'
            echo '- HTTPS: PASS'
            echo '- D’AUBE/RẠNG TRONG markers: PASS'
            echo "- Vite asset refs: ${asset_count}"
            echo "- response SHA-256: ${apex_hash}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe provider-neutral commerce runtime
        id: runtime
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -u -o pipefail
          common=(--silent --show-error --connect-timeout 10 --max-time 20 --header 'Accept: application/json' --header 'Origin: https://daubesonntag.com' --header 'Cache-Control: no-cache')
          health_http="$(curl "${common[@]}" --output /tmp/health.json --write-out '%{http_code}' https://commerce.daubesonntag.com/healthz || true)"
          products_http="$(curl "${common[@]}" --output /tmp/products.json --write-out '%{http_code}' https://commerce.daubesonntag.com/v1/products || true)"
          turns_http="$(curl "${common[@]}" --output /tmp/turns.json --write-out '%{http_code}' https://commerce.daubesonntag.com/v1/turns || true)"
          [[ "$health_http" =~ ^[0-9]{3}$ ]] || health_http=000
          [[ "$products_http" =~ ^[0-9]{3}$ ]] || products_http=000
          [[ "$turns_http" =~ ^[0-9]{3}$ ]] || turns_http=000
          export HEALTH_HTTP="$health_http" PRODUCTS_HTTP="$products_http" TURNS_HTTP="$turns_http" EXPECTED_SHA

          python3 - <<'PY'
          import json, os
          from pathlib import Path

          def load(path, default):
              try:
                  return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:
                  return default

          health = load('/tmp/health.json', {})
          products = load('/tmp/products.json', None)
          turns = load('/tmp/turns.json', {})
          expected = os.environ['EXPECTED_SHA']
          blockers = []

          if os.environ['HEALTH_HTTP'] != '200': blockers.append('HEALTH_HTTP_NOT_200')
          if os.environ['PRODUCTS_HTTP'] != '200': blockers.append('PRODUCTS_HTTP_NOT_200')
          if os.environ['TURNS_HTTP'] != '200': blockers.append('TURNS_HTTP_NOT_200')

          source = health.get('sourceRevision') if isinstance(health, dict) else None
          if source != expected: blockers.append('EXACT_SHA_NOT_DEPLOYED')
          if not isinstance(health, dict) or health.get('status') != 'READY': blockers.append('HEALTH_NOT_READY')

          product_ok = False
          first_dawn_product = False
          if isinstance(products, list) and products:
              product_ok = all(
                  isinstance(p, dict) and isinstance(p.get('id'), str) and p.get('id') and
                  isinstance(p.get('sku'), str) and p.get('sku') and
                  isinstance(p.get('price'), dict) and isinstance(p['price'].get('amountMinor'), int) and
                  p['price'].get('currency') in ('VND', 'USD')
                  for p in products
              )
              first_dawn_product = any(
                  isinstance(p, dict) and p.get('id') == 'paradox-decision-veto' and
                  p.get('sku') == 'DS-PARADOX-VETO-01' and
                  isinstance(p.get('price'), dict) and p['price'].get('amountMinor') == 49000 and
                  p['price'].get('currency') == 'VND'
                  for p in products
              )
          if not product_ok: blockers.append('PUBLIC_PRODUCTS_INVALID')
          if not first_dawn_product: blockers.append('FIRST_DAWN_PRODUCT_MISSING')

          first_dawn_turn = False
          if isinstance(turns, dict) and turns.get('schema') == 'daube.experience-turn-list.v1' and isinstance(turns.get('turns'), list):
              first_dawn_turn = any(
                  isinstance(t, dict) and t.get('turnId') == 'first-dawn-decision-veto-v1' and
                  t.get('availability') == 'AVAILABLE' and t.get('claimable') is True and
                  t.get('capacity') == 36
                  for t in turns['turns']
              )
          if not first_dawn_turn: blockers.append('FIRST_DAWN_TURN_MISSING_OR_UNAVAILABLE')

          direct_runtime = bool(
              isinstance(health, dict) and
              health.get('directPayOperational') is True and
              health.get('directPayApproved') is True and
              health.get('directPayAccountOwnershipVerified') is True and
              health.get('directPaySettlementMode') in ('manual_verified', 'bank_api')
          )

          runtime_ready = not blockers
          receipt = {
              'schema': 'daube.provider-neutral-public-readback.v3',
              'expectedRevision': expected,
              'reportedRevision': source,
              'runtimeAdmission': 'PASS' if runtime_ready else 'HOLD',
              'requiredProvider': None,
              'healthHttp': os.environ['HEALTH_HTTP'],
              'productsHttp': os.environ['PRODUCTS_HTTP'],
              'turnsHttp': os.environ['TURNS_HTTP'],
              'healthStatus': health.get('status') if isinstance(health, dict) else None,
              'publicProductsValid': product_ok,
              'firstDawnProductPresent': first_dawn_product,
              'firstDawnTurnAvailable': first_dawn_turn,
              'directVietQrRuntimeOperational': direct_runtime,
              'directVietQrSettlementProvenByThisReceipt': False,
              'independentCustomerRevenueProvenByThisReceipt': False,
              'refundProvenByThisReceipt': False,
              'productionMutationPerformed': False,
              'secretMaterialSerialized': False,
              'blockers': blockers,
          }
          Path('/tmp/provider-neutral-public-readback.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, sort_keys=True))
          PY

          runtime_state="$(jq -r '.runtimeAdmission' /tmp/provider-neutral-public-readback.json)"
          reported_sha="$(jq -r '.reportedRevision // "unknown"' /tmp/provider-neutral-public-readback.json)"
          direct_state="$(jq -r 'if .directVietQrRuntimeOperational then "READY" else "HOLD" end' /tmp/provider-neutral-public-readback.json)"
          blockers="$(jq -r '.blockers | if length == 0 then "none" else join(",") end' /tmp/provider-neutral-public-readback.json)"
          {
            echo
            echo '## Provider-neutral runtime admission'
            echo "- frozen expected SHA: ${EXPECTED_SHA}"
            echo "- externally reported SHA: ${reported_sha}"
            echo "- runtime gate: ${runtime_state}"
            echo "- /healthz: ${health_http}"
            echo "- /v1/products: ${products_http}"
            echo "- /v1/turns: ${turns_http}"
            echo "- Direct VietQR runtime configuration: ${direct_state}"
            echo "- blockers: ${blockers}"
            echo '- external settlement proven: NO'
            echo '- independent customer revenue proven: NO'
            echo '- refund proven: NO'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "runtime_state=$runtime_state" >> "$GITHUB_OUTPUT"

      - name: Upload sanitized runtime receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-neutral-runtime-readback-${{ steps.target.outputs.expected_sha }}
          if-no-files-found: error
          retention-days: 7
          path: /tmp/provider-neutral-public-readback.json

      - name: Enforce frozen exact-candidate runtime gate
        if: always()
        shell: bash
        env:
          RUNTIME_STATE: ${{ steps.runtime.outputs.runtime_state }}
        run: |
          set -euo pipefail
          [[ "$RUNTIME_STATE" == 'PASS' ]] || {
            echo '::error::Frozen exact-candidate runtime admission is not yet satisfied.'
            exit 22
          }
          echo 'PROVIDER_NEUTRAL_EXACT_CANDIDATE_RUNTIME_VERIFIED' >> "$GITHUB_STEP_SUMMARY"
