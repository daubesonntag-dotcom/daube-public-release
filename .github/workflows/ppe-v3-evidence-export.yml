name: PPE V3 Evidence Export — Site

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'scripts/ppe-export-v3.mjs'
      - '.github/workflows/ppe-v3-evidence-export.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'scripts/ppe-export-v3.mjs'
      - '.github/workflows/ppe-v3-evidence-export.yml'

permissions:
  contents: read

concurrency:
  group: ppe-v3-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Export exact revision + APK build receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and hash APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          bytes="$(stat -c%s "$apk")"
          test "$bytes" -gt 20000
          digest="$(sha256sum "$apk" | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build explicit receipt specification
        env:
          SUBJECT_SHA: ${{ github.sha }}
          APK_DIGEST: ${{ steps.apk.outputs.digest }}
          APK_BYTES: ${{ steps.apk.outputs.bytes }}
        run: |
          mkdir -p .daube/ppe-v3
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sha = process.env.SUBJECT_SHA;
          const digest = process.env.APK_DIGEST;
          const bytes = process.env.APK_BYTES;
          const receipts = [
            {
              sourceId: 'PPE-SRC-SITE-EXACT-REVISION',
              evidenceClass: 'exact-revision',
              sourceKind: 'git-commit',
              outcome: 'verified',
              producer: 'site-ppe-v3-exporter',
              immutableRefs: [`git+https://github.com/daubesonntag-dotcom/daube-site@${sha}`],
              limitations: 'Proves only the exact repository subject revision checked out by this evidence exporter.'
            },
            {
              sourceId: 'PPE-SRC-SITE-APK-BUILD',
              evidenceClass: 'build',
              sourceKind: 'workflow-artifact',
              outcome: 'success',
              producer: 'site-ppe-v3-exporter',
              immutableRefs: [`git+https://github.com/daubesonntag-dotcom/daube-site@${sha}`, `sha256:${digest}`],
              limitations: `Debug APK build evidence only (${bytes} bytes); does not prove browser/device matrix, accessibility, performance, runtime health, public claims, security/privacy, rollback, Founder Gold or production approval.`
            }
          ];
          fs.writeFileSync('.daube/ppe-v3/receipt-spec.json', JSON.stringify(receipts, null, 2));
          NODE

      - name: Export PPE-V3 envelope
        env:
          PPE_PRODUCT_ID: daube-site
          PPE_EXPORTER_ID: PPE-EXP-DAUBE-SITE-V3
          PPE_REPOSITORY: daubesonntag-dotcom/daube-site
          PPE_SUBJECT_REVISION: ${{ github.sha }}
          PPE_RECEIPTS_FILE: .daube/ppe-v3/receipt-spec.json
          PPE_OUTPUT_FILE: dist/ppe-v3/export.json
        run: node scripts/ppe-export-v3.mjs

      - name: Enforce truth boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('dist/ppe-v3/export.json', 'utf8'));
          if (value.subjectRevision !== process.env.GITHUB_SHA) throw new Error('subject revision mismatch');
          const classes = value.receipts.map((row) => row.evidenceClass).sort();
          if (JSON.stringify(classes) !== JSON.stringify(['build', 'exact-revision'])) throw new Error(`unexpected exported classes: ${classes.join(',')}`);
          if (value.receipts.some((row) => ['browser-device','accessibility','performance','runtime-health','public-claim','security-privacy','rollback'].includes(row.evidenceClass))) throw new Error('unsupported Site evidence was fabricated');
          console.log('Site PPE-V3 export is partial evidence only; production remains unapproved.');
          NODE

      - name: Upload immutable evidence export
        uses: actions/upload-artifact@v7
        with:
          name: ppe-v3-site-${{ github.sha }}
          path: |
            dist/ppe-v3/export.json
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
