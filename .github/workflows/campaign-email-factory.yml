name: Campaign Email Factory

on:
  pull_request:
    paths:
      - "campaigns/email/**"
      - "scripts/render-email-campaign.mjs"
      - "email-preview/generated/**"
      - ".github/workflows/campaign-email-factory.yml"
  push:
    branches: [main]
    paths:
      - "campaigns/email/**"
      - "scripts/render-email-campaign.mjs"
      - "email-preview/generated/**"
      - ".github/workflows/campaign-email-factory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campaign-email-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax check compiler
        run: node --check scripts/render-email-campaign.mjs
      - name: Render every campaign spec
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/campaign-email
          shopt -s nullglob
          specs=(campaigns/email/*.json)
          test "${#specs[@]}" -gt 0
          for input in "${specs[@]}"; do
            slug="$(basename "$input" .json)"
            node scripts/render-email-campaign.mjs \
              --input "$input" \
              --out "artifacts/campaign-email/${slug}.html" \
              --text "artifacts/campaign-email/${slug}.txt"
          done
      - name: Verify production-safe outputs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(campaigns/email/*.json)
          for input in "${specs[@]}"; do
            slug="$(basename "$input" .json)"
            html="artifacts/campaign-email/${slug}.html"
            text="artifacts/campaign-email/${slug}.txt"
            test -s "$html"
            test -s "$text"
            grep -q '<h1' "$html"
            grep -q 'https://' "$html"
            ! grep -Eqi 'content://|file://|javascript:' "$html" "$text"
          done
      - name: Upload rendered campaign evidence
        uses: actions/upload-artifact@v7
        with:
          name: campaign-email-factory
          path: artifacts/campaign-email/
          retention-days: 7
