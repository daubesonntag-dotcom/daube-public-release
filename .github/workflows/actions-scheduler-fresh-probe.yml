name: Fresh GitHub Actions Runner-Pool Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/actions-scheduler-fresh-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: printf 'DAUBE_RUNNER_POOL=ubuntu-latest PASS\n'

  slim:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - run: printf 'DAUBE_RUNNER_POOL=ubuntu-slim PASS\n'

  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - run: printf 'DAUBE_RUNNER_POOL=ubuntu-24.04-arm PASS\n'
