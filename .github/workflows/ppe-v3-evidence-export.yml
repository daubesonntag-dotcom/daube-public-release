name: PPE V3 Evidence Export — Site

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'backend-config.json'
      - 'build.gradle'
      - 'settings.gradle'
      - 'scripts/nexus-browser-evidence.mjs'
      - 'scripts/ppe-export-v3.mjs'
      - '.github/workflows/ppe-v3-evidence-export.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'backend-config.json'
      - 'build.gradle'
      - 'settings.gradle'
      - 'scripts/nexus-browser-evidence.mjs'
      - 'scripts/ppe-export-v3.mjs'
      - '.github/workflows/ppe-v3-evidence-export.yml'

permissions:
  contents: read

concurrency:
  group: ppe-v3-site-${{ github.ref }}
  cancel-in-progress: true

env:
  PPE_EXACT_SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  export:
    name: Export exact revision + APK build + scoped runtime health receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact subject revision
        uses: actions/checkout@v5
        with:
          ref: ${{ env.PPE_EXACT_SUBJECT_SHA }}
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and hash APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          bytes="$(stat -c%s "$apk")"
          test "$bytes" -gt 20000
          digest="$(sha256sum "$apk" | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Produce scoped Nexus runtime evidence
        run: node scripts/nexus-browser-evidence.mjs

      - name: Enforce scoped runtime-health truth boundary
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const value = JSON.parse(await readFile('.daube/evidence/nexus-browser/evidence.json', 'utf8'));
          if (value.status !== 'PASS') throw new Error('Nexus rendered evidence is not PASS');
          if (!value.truthBoundary?.browserAssetRuntimeVerified) throw new Error('browser asset runtime unverified');
          if (!value.truthBoundary?.backendNetworkOutcomeVerified) throw new Error('backend network outcome unverified');
          if (value.truthBoundary?.physicalAndroidWebViewDeviceVerified !== false) throw new Error('physical WebView boundary must remain explicit');
          if (value.truthBoundary?.founderGoldVisualConfirmed !== false) throw new Error('Founder Gold must not be self-declared');
          if (value.finalState?.system !== 'Online' || value.finalState?.historyCount !== '2') throw new Error('final runtime state mismatch');
          if (!Array.isArray(value.observedRequests) || !value.observedRequests.some(item => item.method === 'POST' && item.path === '/api/v1/quest')) throw new Error('real quest request missing');
          NODE
          digest="$(sha256sum .daube/evidence/nexus-browser/evidence.json | cut -d' ' -f1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build explicit receipt specification
        env:
          SUBJECT_SHA: ${{ env.PPE_EXACT_SUBJECT_SHA }}
          APK_DIGEST: ${{ steps.apk.outputs.digest }}
          APK_BYTES: ${{ steps.apk.outputs.bytes }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          mkdir -p .daube/ppe-v3
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const sha = process.env.SUBJECT_SHA;
          const apkDigest = process.env.APK_DIGEST;
          const bytes = process.env.APK_BYTES;
          const runtimeDigest = process.env.RUNTIME_DIGEST;
          const receipts = [
            {
              sourceId: 'PPE-SRC-SITE-EXACT-REVISION',
              evidenceClass: 'exact-revision',
              sourceKind: 'git-commit',
              outcome: 'verified',
              producer: 'site-ppe-v3-exporter',
              immutableRefs: [`git+https://github.com/daubesonntag-dotcom/daube-site@${sha}`],
              limitations: 'Proves only the exact repository subject revision checked out by this evidence exporter.'
            },
            {
              sourceId: 'PPE-SRC-SITE-APK-BUILD',
              evidenceClass: 'build',
              sourceKind: 'workflow-artifact',
              outcome: 'success',
              producer: 'site-ppe-v3-exporter',
              immutableRefs: [`git+https://github.com/daubesonntag-dotcom/daube-site@${sha}`, `sha256:${apkDigest}`],
              limitations: `Debug APK build evidence only (${bytes} bytes); does not prove browser/device matrix, accessibility, performance, public claims, security/privacy, rollback, Founder Gold or production approval.`
            },
            {
              sourceId: 'PPE-SRC-SITE-RUNTIME-HEALTH',
              evidenceClass: 'runtime-health',
              sourceKind: 'runtime-probe',
              outcome: 'verified',
              producer: 'site-ppe-v3-exporter',
              immutableRefs: [`git+https://github.com/daubesonntag-dotcom/daube-site@${sha}`, `sha256:${runtimeDigest}`],
              limitations: 'Scoped rendered browser-asset runtime and backend network-outcome evidence from the Nexus harness. It explicitly does not prove a physical Android WebView/device matrix, accessibility, performance, Founder Gold, public claims, security/privacy, rollback or overall production approval.'
            }
          ];
          fs.writeFileSync('.daube/ppe-v3/receipt-spec.json', JSON.stringify(receipts, null, 2));
          NODE

      - name: Export PPE-V3 envelope
        env:
          PPE_PRODUCT_ID: daube-site
          PPE_EXPORTER_ID: PPE-EXP-DAUBE-SITE-V3
          PPE_REPOSITORY: daubesonntag-dotcom/daube-site
          PPE_SUBJECT_REVISION: ${{ env.PPE_EXACT_SUBJECT_SHA }}
          PPE_RECEIPTS_FILE: .daube/ppe-v3/receipt-spec.json
          PPE_OUTPUT_FILE: dist/ppe-v3/export.json
        run: node scripts/ppe-export-v3.mjs

      - name: Enforce exporter class boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('dist/ppe-v3/export.json', 'utf8'));
          if (value.subjectRevision !== process.env.PPE_EXACT_SUBJECT_SHA) throw new Error('subject revision mismatch');
          const classes = value.receipts.map((row) => row.evidenceClass).sort();
          if (JSON.stringify(classes) !== JSON.stringify(['build', 'exact-revision', 'runtime-health'])) throw new Error(`unexpected exported classes: ${classes.join(',')}`);
          if (value.receipts.some((row) => ['browser-device','accessibility','performance','public-claim','security-privacy','rollback'].includes(row.evidenceClass))) throw new Error('unsupported Site evidence was fabricated');
          console.log('Site PPE-V3 export contains exact-revision, build and scoped runtime-health evidence only; production remains unapproved.');
          NODE

      - name: Upload immutable evidence export
        uses: actions/upload-artifact@v7
        with:
          name: ppe-v3-site-${{ env.PPE_EXACT_SUBJECT_SHA }}
          path: |
            dist/ppe-v3/export.json
            .daube/evidence/nexus-browser/evidence.json
            app/build/outputs/apk/debug/app-debug.apk
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
