name: Public apex exact-revision readback

on:
  push:
    branches:
      - ops/public-apex-exact-readback-20260830
    paths:
      - '.github/workflows/public-apex-exact-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_WEB_SHA: cc3c23586bae6310fc5d7f37c30d94d8f05cce7c
      APEX_URL: https://daubesonntag.com/
      REVISION_URL: https://daubesonntag.com/__daube/revision.json
      COMMERCE_HEALTH_URL: https://commerce.daubesonntag.com/healthz
      COMMERCE_PRODUCTS_URL: https://commerce.daubesonntag.com/v1/products
    steps:
      - name: Observe public surfaces without mutation
        shell: bash
        run: |
          set -euo pipefail

          probe() {
            local url="$1"
            local output="$2"
            curl --silent --show-error --location \
              --max-time 25 \
              --header 'Cache-Control: no-cache' \
              --header 'Pragma: no-cache' \
              --output "$output" \
              --write-out '%{http_code}' \
              "${url}?daube-readback=${GITHUB_SHA}" || true
          }

          root_code="$(probe "$APEX_URL" /tmp/apex.html)"
          revision_code="$(probe "$REVISION_URL" /tmp/revision.json)"
          health_code="$(probe "$COMMERCE_HEALTH_URL" /tmp/commerce-health.json)"
          products_code="$(probe "$COMMERCE_PRODUCTS_URL" /tmp/commerce-products.json)"

          printf 'apex_http=%s\nrevision_http=%s\ncommerce_health_http=%s\ncommerce_products_http=%s\n' \
            "$root_code" "$revision_code" "$health_code" "$products_code"

          [[ "$root_code" == 200 ]] || { echo "APEX_HTTP_NOT_200=$root_code" >&2; exit 31; }
          grep -Fq '<title>D’AUBE SONNTAG · RẠNG TRONG</title>' /tmp/apex.html \
            || { echo 'APEX_CANONICAL_TITLE_MISSING' >&2; exit 32; }
          grep -Fq '/assets/' /tmp/apex.html \
            || { echo 'APEX_VITE_ASSET_REFERENCE_MISSING' >&2; exit 33; }

          [[ "$revision_code" == 200 ]] || { echo "REVISION_HTTP_NOT_200=$revision_code" >&2; exit 34; }
          python3 - "$EXPECTED_WEB_SHA" <<'PY'
          import json, sys
          expected = sys.argv[1]
          with open('/tmp/revision.json', encoding='utf-8') as handle:
              data = json.load(handle)
          checks = {
              'schema': data.get('schema') == 'daube.web.source-revision.v1',
              'repository': data.get('repository') == 'daubesonntag-dotcom/daube-web',
              'sourceRevision': data.get('sourceRevision') == expected,
          }
          failed = [name for name, ok in checks.items() if not ok]
          print(json.dumps({
              'webRevision': data.get('sourceRevision'),
              'expectedWebRevision': expected,
              'exactRevisionMatch': not failed,
              'failedChecks': failed,
          }, sort_keys=True))
          if failed:
              raise SystemExit(35)
          PY

          [[ "$health_code" == 200 ]] || { echo "COMMERCE_HEALTH_HTTP_NOT_200=$health_code" >&2; exit 36; }
          python3 - <<'PY'
          import json
          with open('/tmp/commerce-health.json', encoding='utf-8') as handle:
              data = json.load(handle)
          ready = data.get('ready') is True or data.get('status') == 'READY'
          blocked = data.get('systemBlocked') is True
          print(json.dumps({
              'commerceStatus': data.get('status'),
              'commerceReady': ready,
              'systemBlocked': data.get('systemBlocked'),
              'revision': data.get('revision') or data.get('releaseSha') or data.get('sourceRevision'),
          }, sort_keys=True))
          if not ready or blocked:
              raise SystemExit(37)
          PY

          [[ "$products_code" == 200 ]] || { echo "COMMERCE_PRODUCTS_HTTP_NOT_200=$products_code" >&2; exit 38; }
          python3 - <<'PY'
          import json
          with open('/tmp/commerce-products.json', encoding='utf-8') as handle:
              data = json.load(handle)
          if isinstance(data, list):
              count = len(data)
          elif isinstance(data, dict):
              products = data.get('products') or data.get('items') or data.get('data')
              count = len(products) if isinstance(products, list) else None
          else:
              count = None
          print(json.dumps({'commerceProductsJson': True, 'productCount': count}, sort_keys=True))
          PY

          python3 - "$EXPECTED_WEB_SHA" "$root_code" "$revision_code" "$health_code" "$products_code" <<'PY' | tee /tmp/public-readback-receipt.json
          import datetime, json, sys
          expected, root, revision, health, products = sys.argv[1:]
          print(json.dumps({
              'schema': 'daube.public-apex-external-readback.v1',
              'observer': 'github-public-hosted-ubuntu',
              'mutationPerformed': False,
              'secretsUsed': False,
              'expectedWebRevision': expected,
              'apexHttp': int(root),
              'revisionHttp': int(revision),
              'commerceHealthHttp': int(health),
              'commerceProductsHttp': int(products),
              'result': 'PASS',
              'observedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }, indent=2, sort_keys=True))
          PY

          {
            echo '## D’AUBE external public readback'
            echo
            echo "- Apex: HTTP ${root_code}"
            echo "- Exact web revision: \`${EXPECTED_WEB_SHA}\`"
            echo "- Revision artifact: HTTP ${revision_code} / exact match"
            echo "- Commerce health: HTTP ${health_code} / READY"
            echo "- Commerce products: HTTP ${products_code}"
            echo '- Mutation: none'
            echo '- Secrets: none'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "DAUBE_PUBLIC_APEX_EXACT_READBACK_PASS web=${EXPECTED_WEB_SHA}"
