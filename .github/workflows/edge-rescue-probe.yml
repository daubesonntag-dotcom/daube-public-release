name: Edge rescue probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edge-rescue-probe.yml'

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Identify stale root hooks
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --location --dump-header /tmp/root.headers --output /tmp/root.html https://daubesonntag.com/
          echo '--- root cache ---'
          grep -Ei '^(HTTP/|cf-cache-status:|cache-control:|etag:|age:)' /tmp/root.headers || true
          echo '--- root title ---'
          grep -Eio '<title>[^<]*</title>' /tmp/root.html | head -5 || true
          echo '--- root assets ---'
          grep -Eio '(href|src)=["'"'][^"'"']+["'"']' /tmp/root.html | head -80 || true
          echo '--- hooks ---'
          grep -Eio 'coming-soon\.(js|css)|mobile-first-flagship-v3\.(js|css)|data-coming-soon|COMING SOON' /tmp/root.html | sort -u || true
          printf 'root_sha=%s\n' "$(sha256sum /tmp/root.html | awk '{print $1}')" | tee /tmp/receipt

      - name: Publish compact receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          summary="$(cat /tmp/receipt 2>/dev/null || echo no-receipt)"
          payload="$(python3 - "$summary" <<'PY'
          import json,sys
          print(json.dumps({'state':'success','context':'ops/edge-rescue-hooks','description':sys.argv[1][:140]}))
          PY
          )"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
