  <g stroke="#b58a55" stroke-width="2" opacity=".8"><path d="M635 250h105M1060 250h105"/><path d="M670 362h95M1035 362h95"/></g>

  <!-- typography -->
  <text x="900" y="332" text-anchor="middle" fill="#34261f" font-family="Georgia, 'Times New Roman', serif" font-size="86" letter-spacing="4">D’AUBE SONNTAG</text>
  <text x="900" y="384" text-anchor="middle" fill="#4a382e" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-style="italic" letter-spacing="2">Meaning, made visible.</text>

  <!-- sparkles -->
