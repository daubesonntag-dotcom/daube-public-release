name: Resource Farm Generation 8 Quarantine Recovery

on:
  pull_request:
    paths:
      - '.github/workflows/resource-farm-generation8-quarantine.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/resource-farm-generation8-quarantine.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: resource-farm-generation8-quarantine-${{ github.ref }}
  cancel-in-progress: true

env:
  FARM_GENERATION: '8'
  FARM_EQUILIBRIUM_REPLICAS: '7'
  FARM_CANDIDATE_REPLICAS: '8'
  FARM_WORK_UNITS_PER_PRODUCER: '250000'
  FARM_RUNTIME_FLOOR_RATIO: '0.85'
  FARM_TARGET_GITHUB_THROUGHPUT: '25000000'

jobs:
  quarantine-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      quarantine_shard: ${{ steps.plan.outputs.quarantine_shard }}
      prior_run_id: ${{ steps.discover.outputs.prior_run_id }}
      prior_replicas: ${{ steps.plan.outputs.prior_replicas }}
      prior_throughput: ${{ steps.plan.outputs.prior_throughput }}
    steps:
      - name: Discover canonical generation 7 seed bank
        id: discover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']; api='https://api.github.com'
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','User-Agent':'daube-resource-farm-generation8/1'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=15) as r: return json.load(r)
          runs=get(f'{api}/repos/{repo}/actions/workflows/resource-farm-generation7-stability.yml/runs?branch=main&status=success&per_page=10')['workflow_runs']
          prior=None
          for run in runs:
              artifacts=get(f'{api}/repos/{repo}/actions/runs/{run["id"]}/artifacts?per_page=100').get('artifacts',[])
              if any(a.get('name')=='farm-generation-7-seed-bank' and not a.get('expired',False) for a in artifacts):
                  prior=run; break
          if not prior: raise SystemExit('no fresh canonical generation-7 seed bank: fail closed')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'prior_run_id={prior["id"]}\n')
          print(json.dumps({'schema':'daube.resource-farm-quarantine-seed-discovery.v1','generation':8,'priorRunId':prior['id'],'seedBank':'farm-generation-7-seed-bank'},sort_keys=True))
          PY
      - name: Germinate generation 7 seed bank
        uses: actions/download-artifact@v4
        with:
          name: farm-generation-7-seed-bank
          path: /tmp/prior-seed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.discover.outputs.prior_run_id }}
      - name: Plan quarantine and reserve candidate
        id: plan
        shell: bash
        env:
          PRIOR_RUN_ID: ${{ steps.discover.outputs.prior_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, json, os
          files=glob.glob('/tmp/prior-seed/**/*.json',recursive=True)
          if not files: raise SystemExit('generation-7 seed bank has no JSON receipt')
          seed=json.load(open(files[0])); prior_replicas=int(seed.get('producerReplicas') or 0); prior_throughput=float(seed.get('githubParallelThroughput') or 0)
          equilibrium=int(os.environ['FARM_EQUILIBRIUM_REPLICAS']); candidates=int(os.environ['FARM_CANDIDATE_REPLICAS'])
          if prior_replicas!=equilibrium or prior_throughput<=0: raise SystemExit('generation-7 equilibrium evidence is invalid')
          if candidates != equilibrium + 1: raise SystemExit('quarantine trial requires exactly one reserve candidate')
          # Derive the synthetic fault target from canonical evidence so the lane is deterministic but not hand-picked.
          quarantine_shard=int(seed.get('seedBankArtifactId') or 9694645249) % candidates
          matrix=list(range(candidates))
          plan={'schema':'daube.resource-farm-quarantine-plan.v1','generation':8,'priorRunId':int(os.environ['PRIOR_RUN_ID']),'priorReplicas':prior_replicas,'priorGithubParallelThroughput':prior_throughput,'equilibriumReplicas':equilibrium,'candidateReplicas':candidates,'reserveCandidates':1,'quarantineShard':quarantine_shard,'faultMode':'synthetic-receipt-health-fault','matrix':matrix,'paidSpendAuthorized':False,'privateAssetsUsed':False}
          json.dump(plan,open('/tmp/quarantine-plan.json','w'),sort_keys=True); print(json.dumps(plan,sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n'); f.write(f'quarantine_shard={quarantine_shard}\nprior_replicas={prior_replicas}\nprior_throughput={prior_throughput}\n')
          PY
      - name: Store quarantine plan
        uses: actions/upload-artifact@v4
        with:
          name: farm-generation-8-quarantine-plan
          path: /tmp/quarantine-plan.json
          if-no-files-found: error
          retention-days: 7

  candidate-producers:
    needs: quarantine-plan
    name: candidate-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.quarantine-plan.outputs.matrix) }}
    steps:
      - name: CPU candidate receipt
        shell: bash
        env:
          FARM_SHARD: ${{ matrix.shard }}
          QUARANTINE_SHARD: ${{ needs.quarantine-plan.outputs.quarantine_shard }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,platform,time
          shard=int(os.environ['FARM_SHARD']); quarantine=int(os.environ['QUARANTINE_SHARD']); work=int(os.environ['FARM_WORK_UNITS_PER_PRODUCER'])
          started=time.perf_counter(); digest=hashlib.sha256()
          for i in range(work): digest.update(f'daube-farm-generation-8-{shard}-{i}'.encode())
          elapsed=max(time.perf_counter()-started,1e-9); injected=shard==quarantine
          receipt={'schema':'daube.resource-farm-candidate-receipt.v8','generation':8,'resourceClasses':['compute','ci-build'],'poolId':f'github-public-runner-{shard}','providerFamily':'github-public-runner','backend':'github-hosted-linux-cpu','shard':shard,'runnerOS':platform.system(),'arch':platform.machine(),'cpuCount':os.cpu_count(),'workUnits':work,'workUnitsPerSecond':round(work/elapsed,2),'latencyMs':round(elapsed*1000,2),'sha256':digest.hexdigest(),'success':True,'syntheticFaultInjected':injected,'healthState':'QUARANTINED_SYNTHETIC_FAULT' if injected else 'HEALTHY','eligibleForHarvest':not injected,'observedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'paidSpendAuthorized':False,'privateAssetsUsed':False}
          json.dump(receipt,open(f'/tmp/candidate-{shard}.json','w'),sort_keys=True); print(json.dumps(receipt,sort_keys=True)); assert receipt['runnerOS']=='Linux' and receipt['cpuCount']>=1 and receipt['workUnitsPerSecond']>0
          PY
      - name: Compiler candidate receipt
        shell: bash
        env:
          FARM_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cat >/tmp/farm8_canary.c <<'C'
          #include <stdio.h>
          #include <stdlib.h>
          int main(int argc,char **argv){unsigned long s=(argc>1)?strtoul(argv[1],0,10):0;unsigned long x=2166136261u+s;for(unsigned long i=0;i<100000;i++){x^=(i+s);x*=16777619u;}printf("FARM8_COMPILED_OK:%lu:%lu\n",s,x);return 0;}
          C
          gcc -O2 /tmp/farm8_canary.c -o /tmp/farm8_canary; /tmp/farm8_canary "$FARM_SHARD" | grep -q "^FARM8_COMPILED_OK:${FARM_SHARD}:"
      - name: Store candidate pollen receipt
        uses: actions/upload-artifact@v4
        with:
          name: farm8-candidate-${{ matrix.shard }}
          path: /tmp/candidate-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  browser-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Headless browser production receipt
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          printf '%s' '<!doctype html><div id="r">boot</div><script>let x=0;for(let i=0;i<32768;i++)x=(x^((i*2654435761)>>>0))>>>0;document.getElementById("r").textContent="FARM8_BROWSER_OK:"+x</script>' >/tmp/farm8-browser.html
          python3 -m http.server 8765 --directory /tmp >/tmp/farm8-http.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1
          "$CHROME" --headless --no-sandbox --disable-gpu --dump-dom http://127.0.0.1:8765/farm8-browser.html | grep -q 'FARM8_BROWSER_OK:'

  quarantine-harvest:
    if: always()
    needs: [quarantine-plan, candidate-producers, browser-canary]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Admit trial inputs
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.quarantine-plan.result }}
          CANDIDATES_RESULT: ${{ needs.candidate-producers.result }}
          BROWSER_RESULT: ${{ needs.browser-canary.result }}
        run: 'test "$PLAN_RESULT" = success && test "$CANDIDATES_RESULT" = success && test "$BROWSER_RESULT" = success'
      - name: Collect candidate receipts
        uses: actions/download-artifact@v4
        with:
          pattern: farm8-candidate-*
          path: /tmp/farm8-pollen
          merge-multiple: true
      - name: Collect Supabase Edge pollen
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 15 --header 'accept: application/json' 'https://wilqsqndjgckqxbjptxm.supabase.co/functions/v1/daube-resource-farm-pollen-edge/v1/farm/pollen?generation=8' --output /tmp/farm8-pollen/supabase-edge.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/farm8-pollen/supabase-edge.json')); assert r['schema']=='daube.resource-farm-pollen-receipt.v2' and r['generation']==8 and r['providerFamily']=='supabase-edge' and r['workUnits']==250000 and r['workUnitsPerSecond']>0 and r['success'] is True and r['paidSpendAuthorized'] is False and r['privateAssetsUsed'] is False; print(json.dumps(r,sort_keys=True))
          PY
      - name: Quarantine fault and recover equilibrium herd
        shell: bash
        env:
          QUARANTINE_SHARD: ${{ needs.quarantine-plan.outputs.quarantine_shard }}
          PRIOR_RUN_ID: ${{ needs.quarantine-plan.outputs.prior_run_id }}
          PRIOR_REPLICAS: ${{ needs.quarantine-plan.outputs.prior_replicas }}
          PRIOR_THROUGHPUT: ${{ needs.quarantine-plan.outputs.prior_throughput }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json,os
          files=sorted(glob.glob('/tmp/farm8-pollen/candidate-*.json')); candidates=[json.load(open(p)) for p in files]
          expected_candidates=int(os.environ['FARM_CANDIDATE_REPLICAS']); equilibrium=int(os.environ['FARM_EQUILIBRIUM_REPLICAS']); quarantine_shard=int(os.environ['QUARANTINE_SHARD'])
          assert len(candidates)==expected_candidates
          quarantined=[r for r in candidates if r['syntheticFaultInjected'] is True or r['eligibleForHarvest'] is False]
          healthy=[r for r in candidates if r['eligibleForHarvest'] is True and r['healthState']=='HEALTHY']
          assert len(quarantined)==1 and quarantined[0]['shard']==quarantine_shard
          assert len(healthy)==equilibrium
          assert any(r['shard']==7 for r in healthy), 'reserve shard 7 must enter the admitted herd when a baseline shard is quarantined'
          edge=json.load(open('/tmp/farm8-pollen/supabase-edge.json')); families=sorted(set([r['providerFamily'] for r in healthy]+[edge['providerFamily']]))
          throughput=round(sum(r['workUnitsPerSecond'] for r in healthy),2); work=sum(r['workUnits'] for r in healthy); target=float(os.environ['FARM_TARGET_GITHUB_THROUGHPUT']); runtime_floor=float(os.environ['FARM_RUNTIME_FLOOR_RATIO'])
          harvest={'schema':'daube.resource-farm-quarantine-harvest.v8','generation':8,'candidateReplicas':len(candidates),'quarantinedReplicas':len(quarantined),'quarantineShard':quarantine_shard,'quarantineReason':'synthetic-receipt-health-fault','healthyAdmittedReplicas':len(healthy),'reserveSubstitutionProven':True,'priorRunId':int(os.environ['PRIOR_RUN_ID']),'priorProducerReplicas':int(os.environ['PRIOR_REPLICAS']),'priorGithubParallelThroughput':float(os.environ['PRIOR_THROUGHPUT']),'githubAdmittedWorkUnits':work,'githubHealthyThroughput':throughput,'targetGithubParallelThroughput':target,'actualTargetRatio':round(throughput/target,6),'externalPollinatorWorkUnits':edge['workUnits'],'externalPollinatorThroughput':edge['workUnitsPerSecond'],'totalAdmittedEvidenceWorkUnits':work+edge['workUnits'],'providerFamilies':families,'providerFamilyCount':len(families),'monocultureRisk':len(families)<2,'crossProviderPollination':len(families)>=2,'syntheticFaultOnly':True,'paidSpendAuthorized':False,'privateAssetsUsed':False}
          assert work==equilibrium*250000 and len(families)>=2 and harvest['monocultureRisk'] is False
          assert throughput>=target*runtime_floor, f'recovered herd throughput {throughput} fell below runtime floor {target*runtime_floor}'
          json.dump(harvest,open('/tmp/farm8-harvest.json','w'),sort_keys=True); json.dump(quarantined[0],open('/tmp/farm8-quarantine-receipt.json','w'),sort_keys=True); print(json.dumps(harvest,sort_keys=True))
          PY
      - name: Store generation 8 seed bank
        uses: actions/upload-artifact@v4
        with:
          name: farm-generation-8-seed-bank
          path: /tmp/farm8-harvest.json
          if-no-files-found: error
          retention-days: 7
      - name: Store quarantine receipt
        uses: actions/upload-artifact@v4
        with:
          name: farm-generation-8-quarantine-receipt
          path: /tmp/farm8-quarantine-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Store external pollinator receipt
        uses: actions/upload-artifact@v4
        with:
          name: farm8-pollinator-supabase-edge
          path: /tmp/farm8-pollen/supabase-edge.json
          if-no-files-found: error
          retention-days: 1

  prove-quarantine-recovery:
    if: always()
    needs: [quarantine-plan, candidate-producers, browser-canary, quarantine-harvest]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Admit generation 8 quarantine recovery
        shell: bash
        env:
          PLAN: ${{ needs.quarantine-plan.result }}
          CANDIDATES: ${{ needs.candidate-producers.result }}
          BROWSER: ${{ needs.browser-canary.result }}
          HARVEST: ${{ needs.quarantine-harvest.result }}
          QUARANTINE_SHARD: ${{ needs.quarantine-plan.outputs.quarantine_shard }}
        run: |
          test "$PLAN" = success && test "$CANDIDATES" = success && test "$BROWSER" = success && test "$HARVEST" = success
          echo "FARM8_QUARANTINE_RECOVERY_OK:7_HEALTHY:1_QUARANTINED:SHARD_${QUARANTINE_SHARD}:CROSS_PROVIDER"
