name: Resource Farm Generation 9 Agronomy Field Trial

on:
  pull_request:
    paths:
      - '.github/workflows/resource-farm-generation9-agronomy.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/resource-farm-generation9-agronomy.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: resource-farm-generation9-agronomy-${{ github.ref }}
  cancel-in-progress: true

env:
  FARM_GENERATION: '9'
  FARM_WORK_UNITS: '250000'
  FARM_WORKER_TARGET_THROUGHPUT: '3000000'
  FARM_TRIAL_QUOTA_UNITS: '1000000'

jobs:
  soil-survey:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      github_fertility: ${{ steps.survey.outputs.github_fertility }}
      github_feed_state: ${{ steps.survey.outputs.github_feed_state }}
      provider_families: ${{ steps.survey.outputs.provider_families }}
    steps:
      - name: Measure GitHub field soil and bounded feed
        id: survey
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/farm9
          python3 - <<'PY'
          import hashlib,json,os,platform,time
          work=int(os.environ['FARM_WORK_UNITS']); target=float(os.environ['FARM_WORKER_TARGET_THROUGHPUT']); budget=int(os.environ['FARM_TRIAL_QUOTA_UNITS'])
          started=time.perf_counter(); digest=hashlib.sha256()
          for i in range(work): digest.update(f'daube-farm-generation-9-github-{i}'.encode())
          elapsed=max(time.perf_counter()-started,1e-9); throughput=work/elapsed
          mem={}
          with open('/proc/meminfo') as f:
              for line in f:
                  if ':' in line:
                      k,v=line.split(':',1); mem[k]=v.strip()
          disk=os.statvfs('/')
          disk_total=disk.f_blocks*disk.f_frsize; disk_free=disk.f_bavail*disk.f_frsize
          trial_quota_remaining=max(0,budget-work)/budget
          throughput_score=min(1,throughput/max(1,target)); quota_score=min(1,trial_quota_remaining)
          reliability=1.0; quality=1.0; freshness=1.0; retry_eff=1.0; latency=max(0,min(1,1-(elapsed/2))); autonomy=1.0
          fertility=round(reliability*.24+throughput_score*.20+quota_score*.18+freshness*.14+quality*.10+retry_eff*.06+latency*.05+autonomy*.03,6)
          feed_score=round(quota_score*.40+1*.22+1*.12+min(1,disk_free/max(1,disk_total))*.10+1*.08+1*.08,6)
          feed_state='ABUNDANT' if feed_score>=.65 else 'ADEQUATE' if feed_score>=.30 else 'LOW'
          receipt={
            'schema':'daube.resource-farm-soil-survey.v9','generation':9,'resourceId':'github-public-runner-field','providerFamily':'github-public-runner',
            'backend':'github-hosted-linux-cpu','runnerOS':platform.system(),'arch':platform.machine(),'cpuCount':os.cpu_count(),
            'workUnits':work,'workUnitsPerSecond':round(throughput,2),'latencyMs':round(elapsed*1000,3),'sha256':digest.hexdigest(),
            'qualityScore':quality,'successRate':reliability,'evidenceFreshness':freshness,'retryWasteRatio':0,
            'trialQuotaEvidenceClass':'bounded-workflow-budget','trialQuotaUnits':budget,'trialQuotaRemainingRatio':round(trial_quota_remaining,6),
            'memoryTotal':mem.get('MemTotal'),'memoryAvailable':mem.get('MemAvailable'),'diskFreeBytes':disk_free,
            'soilFertility':fertility,'feedScore':feed_score,'feedState':feed_state,
            'costClaim':'no-paid-spend-authorized-by-this-workflow','paidSpendAuthorized':False,'privateAssetsUsed':False,
            'observedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),
          }
          json.dump(receipt,open('/tmp/farm9/github-soil.json','w'),sort_keys=True); print(json.dumps(receipt,sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f'github_fertility={fertility}\n'); f.write(f'github_feed_state={feed_state}\n'); f.write('provider_families=github-public-runner,supabase-edge\n')
          assert receipt['runnerOS']=='Linux' and receipt['cpuCount']>=1 and throughput>0 and fertility>0
          PY
      - name: Collect independent Supabase Edge pollen
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 15 --header 'accept: application/json' \
            'https://wilqsqndjgckqxbjptxm.supabase.co/functions/v1/daube-resource-farm-pollen-edge/v1/farm/pollen?generation=9' \
            --output /tmp/farm9/supabase-edge.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/farm9/supabase-edge.json'))
          assert r['schema']=='daube.resource-farm-pollen-receipt.v2'
          assert r['generation']==9 and r['providerFamily']=='supabase-edge'
          assert r['success'] is True and r['workUnits']>0 and r['workUnitsPerSecond']>0
          assert r['paidSpendAuthorized'] is False and r['privateAssetsUsed'] is False
          print(json.dumps(r,sort_keys=True))
          PY
      - name: Store field survey
        uses: actions/upload-artifact@v4
        with:
          name: farm-generation-9-soil-survey
          path: /tmp/farm9
          if-no-files-found: error
          retention-days: 7

  nursery-lifecycle:
    needs: soil-survey
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Download field survey
        uses: actions/download-artifact@v4
        with:
          name: farm-generation-9-soil-survey
          path: /tmp/farm9
      - name: Exercise seed nursery canary probation gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time
          gh=json.load(open('/tmp/farm9/github-soil.json')); edge=json.load(open('/tmp/farm9/supabase-edge.json'))
          trace=[]
          for resource in [
              {'id':'github-public-runner-field','family':'github-public-runner','quality':gh['qualityScore'],'reliability':gh['successRate'],'fresh':gh['evidenceFreshness']},
              {'id':'supabase-edge-pollinator','family':'supabase-edge','quality':1.0,'reliability':1.0,'fresh':1.0},
          ]:
              states=['SEED','NURSERY','CANARY','PROBATION']
              trace.append({'resourceId':resource['id'],'providerFamily':resource['family'],'states':states,'productionPromotionProvenByThisTrial':False,'reason':'bounded single-generation trial proves lifecycle gates but does not replace historical production admission'})
          receipt={'schema':'daube.resource-farm-nursery-trace.v9','generation':9,'resources':trace,'automaticJumpToProductionAllowed':False,'paidSpendAuthorized':False,'privateAssetsUsed':False,'observedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          json.dump(receipt,open('/tmp/farm9-nursery.json','w'),sort_keys=True); print(json.dumps(receipt,sort_keys=True))
          assert all(x['states']==['SEED','NURSERY','CANARY','PROBATION'] for x in trace)
          assert receipt['automaticJumpToProductionAllowed'] is False
          PY
      - name: Store nursery trace
        uses: actions/upload-artifact@v4
        with:
          name: farm-generation-9-nursery-trace
          path: /tmp/farm9-nursery.json
          if-no-files-found: error
          retention-days: 7

  agronomy-harvest:
    needs: [soil-survey, nursery-lifecycle]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download soil survey
        uses: actions/download-artifact@v4
        with:
          name: farm-generation-9-soil-survey
          path: /tmp/farm9
      - name: Download nursery trace
        uses: actions/download-artifact@v4
        with:
          name: farm-generation-9-nursery-trace
          path: /tmp/farm9
      - name: Rotate crops irrigate grade harvest and compost
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,math,time
          gh=json.load(open('/tmp/farm9/github-soil.json')); edge=json.load(open('/tmp/farm9/supabase-edge.json')); nursery=json.load(open('/tmp/farm9/farm9-nursery.json'))
          # Crop rotation: two slots must contain two independent provider families.
          rotation={'desiredSlots':2,'selectedResourceIds':['github-public-runner-field','supabase-edge-pollinator'],'providerFamilies':['github-public-runner','supabase-edge'],'providerFamilyCount':2,'familyCap':1,'monocultureRisk':False,'admitted':True}
          # Irrigation is a controlled trial backlog, not a production queue claim.
          queue_depth=400; active=2; service_rate=3; deadline=60; max_concurrency=4
          drain_seconds=queue_depth/(active*service_rate); pressure=drain_seconds/deadline
          mode='DRAIN' if pressure>1 else 'STEADY'; target_concurrency=min(max_concurrency,max(active,math.ceil(queue_depth/(deadline*service_rate)))) if mode=='DRAIN' else active
          irrigation={'evidenceClass':'controlled-trial-backlog','queueDepth':queue_depth,'mode':mode,'targetConcurrency':target_concurrency,'estimatedDrainSeconds':round(drain_seconds,3),'deadlinePressure':round(pressure,6)}
          # Each provider keeps its own measured throughput. Only evidence work units are additive here.
          quality=1.0; success=1.0
          github_qadj=round(gh['workUnitsPerSecond']*quality*success,2); edge_qadj=round(edge['workUnitsPerSecond']*quality*success,2)
          combined_evidence_work=int(gh['workUnits'])+int(edge['workUnits'])
          harvest={'grade':'A','qualityScore':quality,'successRate':success,'provenanceComplete':True,'policyCompliant':True,'githubQualityAdjustedThroughput':github_qadj,'edgeQualityAdjustedThroughput':edge_qadj,'combinedEvidenceWorkUnits':combined_evidence_work,'aggregateParallelThroughputClaimed':False,'marketReadiness':'TECHNICALLY_MARKETABLE','revenueReceiptPresent':False,'economicYieldStatus':'UNPROVEN_UNTIL_CUSTOMER_PAYMENT_RECEIPT'}
          compost={'input':'generation-8-synthetic-quarantine-learning','regressionHeuristic':'quarantine-malformed-or-security-signaled-receipts-before-harvest','reusedInGeneration9':True}
          seed={'schema':'daube.resource-farm-agronomy-harvest.v9','generation':9,'soil':{'githubFertility':gh['soilFertility'],'githubFeedState':gh['feedState']},'nursery':nursery,'rotation':rotation,'irrigation':irrigation,'harvest':harvest,'compost':compost,'providerFamilies':rotation['providerFamilies'],'providerFamilyCount':2,'monocultureRisk':False,'paidSpendAuthorized':False,'privateAssetsUsed':False,'truthBoundary':'This generation proves agronomy controls on a bounded repository CI field and independent Edge pollinator. Provider throughput measurements are separate and are not summed into a parallel-capacity claim. It does not prove general provider provisioning, account-wide quota, sovereign-local hardware, customer revenue, or paid spend.','observedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
          assert rotation['admitted'] and rotation['providerFamilyCount']>=2 and not rotation['monocultureRisk']
          assert irrigation['targetConcurrency']>=1 and harvest['grade']=='A' and harvest['revenueReceiptPresent'] is False
          assert harvest['combinedEvidenceWorkUnits']==500000 and harvest['aggregateParallelThroughputClaimed'] is False
          json.dump(seed,open('/tmp/farm9-seed-bank.json','w'),sort_keys=True); print(json.dumps(seed,sort_keys=True))
          PY
      - name: Store generation 9 seed bank
        uses: actions/upload-artifact@v4
        with:
          name: farm-generation-9-seed-bank
          path: /tmp/farm9-seed-bank.json
          if-no-files-found: error
          retention-days: 7

  prove-agronomy:
    needs: [soil-survey, nursery-lifecycle, agronomy-harvest]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Admit generation 9 agronomy field trial
        shell: bash
        env:
          SOIL_RESULT: ${{ needs.soil-survey.result }}
          NURSERY_RESULT: ${{ needs.nursery-lifecycle.result }}
          HARVEST_RESULT: ${{ needs.agronomy-harvest.result }}
        run: |
          set -euo pipefail
          test "$SOIL_RESULT" = success
          test "$NURSERY_RESULT" = success
          test "$HARVEST_RESULT" = success
          echo 'RESOURCE_FARM_GENERATION_9_AGRONOMY_ADMITTED'
