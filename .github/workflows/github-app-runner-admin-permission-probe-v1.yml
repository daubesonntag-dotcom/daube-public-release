name: D'AUBE GitHub App Runner Admin Permission Probe V1

on:
  push:
    branches:
      - probe/github-app-runner-admin-v1
    paths:
      - .github/workflows/github-app-runner-admin-permission-probe-v1.yml

permissions: {}

jobs:
  probe:
    name: Sanitized installation permission probe
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DAUBE_GITHUB_APP_ID: ${{ vars.DAUBE_GITHUB_APP_ID }}
      DAUBE_GITHUB_APP_INSTALLATION_ID: ${{ vars.DAUBE_GITHUB_APP_INSTALLATION_ID }}
      DAUBE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.DAUBE_GITHUB_APP_PRIVATE_KEY }}
    steps:
      - name: Inspect short-lived installation token permissions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createSign } from 'node:crypto';
          import fs from 'node:fs';

          const appId = String(process.env.DAUBE_GITHUB_APP_ID || '').trim();
          const installationId = String(process.env.DAUBE_GITHUB_APP_INSTALLATION_ID || '').trim();
          const privateKey = String(process.env.DAUBE_GITHUB_APP_PRIVATE_KEY || '');
          const bindingsPresent = /^\d+$/.test(appId) && /^\d+$/.test(installationId) && privateKey.includes('PRIVATE KEY-----');

          const receipt = {
            schema: 'daube.github-app-runner-admin-permission-probe.v1',
            bindingsPresent,
            tokenExchangeSucceeded: false,
            administrationWrite: false,
            jitConfigRequested: false,
            tokenMaterialEmitted: false,
            secretMaterialEmitted: false,
            automaticPaidSpend: false,
            publicRunnerOnly: true,
          };

          if (!bindingsPresent) {
            receipt.state = 'GITHUB_APP_BINDINGS_UNAVAILABLE_IN_PUBLIC_REPO';
            fs.writeFileSync('permission-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
            console.log(JSON.stringify(receipt));
            process.exit(0);
          }

          const base64url = value => Buffer.from(value).toString('base64url');
          const now = Math.floor(Date.now() / 1000);
          const header = base64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
          const payload = base64url(JSON.stringify({ iat: now - 60, exp: now + 540, iss: appId }));
          const unsigned = `${header}.${payload}`;
          const signer = createSign('RSA-SHA256');
          signer.update(unsigned);
          signer.end();
          const jwt = `${unsigned}.${signer.sign(privateKey).toString('base64url')}`;

          const response = await fetch(`https://api.github.com/app/installations/${installationId}/access_tokens`, {
            method: 'POST',
            redirect: 'error',
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${jwt}`,
              'content-type': 'application/json',
              'x-github-api-version': '2022-11-28',
            },
            body: JSON.stringify({}),
          });
          receipt.tokenExchangeHttpStatus = response.status;
          if (response.status === 201) {
            const body = await response.json();
            receipt.tokenExchangeSucceeded = Boolean(body?.token);
            receipt.administrationWrite = String(body?.permissions?.administration || '').toLowerCase() === 'write';
            receipt.state = receipt.administrationWrite
              ? 'GITHUB_APP_ADMINISTRATION_WRITE_PROVEN'
              : 'GITHUB_APP_ADMINISTRATION_WRITE_NOT_GRANTED';
          } else {
            receipt.state = 'GITHUB_APP_TOKEN_EXCHANGE_REJECTED';
          }

          fs.writeFileSync('permission-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify(receipt));
          NODE

      - name: Upload sanitized permission receipt
        uses: actions/upload-artifact@v4
        with:
          name: github-app-runner-admin-permission-probe
          path: permission-receipt.json
          if-no-files-found: error
          retention-days: 1
