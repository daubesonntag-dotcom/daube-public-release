<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>D’AUBE GitLab Secure Setup</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#fff}
    *{box-sizing:border-box}body{margin:0;padding:28px 20px;line-height:1.5}.wrap{max-width:640px;margin:0 auto}h1{font-size:1.55rem;margin:0 0 18px}.box,fieldset{border:1px solid #8885;border-radius:14px;padding:16px;margin:16px 0}code{word-break:break-all}label{display:block;font-weight:700;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #8888;border-radius:10px;font:inherit}button{padding:12px 18px;border:0;border-radius:999px;font-weight:700;background:#1f1f1f;color:#fff}.small{font-size:.9rem;opacity:.75}.bad{padding:12px;border-radius:10px;background:#b5484822}
  </style>
</head>
<body>
  <main class="wrap">
    <h1>D’AUBE — GitLab Secure Setup</h1>
    <div id="error" class="bad" hidden>Link setup không hợp lệ hoặc thiếu dữ liệu.</div>
    <div class="box"><strong>Application ID</strong><p><code id="cid">—</code></p></div>
    <form id="setup" method="post" action="https://wilqsqndjgckqxbjptxm.supabase.co/functions/v1/daube-gitlab-oauth/setup">
      <input id="token" type="hidden" name="t" />
      <input id="clientId" type="hidden" name="client_id" />
      <fieldset>
        <legend>Chỉ cần nhập GitLab Secret</legend>
        <label for="secret">Secret</label>
        <input id="secret" name="client_secret" type="password" autocomplete="off" required autofocus />
        <p class="small">Secret được gửi trực tiếp qua HTTPS vào Supabase Vault. Không gửi Secret vào chat.</p>
        <button type="submit">Store securely</button>
      </fieldset>
    </form>
  </main>
  <script>
    (() => {
      const q = new URLSearchParams(location.search);
      const t = q.get('t') || '';
      const cid = q.get('client_id') || '';
      const valid = /^[0-9a-f]{64}$/i.test(t) && cid.length >= 8 && cid.length <= 256;
      document.getElementById('token').value = t;
      document.getElementById('clientId').value = cid;
      document.getElementById('cid').textContent = cid || '—';
      if (!valid) {
        document.getElementById('error').hidden = false;
        document.getElementById('setup').hidden = true;
      }
    })();
  </script>
</body>
</html>
