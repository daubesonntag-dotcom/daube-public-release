name: Launch Critical Public Readback V1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-domain-convergence-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launch-critical-public-readback-v1
  cancel-in-progress: true

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify canonical public apex
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 20 \
            --dump-header /tmp/apex.headers \
            https://daubesonntag.com/ \
            --output /tmp/apex.html

          test -s /tmp/apex.html
          grep -Fq 'D’AUBE SONNTAG' /tmp/apex.html
          grep -Fq 'RẠNG TRONG' /tmp/apex.html
          grep -Eq '/assets/[^"'"'"'[:space:]]+' /tmp/apex.html

          apex_hash="$(sha256sum /tmp/apex.html | awk '{print $1}')"
          asset_count="$(grep -Eo '/assets/[^"'"'"'[:space:]]+' /tmp/apex.html | sort -u | wc -l | tr -d ' ')"
          {
            echo '## Canonical public apex'
            echo '- HTTPS fetch: PASS'
            echo '- D’AUBE SONNTAG marker: PASS'
            echo '- RẠNG TRONG marker: PASS'
            echo "- Vite /assets references: ${asset_count}"
            echo "- Response SHA-256: ${apex_hash}"
            echo '- No DNS, Pages, Cloudflare, secret or billing mutation was attempted.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify canonical commerce and First Dawn
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --header 'Accept: application/json' \
            --header 'Origin: https://daubesonntag.com' \
            --header 'Cache-Control: no-cache' \
            https://commerce.daubesonntag.com/healthz \
            --output /tmp/health.json
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            --header 'Accept: application/json' \
            --header 'Origin: https://daubesonntag.com' \
            --header 'Cache-Control: no-cache' \
            https://commerce.daubesonntag.com/v1/turns \
            --output /tmp/turns.json

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          health = json.loads(Path('/tmp/health.json').read_text(encoding='utf-8'))
          listing = json.loads(Path('/tmp/turns.json').read_text(encoding='utf-8'))

          def require(ok, code):
              if not ok:
                  raise SystemExit(code)

          require(health.get('schema') == 'daube.commerce.cloudflare-health.v2', 'health_schema_invalid')
          require(health.get('status') == 'READY', 'commerce_not_ready')
          require(health.get('d1ReadVerified') is True, 'd1_read_unverified')
          require(health.get('publicReadReady') is True, 'public_read_unready')
          require(health.get('commerceFlowConfigured') is True, 'commerce_flow_unconfigured')
          require(health.get('paddleBindingsConfigured') is True, 'paddle_bindings_unconfigured')
          require(health.get('paddleCheckoutConfigured') is True, 'paddle_checkout_unconfigured')
          require(health.get('paddleWebhookConfigured') is True, 'paddle_webhook_unconfigured')
          require(health.get('providerReadbackConfigured') is True, 'provider_readback_unconfigured')
          source = health.get('sourceRevision')
          require(isinstance(source, str) and len(source) == 40 and all(c in '0123456789abcdefABCDEF' for c in source), 'commerce_revision_invalid')

          require(listing.get('schema') == 'daube.experience-turn-list.v1', 'turn_list_schema_invalid')
          turns = listing.get('turns')
          require(isinstance(turns, list), 'turn_list_invalid')
          turn = next((item for item in turns if isinstance(item, dict) and item.get('turnId') == 'first-dawn-decision-veto-v1'), None)
          require(isinstance(turn, dict), 'first_dawn_missing')
          require(turn.get('schema') == 'daube.experience-turn.v1', 'first_dawn_schema_invalid')
          require(turn.get('title') == 'FIRST DAWN · DECISION VETO', 'first_dawn_title_mismatch')
          require(turn.get('availability') == 'AVAILABLE' and turn.get('claimable') is True, 'first_dawn_unavailable')
          require(turn.get('capacity') == 36, 'first_dawn_capacity_mismatch')
          remaining = turn.get('capacityRemaining')
          require(isinstance(remaining, int) and 0 < remaining <= 36, 'first_dawn_capacity_remaining_invalid')
          product = turn.get('product') or {}
          require(product.get('id') == 'paradox-decision-veto', 'first_dawn_product_mismatch')
          require(product.get('sku') == 'DS-PARADOX-VETO-01', 'first_dawn_sku_mismatch')
          price = product.get('price') or {}
          require(price.get('amountMinor') == 49000 and price.get('currency') == 'VND', 'first_dawn_price_mismatch')

          receipt = {
              'schema': 'daube.launch-critical.public-readback.v1',
              'commerceSourceRevision': source.lower(),
              'commerceReady': True,
              'd1ReadVerified': True,
              'publicReadReady': True,
              'paddleBindingsConfigured': True,
              'paddleCheckoutConfigured': True,
              'paddleWebhookConfigured': True,
              'providerReadbackConfigured': True,
              'firstDawn': {
                  'turnId': turn.get('turnId'),
                  'productId': product.get('id'),
                  'sku': product.get('sku'),
                  'amountMinor': price.get('amountMinor'),
                  'currency': price.get('currency'),
                  'capacity': turn.get('capacity'),
                  'capacityRemaining': remaining,
                  'verifiedPaidClaimCount': turn.get('verifiedPaidClaimCount'),
                  'activeUnpaidHoldCount': turn.get('activeUnpaidHoldCount'),
              },
              'settlementVerifiedByThisReceipt': False,
              'realPaymentCanaryStillRequired': True,
              'secretMaterialSerialized': False,
          }
          Path('/tmp/launch-critical-public-readback.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, sort_keys=True))
          PY

          commerce_sha="$(python3 -c "import json; print(json.load(open('/tmp/health.json'))['sourceRevision'])")"
          remaining="$(python3 -c "import json; x=json.load(open('/tmp/turns.json')); t=next(v for v in x['turns'] if v['turnId']=='first-dawn-decision-veto-v1'); print(t['capacityRemaining'])")"
          {
            echo
            echo '## Commerce + First Dawn readback'
            echo '- commerce health: READY'
            echo "- commerce exact source revision: ${commerce_sha}"
            echo '- D1/public read: VERIFIED'
            echo '- Paddle bindings/checkout/webhook/provider readback: CONFIGURED'
            echo '- First Dawn: AVAILABLE / CLAIMABLE'
            echo '- SKU: DS-PARADOX-VETO-01'
            echo '- Price: 49,000 VND'
            echo '- Capacity ceiling: 36'
            echo "- Capacity remaining: ${remaining}"
            echo '- Real settlement verified by this workflow: NO'
            echo '- Real payment canary still required: YES'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Classify launch-critical public evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo
            echo '## Result'
            echo 'PUBLIC_RUNTIME_AND_COMMERCE_PREFLIGHT_VERIFIED'
            echo
            echo 'This closes public/read-only runtime evidence only. It does not self-certify the web source SHA, settlement, revenue, refund, or Founder/provider-reserved authority.'
          } >> "$GITHUB_STEP_SUMMARY"
