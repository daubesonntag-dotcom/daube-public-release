name: free-gpu-credential-census

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/free-gpu-credential-census.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          present() { if [ -n "${2:-}" ]; then echo "$1=PRESENT"; else echo "$1=ABSENT"; fi; }
          {
            echo 'schema=daube.free-gpu-credential-census.v1'
            present HF_TOKEN "${HF_TOKEN:-}"
            present KAGGLE_API_TOKEN "${KAGGLE_API_TOKEN:-}"
            if [ -n "${KAGGLE_USERNAME:-}" ] && [ -n "${KAGGLE_KEY:-}" ]; then echo 'KAGGLE_LEGACY_PAIR=PRESENT'; else echo 'KAGGLE_LEGACY_PAIR=ABSENT'; fi
            if [ -n "${MODAL_TOKEN_ID:-}" ] && [ -n "${MODAL_TOKEN_SECRET:-}" ]; then echo 'MODAL_TOKEN_PAIR=PRESENT'; else echo 'MODAL_TOKEN_PAIR=ABSENT'; fi
            present LIGHTNING_API_KEY "${LIGHTNING_API_KEY:-}"
            echo 'secret_values_exposed=false'
            echo 'paid_spend_authorized=false'
          } | tee census.txt

      - name: Upload census receipt
        uses: actions/upload-artifact@v4
        with:
          name: free-gpu-credential-census
          path: census.txt
          retention-days: 1
