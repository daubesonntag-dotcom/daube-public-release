name: Sovereign Edge Pairing

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Approve or revoke this physical-edge key"
        required: true
        type: choice
        options:
          - approve
          - revoke
        default: approve
      public_key_sha256:
        description: "64-character Ed25519 public-key SHA-256 printed by the physical device"
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - 'farm/sovereign-agent/pairing-request.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: sovereign-edge-pair-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve pairing decision
        id: decision
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_FINGERPRINT: ${{ inputs.public_key_sha256 }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            action="$INPUT_ACTION"
            fingerprint="$INPUT_FINGERPRINT"
          else
            action="$(jq -r '.action // empty' farm/sovereign-agent/pairing-request.json)"
            fingerprint="$(jq -r '.publicKeySha256 // empty' farm/sovereign-agent/pairing-request.json)"
          fi
          [[ "$action" == "approve" || "$action" == "revoke" ]]
          [[ "$fingerprint" =~ ^[a-f0-9]{64}$ ]]
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Obtain repository-scoped GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=daube-sovereign-host-pairing")"
          token="$(jq -r '.value // empty' <<<"$response")"
          test -n "$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Apply founder pairing decision
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          ACTION: ${{ steps.decision.outputs.action }}
          FINGERPRINT: ${{ steps.decision.outputs.fingerprint }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg action "$ACTION" --arg fingerprint "$FINGERPRINT" '{action:$action,publicKeySha256:$fingerprint}')"
          code="$(curl --silent --show-error \
            --output /tmp/response.json \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            'https://wilqsqndjgckqxbjptxm.supabase.co/functions/v1/daube-sovereign-host-pairing')"
          cat /tmp/response.json | jq '{status,code,hostId,runtimeKind,publicKeySha256,pairingRequestId,bindingId,runtimeProofId,runtimeProofPromoted,nextGate}'
          [[ "$code" == "201" ]]
          if [[ "$ACTION" == "approve" ]]; then
            jq -e '.status == "APPROVED" and .runtimeProofPromoted == true' /tmp/response.json >/dev/null
          else
            jq -e '.status == "REVOKED"' /tmp/response.json >/dev/null
          fi
