name: Commerce ephemeral encrypted rescue

on:
  push:
    paths:
      - '.github/workflows/commerce-ephemeral-rescue.yml'
      - 'release/commerce-rescue/request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Validate rescue request
        id: request
        shell: bash
        run: |
          set -euo pipefail

          # Editing the workflow itself must never restart an older outstanding
          # request. A push-run becomes executable only when request.json changed;
          # workflow_dispatch remains the explicit retry path.
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            request_changed="$(jq -r '
              [(.commits[]? | ((.added // []) + (.modified // []) + (.removed // [])))[]?]
              | any(. == "release/commerce-rescue/request.json")
            ' "$GITHUB_EVENT_PATH")"
            if [[ "$request_changed" != 'true' ]]; then
              echo 'pending=false' >> "$GITHUB_OUTPUT"
              {
                echo '## Commerce rescue'
                echo 'NO_REQUEST_EVENT'
                echo '- Workflow-definition or unrelated push detected; an older request was not restarted.'
                echo '- No encryption identity, payload wait, decryption, verification or mutation was attempted.'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          if [[ ! -f release/commerce-rescue/request.json ]]; then
            echo 'pending=false' >> "$GITHUB_OUTPUT"
            {
              echo '## Commerce rescue'
              echo 'NO_PENDING_RESCUE_REQUEST'
              echo '- Cleanup / post-completion push detected; no private source was requested.'
              echo '- No encryption identity, payload wait, decryption, verification or mutation was attempted.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          request_id="$(jq -r '.requestId' release/commerce-rescue/request.json)"
          expected_sha="$(jq -r '.expectedSha' release/commerce-rescue/request.json)"
          profile="$(jq -r '.verificationProfile' release/commerce-rescue/request.json)"
          [[ "$request_id" =~ ^[a-z0-9-]{8,80}$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          case "$profile" in
            first-dawn-hardening|workers-builds-recovery-contract) ;;
            *) echo '::error::unsupported rescue verification profile'; exit 70 ;;
          esac
          echo 'pending=true' >> "$GITHUB_OUTPUT"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Report request gate
        if: ${{ always() }}
        shell: bash
        env:
          PENDING: ${{ steps.request.outputs.pending }}
        run: |
          printf 'REQUEST_GATE_PENDING=%s\n' "${PENDING:-unset}" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate one-run encryption identity
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          umask 077
          openssl req -x509 -newkey rsa:3072 -sha256 -nodes \
            -subj "/CN=daube-commerce-rescue-${REQUEST_ID}" \
            -keyout /tmp/rescue-private.pem \
            -out /tmp/rescue-cert.pem \
            -days 1 >/dev/null 2>&1
          cert_b64="$(base64 -w0 /tmp/rescue-cert.pem)"
          body_b64="$(printf '%s' "$cert_b64" | base64 -w0)"
          key_path="release/commerce-rescue/${REQUEST_ID}/recipient-cert.b64"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${key_path}?ref=${GITHUB_REF_NAME}" \
            --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${key_path}" \
            -f message="ci(rescue): publish ephemeral recipient ${REQUEST_ID}" \
            -f content="$body_b64" \
            -f branch="$GITHUB_REF_NAME")
          if [[ -n "$existing_sha" ]]; then
            args+=(-f sha="$existing_sha")
          fi
          gh api "${args[@]}" >/dev/null
          echo "RECIPIENT_READY ${REQUEST_ID}"

      - name: Await encrypted exact-SHA payload
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          payload_path="release/commerce-rescue/${REQUEST_ID}/payload.cms.b64"
          found=0
          for attempt in $(seq 1 90); do
            if gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${payload_path}?ref=${GITHUB_REF_NAME}" \
              --jq '.content' >/tmp/github-content.b64 2>/dev/null; then
              tr -d '\n' </tmp/github-content.b64 | base64 -d >/tmp/payload-text.b64
              tr -d '\n' </tmp/payload-text.b64 | base64 -d >/tmp/payload.cms
              found=1
              break
            fi
            sleep 4
          done
          [[ "$found" == "1" ]] || { echo '::error::encrypted payload not received'; exit 71; }

      - name: Decrypt and verify private commerce bundle
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
          PROFILE: ${{ steps.request.outputs.profile }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/commerce-rescue
          openssl cms -decrypt -binary -inform DER \
            -in /tmp/payload.cms \
            -recip /tmp/rescue-cert.pem \
            -inkey /tmp/rescue-private.pem \
            -out /tmp/commerce-bundle.tar.gz
          tar -xzf /tmp/commerce-bundle.tar.gz -C /tmp/commerce-rescue
          cd /tmp/commerce-rescue
          actual_sha="$(jq -r '.expectedSha' manifest.json)"
          actual_profile="$(jq -r '.verificationProfile' manifest.json)"
          [[ "$actual_sha" == "$EXPECTED_SHA" ]] || { echo '::error::bundle SHA mismatch'; exit 72; }
          [[ "$actual_profile" == "$PROFILE" ]] || { echo '::error::bundle profile mismatch'; exit 73; }
          jq -e '.containsSecrets == false and .sourceVisibility == "private"' manifest.json >/dev/null

          case "$PROFILE" in
            first-dawn-hardening)
              test -f tests/first-dawn-hardening.test.mjs
              test -f probes/sqlite-first-dawn.py
              node --test tests/first-dawn-hardening.test.mjs
              python3 probes/sqlite-first-dawn.py
              printf '%s\n' '["first-dawn-hardening-node","first-dawn-sqlite-behavior"]' > /tmp/rescue-checks.json
              ;;
            workers-builds-recovery-contract)
              test -f scripts/cloudflare/workers-builds-recovery.sh
              test -f tests/workers-builds-recovery-contract.test.mjs
              node --test tests/workers-builds-recovery-contract.test.mjs
              printf '%s\n' '["workers-builds-recovery-contract-node"]' > /tmp/rescue-checks.json
              ;;
          esac

      - name: Emit sanitized execution receipt
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
          PROFILE: ${{ steps.request.outputs.profile }}
        run: |
          set -euo pipefail
          cd /tmp/commerce-rescue
          python3 - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          profile = os.environ['PROFILE']
          if profile == 'first-dawn-hardening':
              files = [
                  'src/stores/d1-experience-economy.ts',
                  'migrations/0012_first_dawn_payment_passport_hardening.sql',
                  'src/cloudflare-deployment-contract.ts',
                  'tests/first-dawn-hardening.test.mjs',
                  'probes/sqlite-first-dawn.py',
              ]
          elif profile == 'workers-builds-recovery-contract':
              files = [
                  'scripts/cloudflare/workers-builds-recovery.sh',
                  'tests/workers-builds-recovery-contract.test.mjs',
              ]
          else:
              raise SystemExit('receipt_profile_invalid')
          hashes = {}
          for name in files:
              data = Path(name).read_bytes()
              hashes[name] = 'sha256:' + hashlib.sha256(data).hexdigest()
          checks = json.loads(Path('/tmp/rescue-checks.json').read_text())
          receipt = {
              'schema': 'daube.commerce-ephemeral-rescue.v2',
              'ok': True,
              'requestId': os.environ['REQUEST_ID'],
              'sourceRevision': os.environ['EXPECTED_SHA'],
              'verificationProfile': profile,
              'executor': 'github-public-hosted-ubuntu',
              'runnerOs': platform.platform(),
              'privateSourcePublished': False,
              'secretsReceived': False,
              'productionMutationPerformed': False,
              'checks': checks,
              'files': hashes,
          }
          Path('/tmp/commerce-rescue-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ steps.request.outputs.pending == 'true' }}
        with:
          name: commerce-ephemeral-rescue-${{ steps.request.outputs.request_id }}
          path: /tmp/commerce-rescue-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish sanitized receipt to release channel
        if: ${{ steps.request.outputs.pending == 'true' && success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          receipt_path="release/commerce-rescue/${REQUEST_ID}/receipt.json"
          body_b64="$(base64 -w0 /tmp/commerce-rescue-receipt.json)"
          existing_sha="$(gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${receipt_path}?ref=${GITHUB_REF_NAME}" \
            --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${receipt_path}" \
            -f message="ci(rescue): publish sanitized receipt ${REQUEST_ID}" \
            -f content="$body_b64" \
            -f branch="$GITHUB_REF_NAME")
          if [[ -n "$existing_sha" ]]; then
            args+=(-f sha="$existing_sha")
          fi
          gh api "${args[@]}" >/dev/null

      - name: Retire completed rescue request
        if: ${{ steps.request.outputs.pending == 'true' && success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          for path in \
            "release/commerce-rescue/${REQUEST_ID}/payload.cms.b64" \
            "release/commerce-rescue/${REQUEST_ID}/recipient-cert.b64" \
            "release/commerce-rescue/request.json"; do
            sha="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" \
              --jq '.sha' 2>/dev/null || true)"
            if [[ -n "$sha" ]]; then
              gh api --method DELETE \
                -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/contents/${path}" \
                -f message="ci(rescue): retire completed request ${REQUEST_ID}" \
                -f sha="$sha" \
                -f branch="$GITHUB_REF_NAME" >/dev/null
            fi
          done
          echo 'RESCUE_REQUEST_RETIRED' >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy ephemeral rescue material
        if: ${{ always() && steps.request.outputs.pending == 'true' }}
        shell: bash
        run: |
          rm -rf /tmp/commerce-rescue /tmp/commerce-bundle.tar.gz /tmp/payload.cms \
            /tmp/payload-text.b64 /tmp/github-content.b64 /tmp/rescue-private.pem \
            /tmp/rescue-cert.pem /tmp/commerce-rescue-receipt.json /tmp/rescue-checks.json
