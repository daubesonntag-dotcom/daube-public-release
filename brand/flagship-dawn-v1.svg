<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">D’AUBE SONNTAG Rạng Trong dawn study</title>
  <desc id="desc">An original abstract dawn composition of layered paper, glass-like arches, horizon lines and a rising luminous disc.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f4ea"/><stop offset="1" stop-color="#ded5c5"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfeff0"/><stop offset=".48" stop-color="#f4e7bd"/><stop offset="1" stop-color="#b9aa91"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".72"/><stop offset=".55" stop-color="#dbe7e3" stop-opacity=".34"/><stop offset="1" stop-color="#807b72" stop-opacity=".16"/></linearGradient>
    <radialGradient id="sun"><stop offset="0" stop-color="#fff6ae"/><stop offset=".55" stop-color="#f0d66d"/><stop offset="1" stop-color="#caa553"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="32" stdDeviation="36" flood-color="#30281c" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#paper)"/>
  <rect x="88" y="86" width="1024" height="1328" rx="18" fill="url(#sky)"/>
  <circle cx="602" cy="620" r="250" fill="#ffe898" opacity=".26" filter="url(#soft)"/>
  <circle cx="602" cy="625" r="132" fill="url(#sun)" filter="url(#shadow)"/>
  <path d="M177 1180V574c0-231 187-418 418-418h10c231 0 418 187 418 418v606" fill="none" stroke="url(#glass)" stroke-width="54"/>
  <path d="M258 1180V609c0-185 150-335 335-335h18c185 0 335 150 335 335v571" fill="none" stroke="#f8f6ef" stroke-opacity=".54" stroke-width="3"/>
  <path d="M122 1008c197-36 357-47 480-35 192 19 345 14 475-14" fill="none" stroke="#735d42" stroke-opacity=".28" stroke-width="2"/>
  <path d="M122 1048c185 28 334 27 447-4 161-45 332-42 508 10" fill="none" stroke="#f7f2e6" stroke-opacity=".72" stroke-width="2"/>
  <rect x="178" y="1084" width="844" height="102" rx="4" fill="#2a2b29" opacity=".9"/>
  <rect x="224" y="1120" width="356" height="10" fill="#e9d9b5" opacity=".9"/>
  <rect x="224" y="1148" width="244" height="7" fill="#d7d4cb" opacity=".68"/>
  <circle cx="921" cy="1136" r="17" fill="#e6ca7a"/>
  <text x="178" y="1278" font-family="Georgia, Times New Roman, serif" font-size="44" fill="#20211f">Meaning, made visible.</text>
  <text x="181" y="1329" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="7" fill="#655f56">D’AUBE SONNTAG · RẠNG TRONG · MMXXVI</text>
</svg>
