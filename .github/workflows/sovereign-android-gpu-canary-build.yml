name: sovereign-android-gpu-canary-build
on:
  workflow_dispatch:
  push:
    paths:
      - 'farm/sovereign-agent/gpu-canary/**'
      - '.github/workflows/sovereign-android-gpu-canary-build.yml'
permissions:
  contents: write
jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Locate Android NDK and shader compiler
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_HOME:-}"
          if [[ -z "$NDK" || ! -d "$NDK" ]]; then
            NDK="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1)"
          fi
          [[ -n "$NDK" && -d "$NDK" ]]
          GLSLC="$(find "$NDK" -type f -path '*/shader-tools/*/glslc' | head -1)"
          CLANG="$(find "$NDK/toolchains/llvm/prebuilt" -type f -name 'aarch64-linux-android28-clang' | head -1)"
          [[ -x "$GLSLC" && -x "$CLANG" ]]
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "GLSLC=$GLSLC" >> "$GITHUB_ENV"
          echo "CLANG=$CLANG" >> "$GITHUB_ENV"
      - name: Build shader and Android arm64 canary
        shell: bash
        run: |
          set -euo pipefail
          src='farm/sovereign-agent/gpu-canary'
          out='farm/sovereign-agent/bin/android-arm64'
          mkdir -p "$out"
          "$GLSLC" "$src/canary.comp" -o "$src/canary.spv"
          xxd -i -n daube_canary_spv "$src/canary.spv" > "$src/canary_spv.h"
          "$CLANG" -O2 -std=c11 -Wall -Wextra -Werror \
            "$src/vk_compute_canary.c" -o "$out/daube-vulkan-compute-canary" -lvulkan
          chmod 0755 "$out/daube-vulkan-compute-canary"
          sha256sum "$out/daube-vulkan-compute-canary" | tee "$out/daube-vulkan-compute-canary.sha256"
          file "$out/daube-vulkan-compute-canary"
      - name: Commit reproducible binary and checksum
        shell: bash
        run: |
          set -euo pipefail
          rm -f farm/sovereign-agent/gpu-canary/canary.spv farm/sovereign-agent/gpu-canary/canary_spv.h
          git config user.name 'D’AUBE GPU Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add farm/sovereign-agent/bin/android-arm64/daube-vulkan-compute-canary \
                  farm/sovereign-agent/bin/android-arm64/daube-vulkan-compute-canary.sha256
          if git diff --cached --quiet; then
            echo 'Binary unchanged.'
          else
            git commit -m 'build(gpu): publish Android arm64 Vulkan compute canary'
            git push origin HEAD:main
          fi
      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-android-gpu-canary-arm64
          path: |
            farm/sovereign-agent/bin/android-arm64/daube-vulkan-compute-canary
            farm/sovereign-agent/bin/android-arm64/daube-vulkan-compute-canary.sha256
          retention-days: 7
