name: D'AUBE Portable Native Engine Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/engine-portable-native-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-native-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prove zero-spend public-runner context
        run: |
          echo "repo=${GITHUB_REPOSITORY}"
          echo "visibility=public"
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
          test "${GITHUB_REPOSITORY}" = "daubesonntag-dotcom/daube-public-release"

      - name: Install and execute Godot 4.7.2 portable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/daube-engines/godot"
          cd "$RUNNER_TEMP/daube-engines"
          curl -fL --retry 3 --retry-delay 2 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          unzip -q godot.zip -d godot
          GODOT="$RUNNER_TEMP/daube-engines/godot/Godot_v4.7.2-stable_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --headless --version | tee godot-version.txt
          grep -q '^4\.7\.2' godot-version.txt
          cat > godot-probe.gd <<'GD'
          extends SceneTree
          func _initialize():
              print('DAUBE_GODOT_EXECUTION_OK')
              quit()
          GD
          "$GODOT" --headless --script godot-probe.gd | tee godot-execution.txt
          grep -q 'DAUBE_GODOT_EXECUTION_OK' godot-execution.txt

      - name: Install and execute Blender 5.2.1 portable
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/daube-engines"
          BASE='https://download.blender.org/release/Blender5.2'
          ARCHIVE='blender-5.2.1-linux-x64.tar.xz'
          curl -fL --retry 3 --retry-delay 2 -o "$ARCHIVE" "$BASE/$ARCHIVE"
          curl -fL --retry 3 --retry-delay 2 -o blender.sha256 "$BASE/blender-5.2.1.sha256"
          EXPECTED="$(awk -v f="$ARCHIVE" '$2==f || $2=="*"f {print $1; exit}' blender.sha256)"
          test "${#EXPECTED}" -eq 64
          echo "$EXPECTED  $ARCHIVE" | sha256sum -c -
          tar -xJf "$ARCHIVE"
          BLENDER="$RUNNER_TEMP/daube-engines/blender-5.2.1-linux-x64/blender"
          test -x "$BLENDER"
          "$BLENDER" --version | tee blender-version.txt
          grep -q '^Blender 5\.2\.1' blender-version.txt
          "$BLENDER" -b --factory-startup --python-expr "import bpy; bpy.ops.mesh.primitive_cube_add(); bpy.ops.wm.save_as_mainfile(filepath='$RUNNER_TEMP/daube-engines/daube-probe.blend'); print('DAUBE_BLENDER_EXECUTION_OK')" | tee blender-execution.txt
          grep -q 'DAUBE_BLENDER_EXECUTION_OK' blender-execution.txt
          test -s "$RUNNER_TEMP/daube-engines/daube-probe.blend"

      - name: Emit machine-readable receipt
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/daube-engines"
          python3 - <<'PY'
          import hashlib, json, os
          root = os.path.join(os.environ['RUNNER_TEMP'], 'daube-engines')
          blend = os.path.join(root, 'daube-probe.blend')
          with open(blend, 'rb') as f:
              blend_sha = hashlib.sha256(f.read()).hexdigest()
          receipt = {
            'schema': 'daube.public-native-engine-proof.v2',
            'repository': os.environ['GITHUB_REPOSITORY'],
            'runId': os.environ['GITHUB_RUN_ID'],
            'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
            'runnerOs': os.environ['RUNNER_OS'],
            'runnerArch': os.environ['RUNNER_ARCH'],
            'zeroSpendPublicSafe': True,
            'privateRepositoryCheckout': False,
            'engines': {
              'godot': {
                'status': 'ACTIVE',
                'version': open(os.path.join(root,'godot-version.txt')).read().strip(),
                'execution': 'GDSCRIPT_HEADLESS_OK'
              },
              'blender': {
                'status': 'ACTIVE',
                'version': open(os.path.join(root,'blender-version.txt')).read().splitlines()[0].strip(),
                'execution': 'HEADLESS_PYTHON_BLEND_SAVE_OK',
                'probeBlendSha256': blend_sha
              },
            },
          }
          print(json.dumps(receipt, sort_keys=True))
          PY
