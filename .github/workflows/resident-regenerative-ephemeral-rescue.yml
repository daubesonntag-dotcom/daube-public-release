name: Resident regenerative encrypted rescue

on:
  push:
    paths:
      - '.github/workflows/resident-regenerative-ephemeral-rescue.yml'
      - 'release/regenerative-rescue/request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            if ! git diff-tree --no-commit-id --name-only -r HEAD | grep -Fxq 'release/regenerative-rescue/request.json'; then
              echo 'pending=false' >> "$GITHUB_OUTPUT"
              echo 'NO_REQUEST_EVENT' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if [[ ! -f release/regenerative-rescue/request.json ]]; then
            echo 'pending=false' >> "$GITHUB_OUTPUT"
            echo 'NO_PENDING_REGENERATIVE_REQUEST' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          request_id="$(jq -r '.requestId' release/regenerative-rescue/request.json)"
          expected_sha="$(jq -r '.expectedSha' release/regenerative-rescue/request.json)"
          profile="$(jq -r '.verificationProfile' release/regenerative-rescue/request.json)"
          [[ "$request_id" =~ ^[a-z0-9-]{8,80}$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$profile" == 'resident-regenerative-v2' ]]
          echo 'pending=true' >> "$GITHUB_OUTPUT"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: ${{ steps.request.outputs.pending == 'true' }}
        with:
          node-version: 24

      - name: Generate one-run encryption identity
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          umask 077
          openssl req -x509 -newkey rsa:3072 -sha256 -nodes \
            -subj "/CN=daube-regenerative-rescue-${REQUEST_ID}" \
            -keyout /tmp/rescue-private.pem -out /tmp/rescue-cert.pem -days 1 >/dev/null 2>&1
          cert_b64="$(base64 -w0 /tmp/rescue-cert.pem)"
          body_b64="$(printf '%s' "$cert_b64" | base64 -w0)"
          key_path="release/regenerative-rescue/${REQUEST_ID}/recipient-cert.b64"
          gh api --method PUT -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${key_path}" \
            -f message="ci(rescue): publish regenerative recipient ${REQUEST_ID}" \
            -f content="$body_b64" -f branch="$GITHUB_REF_NAME" >/dev/null

      - name: Await encrypted exact-SHA payload
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          payload_path="release/regenerative-rescue/${REQUEST_ID}/payload.cms.b64"
          found=0
          for attempt in $(seq 1 90); do
            if gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${payload_path}?ref=${GITHUB_REF_NAME}" \
              --jq '.content' >/tmp/github-content.b64 2>/dev/null; then
              tr -d '\n' </tmp/github-content.b64 | base64 -d >/tmp/payload-text.b64
              tr -d '\n' </tmp/payload-text.b64 | base64 -d >/tmp/payload.cms
              found=1
              break
            fi
            sleep 4
          done
          [[ "$found" == 1 ]] || { echo '::error::encrypted payload not received'; exit 71; }

      - name: Decrypt and run Node 24 fault suite
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/regenerative-rescue
          openssl cms -decrypt -binary -inform DER -in /tmp/payload.cms \
            -recip /tmp/rescue-cert.pem -inkey /tmp/rescue-private.pem \
            -out /tmp/regenerative-bundle.tar.gz
          tar -xzf /tmp/regenerative-bundle.tar.gz -C /tmp/regenerative-rescue
          cd /tmp/regenerative-rescue
          jq -e --arg sha "$EXPECTED_SHA" '.expectedSha == $sha and .verificationProfile == "resident-regenerative-v2" and .containsSecrets == false and .sourceVisibility == "private"' manifest.json >/dev/null
          [[ "$(node -p 'process.versions.node.split(".")[0]')" == 24 ]]
          node --test tests/finish-mesh.test.mjs
          node --check bin/finish-mesh-daemon.mjs
          bash -n infra/resident-vm/bootstrap-resident-vm.sh
          bash -n infra/resident-vm/rebuild-resident-runtime.sh
          bash -n deploy/workforce/release-resident-workforce.sh
          printf '%s\n' '["node24-finish-mesh-and-regeneration-tests","daemon-syntax","bootstrap-shell-syntax","rebuild-shell-syntax","container-release-shell-syntax"]' >/tmp/regenerative-checks.json

      - name: Emit sanitized execution receipt
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          set -euo pipefail
          cd /tmp/regenerative-rescue
          python3 - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          files = [
            'packages/engineering-runtime/finish-mesh.mjs',
            'packages/engineering-runtime/regenerative-state.mjs',
            'tests/finish-mesh.test.mjs',
            'tests/regenerative-runtime-v2.test.mjs',
            'bin/finish-mesh-daemon.mjs',
            'config/engineering/finish-mesh-v1.json',
            'config/engineering/finish-mesh-current-trial.json',
            'config/runtime/resident-regenerative-v2.json',
            'infra/resident-vm/systemd/daube-finish-mesh.service',
            'infra/resident-vm/bootstrap-resident-vm.sh',
            'infra/resident-vm/rebuild-resident-runtime.sh',
            'infra/resident-vm/resident-health.mjs',
            'deploy/workforce/docker-compose.yml',
            'deploy/workforce/release-resident-workforce.sh',
            'infra/regenerative-checkpoint-edge-v1/index.ts',
          ]
          hashes = {name: 'sha256:' + hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files}
          receipt = {
            'schema': 'daube.resident-regenerative-ephemeral-rescue.v1',
            'ok': True,
            'requestId': os.environ['REQUEST_ID'],
            'sourceRevision': os.environ['EXPECTED_SHA'],
            'verificationProfile': 'resident-regenerative-v2',
            'executor': 'github-public-hosted-ubuntu',
            'nodeMajor': 24,
            'runnerOs': platform.platform(),
            'privateSourcePublished': False,
            'secretsReceived': False,
            'productionMutationPerformed': False,
            'checks': json.loads(Path('/tmp/regenerative-checks.json').read_text()),
            'files': hashes,
          }
          Path('/tmp/regenerative-rescue-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ steps.request.outputs.pending == 'true' }}
        with:
          name: resident-regenerative-rescue-${{ steps.request.outputs.request_id }}
          path: /tmp/regenerative-rescue-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish sanitized receipt
        if: ${{ steps.request.outputs.pending == 'true' && success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          receipt_path="release/regenerative-rescue/${REQUEST_ID}/receipt.json"
          body_b64="$(base64 -w0 /tmp/regenerative-rescue-receipt.json)"
          gh api --method PUT -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${receipt_path}" \
            -f message="ci(rescue): publish regenerative receipt ${REQUEST_ID}" \
            -f content="$body_b64" -f branch="$GITHUB_REF_NAME" >/dev/null

      - name: Retire request material
        if: ${{ steps.request.outputs.pending == 'true' && success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          for file in \
            "release/regenerative-rescue/${REQUEST_ID}/payload.cms.b64" \
            "release/regenerative-rescue/${REQUEST_ID}/recipient-cert.b64" \
            "release/regenerative-rescue/request.json"; do
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
            [[ -z "$sha" ]] || gh api --method DELETE -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${file}" -f message="ci(rescue): retire regenerative ${REQUEST_ID}" -f sha="$sha" -f branch="$GITHUB_REF_NAME" >/dev/null
          done

      - name: Destroy ephemeral material
        if: ${{ always() && steps.request.outputs.pending == 'true' }}
        shell: bash
        run: rm -rf /tmp/regenerative-rescue /tmp/regenerative-bundle.tar.gz /tmp/payload.cms /tmp/payload-text.b64 /tmp/github-content.b64 /tmp/rescue-private.pem /tmp/rescue-cert.pem /tmp/regenerative-rescue-receipt.json /tmp/regenerative-checks.json
