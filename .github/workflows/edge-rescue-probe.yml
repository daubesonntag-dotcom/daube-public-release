name: Edge rescue probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/edge-rescue-probe.yml'

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Capture stale root structure
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --location --dump-header /tmp/root.headers --output /tmp/root.html https://daubesonntag.com/
          echo '--- headers ---'
          grep -Ei '^(HTTP/|cf-cache-status:|cache-control:|etag:|age:|content-type:|content-length:)' /tmp/root.headers || true
          echo '--- body ---'
          sed -n '1,240p' /tmp/root.html
          printf 'root_sha=%s\n' "$(sha256sum /tmp/root.html | awk '{print $1}')" | tee /tmp/receipt

      - name: Publish compact receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          summary="$(cat /tmp/receipt 2>/dev/null || echo no-receipt)"
          payload="$(python3 - "$summary" <<'PY'
          import json,sys
          print(json.dumps({'state':'success','context':'ops/edge-rescue-body','description':sys.argv[1][:140]}))
          PY
          )"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
