name: Founder Sovereignty Inheritance Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: founder-sovereignty-inheritance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-founder-sovereignty-inheritance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision with history
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate inherited sovereignty manifest
        run: |
          mkdir -p outputs/founder-sovereignty-inheritance
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'config/governance/founder-sovereignty-inheritance-v1.json';
          const policy = JSON.parse(fs.readFileSync(path, 'utf8'));
          const failures = [];
          if (policy.id !== 'DAUBE-FOUNDER-SOVEREIGNTY-INHERITANCE-V1') failures.push('policy_id_invalid');
          if (policy.canonicalPolicy?.repository !== 'daubesonntag-dotcom/daube-forge-os') failures.push('canonical_repository_mismatch');
          if (policy.canonicalPolicy?.policyId !== 'DAUBE-FOUNDER-SOVEREIGNTY-UNIVERSAL-DELEGATION-V1') failures.push('canonical_policy_id_mismatch');
          if (String(policy.founderRootPrincipal?.githubLogin).toLowerCase() !== 'daubesonntag-dotcom') failures.push('founder_login_mismatch');
          if (Number(policy.founderRootPrincipal?.githubUserId) !== 297018471) failures.push('founder_user_id_mismatch');
          if (policy.founderRootPrincipal?.delegable !== false || policy.founderRootPrincipal?.transferableByAutomation !== false) failures.push('founder_root_must_be_non_delegable');
          if (policy.delegation?.founderIdentityTransferred !== false) failures.push('founder_identity_transfer_guard_missing');
          if (policy.delegation?.ownershipTransferred !== false) failures.push('ownership_transfer_guard_missing');
          if (policy.delegation?.equalRootAuthorityCreated !== false) failures.push('equal_root_authority_guard_missing');
          if (policy.delegation?.selfApprovalAllowed !== false) failures.push('self_approval_guard_missing');
          if (policy.antiTakeover?.aiMayClaimFounderIdentity !== false) failures.push('ai_impersonation_guard_missing');
          if (policy.antiTakeover?.syntheticFounderApprovalAllowed !== false) failures.push('synthetic_approval_guard_missing');
          if (policy.antiTakeover?.automationMayChangeFounderRoot !== false) failures.push('root_change_guard_missing');
          if (policy.antiTakeover?.automationMayDisableFounderControls !== false) failures.push('founder_control_disable_guard_missing');
          if (policy.antiTakeover?.ambiguousIdentityFailsClosed !== true) failures.push('fail_closed_guard_missing');
          const required = [
            '.github/CODEOWNERS',
            '.github/workflows/founder-sovereignty-inheritance-gate.yml',
            'config/governance/founder-sovereignty-inheritance-v1.json',
            'docs/governance/FOUNDER_SOVEREIGNTY_INHERITANCE_V1.md'
          ];
          const protectedPaths = new Set(policy.protectedPaths || []);
          for (const requiredPath of required) if (!protectedPaths.has(requiredPath)) failures.push(`protected_path_missing:${requiredPath}`);
          const evidence = {
            schema: 'daube.founder-sovereignty-inheritance-validation.v1',
            revision: process.env.GITHUB_SHA,
            policyId: policy.id,
            canonicalPolicy: policy.canonicalPolicy,
            founderRootPrincipal: { githubLogin: policy.founderRootPrincipal.githubLogin, githubUserId: policy.founderRootPrincipal.githubUserId },
            failures,
            ok: failures.length === 0,
            truthBoundary: policy.truthBoundary
          };
          fs.writeFileSync('outputs/founder-sovereignty-inheritance/policy-validation.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence, null, 2));
          if (failures.length) process.exit(1);
          NODE

      - name: Capture changed paths from PR merge base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          test -n "$MERGE_BASE"
          printf '%s\n' "$MERGE_BASE" > outputs/founder-sovereignty-inheritance/merge-base.txt
          git diff --name-only "$MERGE_BASE" "$HEAD_SHA" > outputs/founder-sovereignty-inheritance/changed-files.txt
          cat outputs/founder-sovereignty-inheritance/changed-files.txt

      - name: Enforce Founder-only protected-root mutations
        if: github.event_name == 'pull_request'
        env:
          ACTOR_LOGIN: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const policy = JSON.parse(fs.readFileSync('config/governance/founder-sovereignty-inheritance-v1.json', 'utf8'));
          const changed = fs.readFileSync('outputs/founder-sovereignty-inheritance/changed-files.txt', 'utf8').split(/\r?\n/).filter(Boolean);
          const protectedPaths = new Set(policy.protectedPaths || []);
          const protectedChanges = changed.filter(path => protectedPaths.has(path));
          const actor = { githubLogin: process.env.ACTOR_LOGIN, githubUserId: Number(process.env.ACTOR_ID) };
          const founderMatch = String(actor.githubLogin).toLowerCase() === String(policy.founderRootPrincipal.githubLogin).toLowerCase()
            && Number(actor.githubUserId) === Number(policy.founderRootPrincipal.githubUserId);
          const authorized = protectedChanges.length === 0 || founderMatch;
          const evidence = {
            schema: 'daube.founder-sovereignty-inheritance-root-mutation.v1',
            revision: process.env.GITHUB_SHA,
            actor,
            protectedChanges,
            founderMatch,
            authorized,
            decision: authorized ? (protectedChanges.length ? 'AUTHORIZED_ROOT_FOUNDER' : 'NO_ROOT_AUTHORITY_REQUIRED') : 'DENY_ROOT_MUTATION',
            truthBoundary: 'Authenticated GitHub actor identity is one repository control signal; it does not replace external account security, organization ownership or applicable law.'
          };
          fs.writeFileSync('outputs/founder-sovereignty-inheritance/root-mutation.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence, null, 2));
          if (!authorized) process.exit(1);
          NODE

      - name: Upload sovereignty inheritance evidence
        uses: actions/upload-artifact@v4
        with:
          name: founder-sovereignty-inheritance-${{ github.sha }}
          path: outputs/founder-sovereignty-inheritance
          if-no-files-found: error
          retention-days: 30
