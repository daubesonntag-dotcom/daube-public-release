name: Fresh GitHub Actions Cross-OS Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/actions-scheduler-fresh-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: printf 'DAUBE_RUNNER_POOL=ubuntu-latest PASS\n'

  ubuntu-slim:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - run: printf 'DAUBE_RUNNER_POOL=ubuntu-slim PASS\n'

  ubuntu-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - run: printf 'DAUBE_RUNNER_POOL=ubuntu-24.04-arm PASS\n'

  macos:
    runs-on: macos-latest
    timeout-minutes: 2
    steps:
      - run: printf 'DAUBE_RUNNER_POOL=macos-latest PASS\n'

  windows:
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - shell: pwsh
        run: Write-Output 'DAUBE_RUNNER_POOL=windows-latest PASS'
