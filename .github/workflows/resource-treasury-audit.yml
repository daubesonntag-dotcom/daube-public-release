name: Resource Treasury — Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-treasury-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify local assets, checksums, provenance and rights metadata
        run: node scripts/treasury-audit.mjs
      - name: Dry-run pinned intake plan
        run: node scripts/treasury-import.mjs --plan=config/treasury/intake-plan-lucide-v1.json --dry-run
