name: Publish D’AUBE Public Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure GitHub Pages workflow hosting is enabled
        id: pages-preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )

          status="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' "${headers[@]}" "$api")"
          if [[ "$status" == "404" ]]; then
            create_status="$(curl --silent --show-error --output /tmp/pages-create.json --write-out '%{http_code}' \
              --request POST "${headers[@]}" --header 'Content-Type: application/json' \
              --data '{"build_type":"workflow"}' "$api")"
            if [[ "$create_status" == "201" || "$create_status" == "409" ]]; then
              sleep 2
              status="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' "${headers[@]}" "$api")"
            fi
          fi

          if [[ "$status" != "200" ]]; then
            echo "::error title=GitHub Pages unavailable::Pages API returned HTTP $status"
            exit 1
          fi

          build_type="$(python3 -c "import json; print((json.load(open('/tmp/pages.json', encoding='utf-8')).get('build_type') or ''))")"
          echo "Pages enabled with build type: ${build_type:-unknown}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload current public site
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify deployed endpoint matches current homepage artifact
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          test -s index.html
          expected_sha="$(sha256sum index.html | awk '{print $1}')"
          verified=0
          code=unknown
          actual_sha=unknown
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --location --output /tmp/daube-live.html --write-out '%{http_code}' "$PAGE_URL" || true)"
            if [[ "$code" == "200" ]] && test -s /tmp/daube-live.html; then
              actual_sha="$(sha256sum /tmp/daube-live.html | awk '{print $1}')"
              if [[ "$actual_sha" == "$expected_sha" ]] \
                && grep -q 'D’AUBE SONNTAG · RẠNG TRONG' /tmp/daube-live.html \
                && grep -q 'Meaning,' /tmp/daube-live.html; then
                verified=1
                break
              fi
            fi
            sleep 2
          done
          if [[ "$verified" != "1" ]]; then
            echo "::error title=Public artifact readback failed::Endpoint did not converge to the exact current index.html artifact. expected_sha=${expected_sha} actual_sha=${actual_sha} code=${code}"
            exit 1
          fi
          {
            echo '## Live public artifact verified'
            echo
            echo "Endpoint: $PAGE_URL"
            echo "Current index.html SHA-256: ${expected_sha}"
            echo 'RẠNG TRONG marker: VERIFIED'
            echo 'Meaning marker: VERIFIED'
            echo 'Exact current homepage bytes: VERIFIED'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish observable commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION='GitHub Pages exact current homepage publication verified' ;;
            cancelled) STATE=error; DESCRIPTION='GitHub Pages publication cancelled' ;;
            *) STATE=failure; DESCRIPTION='GitHub Pages exact current homepage publication failed' ;;
          esac
          export STATE DESCRIPTION
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'state': os.environ['STATE'],
            'context': 'ci/github-pages: publish',
            'description': os.environ['DESCRIPTION'][:140],
            'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }))
          PY
          )"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

  https-proof:
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout current homepage artifact
        uses: actions/checkout@v7

      - name: Verify canonical HTTPS apex matches current homepage artifact
        id: verify-https
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          expected_sha="$(sha256sum index.html | awk '{print $1}')"
          verified=0
          code=unknown
          actual_sha=unknown
          for attempt in $(seq 1 15); do
            code="$(curl --silent --show-error --output /tmp/daube-https.html --write-out '%{http_code}' https://daubesonntag.com/ || true)"
            if [[ "$code" == "200" ]] && test -s /tmp/daube-https.html; then
              actual_sha="$(sha256sum /tmp/daube-https.html | awk '{print $1}')"
              if [[ "$actual_sha" == "$expected_sha" ]] \
                && grep -q 'D’AUBE SONNTAG · RẠNG TRONG' /tmp/daube-https.html \
                && grep -q 'Meaning,' /tmp/daube-https.html; then
                verified=1
                break
              fi
            fi
            echo "HTTPS readback attempt ${attempt}: code=${code:-curl-error}; expected_sha=${expected_sha}; actual_sha=${actual_sha}"
            sleep 2
          done
          if [[ "$verified" != "1" ]]; then
            echo "::error title=Canonical HTTPS readback failed::HTTPS apex did not match the exact current homepage artifact. expected_sha=${expected_sha} actual_sha=${actual_sha} code=${code}"
            exit 1
          fi

          effective_url="$(curl --fail --silent --show-error --location \
            --output /tmp/daube-http-follow.html --write-out '%{url_effective}' \
            http://daubesonntag.com/ || true)"
          if [[ "$effective_url" == https://daubesonntag.com* ]]; then
            echo 'HTTP_UPGRADE=verified' >> "$GITHUB_ENV"
          else
            echo 'HTTP_UPGRADE=not-enforced' >> "$GITHUB_ENV"
            echo "::warning title=HTTP transport upgrade not enforced::Direct HTTPS is verified, but HTTP effective URL is ${effective_url:-unknown}. This is a separate Pages setting hardening item."
          fi
          {
            echo '## Canonical HTTPS proof'
            echo "- https://daubesonntag.com/: 200 + exact current homepage SHA-256 ${expected_sha} VERIFIED"
            echo "- HTTP effective URL: ${effective_url:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish HTTPS proof status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) STATE=success; DESCRIPTION='Canonical HTTPS apex matches exact current homepage artifact' ;;
            cancelled) STATE=error; DESCRIPTION='Canonical HTTPS homepage proof cancelled' ;;
            *) STATE=failure; DESCRIPTION='Canonical HTTPS exact-homepage proof failed' ;;
          esac
          export STATE DESCRIPTION
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'state': os.environ['STATE'],
            'context': 'ci/github-pages: https',
            'description': os.environ['DESCRIPTION'][:140],
            'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          }))
          PY
          )"
          curl --fail --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
