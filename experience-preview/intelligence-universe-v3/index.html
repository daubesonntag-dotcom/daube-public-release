<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7fbff}#app{display:block;width:100%;height:100%;border:0;background:#f7fbff}

<body>

f.addEventListener('load',()=>{

    const style=d.createElement('style');
    style.textContent=`

.glass,.card,.metric,.module,.status,.tabs,.cc{background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(242,248,255,.50))!important;border:1px solid rgba(87,112,166,.13)!important;box-shadow:0 18px 58px rgba(66,86,137,.08),inset 0 1px 0 rgba(255,255,255,.96)!important;backdrop-filter:blur(26px) saturate(135%)!important}

.heroMain{min-height:310px!important;padding:26px!important;border-radius:30px!important;background:radial-gradient(460px 270px at 70% 36%,rgba(149,201,255,.23),transparent 53%),radial-gradient(430px 290px at 69% 52%,rgba(207,174,255,.21),transparent 58%),linear-gradient(145deg,rgba(255,255,255,.88),rgba(239,246,255,.54))!important;border:1px solid rgba(95,121,171,.11)!important;box-shadow:0 32px 98px rgba(70,90,139,.13),inset 0 1px 0 rgba(255,255,255,.96)!important}.hero h1{font-family:ui-serif,"Iowan Old Style",Georgia,serif!important;font-weight:500!important;letter-spacing:-.055em!important;line-height:.91!important;font-size:clamp(46px,5.15vw,76px)!important;color:#202c43!important;background:none!important;-webkit-text-fill-color:initial!important}.hero h1 .v3accent{background:linear-gradient(135deg,#7388df,#aa8ff0 48%,#91b8e0)!important;-webkit-background-clip:text!important;color:transparent!important}.heroCopy,.hero-copy{max-width:500px!important;color:#657187!important;line-height:1.65!important}.eyebrow{letter-spacing:.18em!important;color:#8390a6!important}.crystal{filter:drop-shadow(0 28px 38px rgba(88,109,189,.15))!important;opacity:.94!important}.crystal svg{transform:scale(.92)!important}.status{padding:16px!important}.stats{gap:7px!important}.stat{padding:11px 12px!important}.stat b{color:#26344d!important}
.tabs{padding:5px!important;border-radius:18px!important}.tab{font-size:9px!important;padding:11px 8px!important}.tab.active{background:rgba(255,255,255,.88)!important;color:#43549f!important;box-shadow:0 9px 25px rgba(77,98,148,.07),inset 0 0 0 1px rgba(91,114,168,.07)!important}.work{gap:10px!important}.module{border-radius:20px!important;padding:14px!important}.mh h2{font-size:17px!important;color:#24334b!important}.mh p{color:#7b8799!important}.filter{background:rgba(255,255,255,.66)!important;border-color:rgba(87,112,166,.12)!important}.filter.active{background:linear-gradient(135deg,#778cf0,#89b0ed)!important;color:#fff!important;border-color:transparent!important}.input,.select,.btn{background:rgba(255,255,255,.68)!important;border-color:rgba(87,112,166,.12)!important;color:#5b6880!important}.btn.primary{background:linear-gradient(135deg,#758cf4,#85b2ee)!important;color:#fff!important;border-color:transparent!important}.card{border-radius:18px!important}.mvis{height:126px!important}.mcard:hover{transform:translateY(-2px)!important;box-shadow:0 18px 42px rgba(65,85,133,.10)!important}.dna-orb,.ring{box-shadow:0 18px 46px rgba(96,112,193,.14)!important}.palette .swatch,.sw{border-radius:11px!important}.product-visual,.pvisual{border-radius:16px!important}.truthbar,.truth{color:#8d98aa!important}

`;
    d.head.appendChild(style);

    const h1=d.querySelector('.hero h1');
    if(h1) h1.innerHTML='Vật liệu. Màu sắc.<br><span class="v3accent">Sáng tạo.</span>';
    const copy=d.querySelector('.heroCopy,.hero-copy');
    if(copy) copy.textContent='D’AUBE Intelligence Universe kết nối re:FILUM, Color DNA và Creative Market thành một workspace trực quan — giàu chiều sâu, sạch, sáng và dễ thao tác.';
    const brandSmall=d.querySelector('.brand small');
    if(brandSmall) brandSmall.textContent='Founder Limited Edition · Preview';

    const app=d.querySelector('.app');
    if(app && !d.querySelector('.v3rail')){
      const rail=d.createElement('aside'); rail.className='v3rail';
      rail.innerHTML=`<div class="v3rc"><div class="v3title">Current selection</div><div class="v3sel"><div class="v3vis"></div><div><b>Titanium Brushed</b><small>Metal / Alloy · Material Inspector</small></div></div></div><div class="v3rc"><div class="v3title">Evidence & insight</div><div class="v3score"><div><b>Material report</b><small>class-level guidance</small></div><div class="v3circle">98</div></div><div class="v3score"><div><b>Color report</b><small>digital intent</small></div><div class="v3circle">94</div></div><div class="v3score"><div><b>Accessibility</b><small>render preview</small></div><div class="v3circle">AA</div></div></div><div class="v3rc"><div class="v3title">Recent activity</div><div class="v3act"><div class="v3ava"></div><div><b>Material explored</b><small>Aurora Glass · Optical</small></div><span class="v3time">2m</span></div><div class="v3act"><div class="v3ava"></div><div><b>Color DNA generated</b><small>Ocean Depths</small></div><span class="v3time">5m</span></div><div class="v3act"><div class="v3ava"></div><div><b>Preview opened</b><small>Creative System</small></div><span class="v3time">8m</span></div></div><div class="v3rc"><div class="v3title">Founder truth boundary</div><p style="font-size:7px;line-height:1.55;color:#8c97aa;margin:8px 0 0">Static Founder preview only. No production DB mutation, checkout, settlement, entitlement-delivery or revenue claim.</p></div>`;
      app.appendChild(rail);
    }

    // Keep all V2 interactions intact; V3 only changes the presentation layer and adds a review rail.
    w.dispatchEvent(new Event('resize'));
  }catch(err){console.error('V3 visual adapter:',err)}
});
</script>
</body>
</html>
