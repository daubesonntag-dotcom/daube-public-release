name: D'AUBE Web Lockfile Forge

on:
  push:
    branches:
      - lockgen/daube-web-20260829
    paths:
      - lockgen/daube-web/package.json
      - .github/workflows/daube-web-lockgen.yml

permissions:
  contents: write

jobs:
  lockgen:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: lockgen/daube-web-20260829
          persist-credentials: true
          fetch-depth: 1
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Generate lockfile only
        working-directory: lockgen/daube-web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile can drive a clean install
        working-directory: lockgen/daube-web
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reject mutable direct dependency ranges
        working-directory: lockgen/daube-web
        run: |
          node - <<'NODE'
          const p = require('./package.json');
          for (const group of ['dependencies','devDependencies']) {
            for (const [name, version] of Object.entries(p[group] || {})) {
              if (!/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(version)) {
                throw new Error(`${group}.${name} is not exact: ${version}`);
              }
            }
          }
          NODE
      - name: Emit content-addressed receipt
        working-directory: lockgen/daube-web
        run: |
          LOCK_SHA256="$(sha256sum package-lock.json | awk '{print $1}')"
          node -e "const fs=require('fs'); fs.writeFileSync('lock-receipt.json', JSON.stringify({schema:'daube.public-lock-receipt.v1', sourceCommit:process.env.GITHUB_SHA, node:process.version, lockfile:'package-lock.json', sha256:process.env.LOCK_SHA256, cleanNpmCiPassed:true, exactDirectRangesPassed:true}, null, 2)+'\n')" 
        env:
          LOCK_SHA256: ${{ env.LOCK_SHA256 }}
      - name: Normalize receipt digest
        working-directory: lockgen/daube-web
        run: |
          LOCK_SHA256="$(sha256sum package-lock.json | awk '{print $1}')"
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const lock = fs.readFileSync('package-lock.json');
          const receipt = {
            schema: 'daube.public-lock-receipt.v1',
            lockfile: 'package-lock.json',
            sha256: crypto.createHash('sha256').update(lock).digest('hex'),
            cleanNpmCiPassed: true,
            exactDirectRangesPassed: true,
            source: 'daubesonntag-dotcom/daube-public-release:lockgen/daube-web-20260829'
          };
          fs.writeFileSync('lock-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE
      - name: Commit generated lockfile and receipt
        run: |
          git config user.name 'D-AUBE Lockfile Forge'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add lockgen/daube-web/package-lock.json lockgen/daube-web/lock-receipt.json
          git diff --cached --quiet && exit 0
          git commit -m 'lockgen: materialize daube-web package-lock receipt'
          git push origin HEAD:lockgen/daube-web-20260829
