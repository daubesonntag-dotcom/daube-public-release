name: Publish D’AUBE Public Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check whether GitHub Pages is enabled
        id: pages-preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages")"

          if [[ "${status}" == "200" ]]; then
            echo 'enabled=true' >> "${GITHUB_OUTPUT}"
            echo 'GitHub Pages is enabled; deployment may proceed.' >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'enabled=false' >> "${GITHUB_OUTPUT}"
            echo "http_status=${status}" >> "${GITHUB_OUTPUT}"
            {
              echo '## GitHub Pages deployment skipped'
              echo
              echo "Pages API returned HTTP ${status}."
              echo 'The repository content is valid, but Pages must be enabled by an authorized repository administrator before this workflow can deploy.'
              echo 'No deployment claim is made from this skipped run.'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Configure GitHub Pages
        if: steps.pages-preflight.outputs.enabled == 'true'
        uses: actions/configure-pages@v6

      - name: Upload public site
        if: steps.pages-preflight.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy public site
        if: steps.pages-preflight.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
