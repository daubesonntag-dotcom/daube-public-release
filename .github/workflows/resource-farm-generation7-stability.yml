name: Resource Farm Generation 7 Stability Trial

on:
  pull_request:
    paths:
      - '.github/workflows/resource-farm-generation7-stability.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/resource-farm-generation7-stability.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: resource-farm-generation7-stability-${{ github.ref }}
  cancel-in-progress: true

env:
  FARM_GENERATION: '7'
  FARM_WORK_UNITS_PER_PRODUCER: '250000'
  FARM_TARGET_GITHUB_THROUGHPUT: '25000000'
  FARM_MIN_REPLICAS: '2'
  FARM_MAX_REPLICAS: '8'
  FARM_SCALE_STEP: '1'
  FARM_DOWNSCALE_FLOOR_RATIO: '0.95'
  FARM_OVERSHOOT_RATIO: '1.05'
  FARM_RUNTIME_FLOOR_RATIO: '0.85'

jobs:
  foreman-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      target_replicas: ${{ steps.plan.outputs.target_replicas }}
      prior_replicas: ${{ steps.plan.outputs.prior_replicas }}
      prior_throughput: ${{ steps.plan.outputs.prior_throughput }}
      prior_run_id: ${{ steps.discover.outputs.prior_run_id }}
      action: ${{ steps.plan.outputs.action }}
      candidate_down_projected: ${{ steps.plan.outputs.candidate_down_projected }}
    steps:
      - name: Discover canonical generation 6 seed bank
        id: discover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['REPOSITORY']; token=os.environ['GH_TOKEN']; api='https://api.github.com'
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','User-Agent':'daube-resource-farm-generation7/1'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=15) as r: return json.load(r)
          runs=get(f'{api}/repos/{repo}/actions/workflows/resource-farm-public-runner-evidence.yml/runs?branch=main&status=success&per_page=10')['workflow_runs']
          prior=None
          for run in runs:
              artifacts=get(f'{api}/repos/{repo}/actions/runs/{run["id"]}/artifacts?per_page=100').get('artifacts',[])
              if any(a.get('name')=='farm-generation-6-seed-bank' and not a.get('expired',False) for a in artifacts):
                  prior=run; break
          if not prior: raise SystemExit('no fresh canonical generation-6 seed bank: fail closed')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'prior_run_id={prior["id"]}\n')
          print(json.dumps({'schema':'daube.resource-farm-seed-discovery.v3','generation':7,'priorRunId':prior['id'],'seedBank':'farm-generation-6-seed-bank'},sort_keys=True))
          PY
      - name: Germinate generation 6 seed bank
        uses: actions/download-artifact@v4
        with:
          name: farm-generation-6-seed-bank
          path: /tmp/prior-seed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.discover.outputs.prior_run_id }}
      - name: Decide grow hold or prune
        id: plan
        shell: bash
        env:
          PRIOR_RUN_ID: ${{ steps.discover.outputs.prior_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json,math,os
          files=glob.glob('/tmp/prior-seed/**/*.json',recursive=True)
          if not files: raise SystemExit('generation-6 seed bank has no JSON receipt')
          seed=json.load(open(files[0])); prior_replicas=int(seed.get('producerReplicas') or 0); prior_throughput=float(seed.get('githubParallelThroughput') or 0)
          if prior_replicas<1 or prior_throughput<=0: raise SystemExit('generation-6 seed lacks admitted herd metrics')
          avg=prior_throughput/prior_replicas; target=float(os.environ['FARM_TARGET_GITHUB_THROUGHPUT'])
          min_r=int(os.environ['FARM_MIN_REPLICAS']); max_r=int(os.environ['FARM_MAX_REPLICAS']); step=int(os.environ['FARM_SCALE_STEP'])
          floor=float(os.environ['FARM_DOWNSCALE_FLOOR_RATIO']); overshoot=float(os.environ['FARM_OVERSHOOT_RATIO']); ratio=prior_throughput/target
          candidate_down=max(min_r,prior_replicas-step); projected_down=avg*candidate_down; needed=max(min_r,min(max_r,math.ceil(target/avg)))
          if ratio>overshoot and candidate_down<prior_replicas and projected_down>=target*floor:
              bounded=candidate_down; action='downscale-efficiency'
          elif ratio<floor:
              bounded=min(max_r,prior_replicas+step); action='upscale-recovery'
          else:
              bounded=prior_replicas; action='hold-hysteresis'
          bounded=max(min_r,min(max_r,bounded)); matrix=list(range(bounded))
          receipt={'schema':'daube.resource-farm-foreman-plan.v3','generation':7,'priorRunId':int(os.environ['PRIOR_RUN_ID']),'priorReplicas':prior_replicas,'priorGithubParallelThroughput':prior_throughput,'priorAverageProducerThroughput':round(avg,2),'targetGithubParallelThroughput':target,'priorTargetRatio':round(ratio,6),'candidateDownReplicas':candidate_down,'candidateDownProjectedThroughput':round(projected_down,2),'candidateDownTargetRatio':round(projected_down/target,6),'neededReplicasAtPriorAverage':needed,'targetReplicas':bounded,'foremanAction':action,'matrix':matrix,'paidSpendAuthorized':False,'privateAssetsUsed':False}
          json.dump(receipt,open('/tmp/foreman-plan.json','w'),sort_keys=True); print(json.dumps(receipt,sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n'); f.write(f'target_replicas={bounded}\nprior_replicas={prior_replicas}\nprior_throughput={prior_throughput}\naction={action}\ncandidate_down_projected={projected_down:.2f}\n')
          PY
      - name: Store generation 7 foreman plan
        uses: actions/upload-artifact@v4
        with:
          name: farm-generation-7-foreman-plan
          path: /tmp/foreman-plan.json
          if-no-files-found: error
          retention-days: 7

  parallel-producers:
    needs: foreman-plan
    name: producer-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.foreman-plan.outputs.matrix) }}
    steps:
      - name: CPU production receipt
        shell: bash
        env:
          FARM_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,platform,time
          shard=int(os.environ['FARM_SHARD']); work=int(os.environ['FARM_WORK_UNITS_PER_PRODUCER']); started=time.perf_counter(); digest=hashlib.sha256()
          for i in range(work): digest.update(f'daube-farm-generation-7-{shard}-{i}'.encode())
          elapsed=max(time.perf_counter()-started,1e-9)
          r={'schema':'daube.resource-farm-parallel-producer-receipt.v7','generation':7,'resourceClasses':['compute','ci-build'],'poolId':f'github-public-runner-{shard}','providerFamily':'github-public-runner','backend':'github-hosted-linux-cpu','shard':shard,'runnerOS':platform.system(),'arch':platform.machine(),'cpuCount':os.cpu_count(),'workUnits':work,'workUnitsPerSecond':round(work/elapsed,2),'latencyMs':round(elapsed*1000,2),'sha256':digest.hexdigest(),'success':True,'observedAt':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'paidSpendAuthorized':False,'privateAssetsUsed':False}
          json.dump(r,open(f'/tmp/producer-{shard}.json','w'),sort_keys=True); print(json.dumps(r,sort_keys=True)); assert r['runnerOS']=='Linux' and r['cpuCount']>=1 and r['workUnitsPerSecond']>0
          PY
      - name: Compiler production receipt
        shell: bash
        env:
          FARM_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cat >/tmp/farm_canary.c <<'C'
          #include <stdio.h>
          #include <stdlib.h>
          int main(int argc,char **argv){unsigned long s=(argc>1)?strtoul(argv[1],0,10):0;unsigned long x=2166136261u+s;for(unsigned long i=0;i<100000;i++){x^=(i+s);x*=16777619u;}printf("FARM_COMPILED_OK:%lu:%lu\n",s,x);return 0;}
          C
          gcc -O2 /tmp/farm_canary.c -o /tmp/farm_canary; /tmp/farm_canary "$FARM_SHARD" | grep -q "^FARM_COMPILED_OK:${FARM_SHARD}:"
      - name: Store producer pollen receipt
        uses: actions/upload-artifact@v4
        with:
          name: farm7-producer-${{ matrix.shard }}
          path: /tmp/producer-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  browser-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Headless browser production receipt
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"; test -n "$CHROME"
          printf '%s' '<!doctype html><div id="r">boot</div><script>let x=0;for(let i=0;i<32768;i++)x=(x^((i*2654435761)>>>0))>>>0;document.getElementById("r").textContent="FARM7_BROWSER_OK:"+x</script>' >/tmp/farm7-browser.html
          python3 -m http.server 8765 --directory /tmp >/tmp/farm7-http.log 2>&1 & SERVER_PID=$!; trap 'kill $SERVER_PID || true' EXIT; sleep 1
          "$CHROME" --headless --no-sandbox --disable-gpu --dump-dom http://127.0.0.1:8765/farm7-browser.html | grep -q 'FARM7_BROWSER_OK:'

  pollination-harvest:
    if: always()
    needs: [foreman-plan, parallel-producers, browser-canary]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Admit feed and pollen sources
        shell: bash
        env:
          FOREMAN_RESULT: ${{ needs.foreman-plan.result }}
          PRODUCERS_RESULT: ${{ needs.parallel-producers.result }}
          BROWSER_RESULT: ${{ needs.browser-canary.result }}
        run: 'test "$FOREMAN_RESULT" = success && test "$PRODUCERS_RESULT" = success && test "$BROWSER_RESULT" = success'
      - name: Collect GitHub producer pollen
        uses: actions/download-artifact@v4
        with:
          pattern: farm7-producer-*
          path: /tmp/farm7-pollen
          merge-multiple: true
      - name: Collect Supabase Edge pollen
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 15 --header 'accept: application/json' 'https://wilqsqndjgckqxbjptxm.supabase.co/functions/v1/daube-resource-farm-pollen-edge/v1/farm/pollen?generation=7' --output /tmp/farm7-pollen/supabase-edge.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/farm7-pollen/supabase-edge.json')); assert r['schema']=='daube.resource-farm-pollen-receipt.v2' and r['generation']==7 and r['providerFamily']=='supabase-edge' and r['workUnits']==250000 and r['workUnitsPerSecond']>0 and r['success'] is True and r['paidSpendAuthorized'] is False and r['privateAssetsUsed'] is False; print(json.dumps(r,sort_keys=True))
          PY
      - name: Stability harvest
        shell: bash
        env:
          EXPECTED_REPLICAS: ${{ needs.foreman-plan.outputs.target_replicas }}
          PRIOR_REPLICAS: ${{ needs.foreman-plan.outputs.prior_replicas }}
          PRIOR_THROUGHPUT: ${{ needs.foreman-plan.outputs.prior_throughput }}
          PRIOR_RUN_ID: ${{ needs.foreman-plan.outputs.prior_run_id }}
          FOREMAN_ACTION: ${{ needs.foreman-plan.outputs.action }}
          CANDIDATE_DOWN_PROJECTED: ${{ needs.foreman-plan.outputs.candidate_down_projected }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob,json,os
          expected=int(os.environ['EXPECTED_REPLICAS']); files=sorted(glob.glob('/tmp/farm7-pollen/producer-*.json')); assert len(files)==expected
          producers=[]; shards=set()
          for p in files:
              r=json.load(open(p)); assert r['schema']=='daube.resource-farm-parallel-producer-receipt.v7' and r['generation']==7 and r['success'] is True and r['paidSpendAuthorized'] is False and r['privateAssetsUsed'] is False and r['shard'] not in shards; shards.add(r['shard']); producers.append(r)
          edge=json.load(open('/tmp/farm7-pollen/supabase-edge.json')); throughput=round(sum(r['workUnitsPerSecond'] for r in producers),2); work=sum(r['workUnits'] for r in producers); families=sorted(set([r['providerFamily'] for r in producers]+[edge['providerFamily']])); target=float(os.environ['FARM_TARGET_GITHUB_THROUGHPUT']); floor=float(os.environ['FARM_RUNTIME_FLOOR_RATIO'])
          h={'schema':'daube.resource-farm-pollination-harvest.v7','generation':7,'producerReplicas':len(producers),'priorProducerReplicas':int(os.environ['PRIOR_REPLICAS']),'priorGithubParallelThroughput':float(os.environ['PRIOR_THROUGHPUT']),'priorRunId':int(os.environ['PRIOR_RUN_ID']),'foremanAction':os.environ['FOREMAN_ACTION'],'candidateDownProjectedThroughput':float(os.environ['CANDIDATE_DOWN_PROJECTED']),'githubAggregateWorkUnits':work,'githubParallelThroughput':throughput,'targetGithubParallelThroughput':target,'actualTargetRatio':round(throughput/target,6),'externalPollinatorWorkUnits':edge['workUnits'],'externalPollinatorThroughput':edge['workUnitsPerSecond'],'totalEvidenceWorkUnits':work+edge['workUnits'],'providerFamilies':families,'providerFamilyCount':len(families),'monocultureRisk':len(families)<2,'crossProviderPollination':len(families)>=2,'stabilityTrial':True,'paidSpendAuthorized':False,'privateAssetsUsed':False}
          assert work==expected*250000 and len(families)>=2 and h['monocultureRisk'] is False and throughput>=target*floor
          json.dump(h,open('/tmp/farm7-harvest.json','w'),sort_keys=True); print(json.dumps(h,sort_keys=True))
          PY
      - name: Store generation 7 seed bank
        uses: actions/upload-artifact@v4
        with:
          name: farm-generation-7-seed-bank
          path: /tmp/farm7-harvest.json
          if-no-files-found: error
          retention-days: 7
      - name: Store external pollinator receipt
        uses: actions/upload-artifact@v4
        with:
          name: farm7-pollinator-supabase-edge
          path: /tmp/farm7-pollen/supabase-edge.json
          if-no-files-found: error
          retention-days: 1

  prove-stability:
    if: always()
    needs: [foreman-plan, parallel-producers, browser-canary, pollination-harvest]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Admit generation 7 stability
        shell: bash
        env:
          FOREMAN: ${{ needs.foreman-plan.result }}
          PRODUCERS: ${{ needs.parallel-producers.result }}
          BROWSER: ${{ needs.browser-canary.result }}
          HARVEST: ${{ needs.pollination-harvest.result }}
          ACTION: ${{ needs.foreman-plan.outputs.action }}
          REPLICAS: ${{ needs.foreman-plan.outputs.target_replicas }}
        run: |
          test "$FOREMAN" = success && test "$PRODUCERS" = success && test "$BROWSER" = success && test "$HARVEST" = success
          echo "FARM7_STABILITY_OK:$REPLICAS:$ACTION:CROSS_PROVIDER"
