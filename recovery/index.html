<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="theme-color" content="#f8fbff">
  <meta name="description" content="D’AUBE SONNTAG · RẠNG TRONG · temporary public recovery surface.">
  <title>D’AUBE SONNTAG — Rạng Trong · Public Recovery</title>
  <style>
    :root{color-scheme:light;--ink:#121826;--muted:#667085;--line:rgba(18,24,38,.11);--glass:rgba(255,255,255,.72);--green:#20a464}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#f9fcff;color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif}
    body{min-height:100svh;display:grid;place-items:center;overflow-x:hidden;background:radial-gradient(circle at 28% 18%,#fff 0,#f7fbff 38%,#eef6ff 68%,#faf8ff 100%)}
    body:before{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(circle at 32% 30%,rgba(187,225,255,.52),transparent 25%),radial-gradient(circle at 76% 68%,rgba(224,214,255,.42),transparent 24%);filter:blur(36px);animation:drift 16s ease-in-out infinite alternate}
    main{position:relative;width:min(1120px,calc(100vw - 40px));min-height:min(720px,calc(100svh - 40px));display:flex;flex-direction:column;justify-content:space-between;padding:clamp(28px,5vw,72px);border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(22px) saturate(115%);box-shadow:0 30px 90px rgba(45,64,90,.10)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-size:12px;font-weight:700;letter-spacing:.22em}.status{display:inline-flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.66);color:var(--muted);font-size:11px;letter-spacing:.08em}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(32,164,100,.10)}
    .hero{padding:8vh 0 4vh}.eyebrow{margin:0 0 20px;color:var(--muted);font-size:12px;letter-spacing:.18em}.title{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(64px,10vw,150px);line-height:.80;letter-spacing:-.065em;font-weight:400}.title span{display:block;margin-left:.38em;font-size:.54em;font-style:italic;letter-spacing:-.04em;color:#5e6674}.manifesto{max-width:720px;margin:38px 0 0;font-size:clamp(19px,2vw,29px);line-height:1.46;letter-spacing:-.025em}
    footer{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;padding-top:22px;border-top:1px solid rgba(18,24,38,.09);color:var(--muted);font-size:12px;line-height:1.6}.truth{max-width:620px}.rev{white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    @keyframes drift{to{transform:translate3d(2.5%,2%,0) scale(1.035)}}
    @media(max-width:720px){body{display:block}main{width:calc(100vw - 24px);min-height:calc(100svh - 24px);margin:12px;padding:28px}.top,footer{align-items:flex-start;flex-direction:column}.hero{padding:11vh 0 9vh}.title{font-size:clamp(58px,20vw,100px)}.manifesto{font-size:19px}}
    @media(prefers-reduced-motion:reduce){body:before{animation:none}}
  </style>
</head>
<body>
  <main>
    <header class="top">
      <div class="brand">D’AUBE SONNTAG</div>
      <div class="status" aria-label="Public recovery online"><span class="dot" aria-hidden="true"></span>PUBLIC RECOVERY ONLINE</div>
    </header>
    <section class="hero" aria-labelledby="recovery-title">
      <p class="eyebrow">RẠNG TRONG · COMING SOON</p>
      <h1 id="recovery-title" class="title">D’AUBE <span>SONNTAG</span></h1>
      <p class="manifesto">Để ý niệm kết lấy dung hình, để ý nghĩa rạng thành hiện hữu.</p>
    </section>
    <footer>
      <div class="truth">Bề mặt phục hồi công khai tạm thời trong khi D’AUBE chuyển sang hạ tầng tự quản. Không phải sovereign production cuối cùng.</div>
      <div class="rev">control-plane 2e74f16493d</div>
    </footer>
  </main>
</body>
</html>
