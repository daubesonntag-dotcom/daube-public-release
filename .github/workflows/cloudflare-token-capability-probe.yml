name: Cloudflare token capability probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-token-capability-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 4457584ea99f52180c778f28e98e3400
    steps:
      - name: Classify without exposing secret
        shell: bash
        run: |
          set -euo pipefail
          token="${CLOUDFLARE_API_TOKEN:-}"
          [[ -n "$token" ]] || { echo 'token_presence=missing'; exit 2; }
          echo 'token_presence=present'
          if [[ "$token" == cfat_* ]]; then
            echo 'token_format=account_owned_cfat'
          else
            echo 'token_format=non_cfat_or_legacy'
          fi
          code_user="$(curl -sS -o /tmp/user-token.json -w '%{http_code}' -H "Authorization: Bearer ${token}" https://api.cloudflare.com/client/v4/user/tokens/verify || true)"
          echo "user_token_verify_http=${code_user}"
          code_workers="$(curl -sS -o /tmp/workers.json -w '%{http_code}' -H "Authorization: Bearer ${token}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" || true)"
          echo "workers_scripts_http=${code_workers}"
          if [[ "$code_workers" == '200' ]] && jq -e '.success == true' /tmp/workers.json >/dev/null 2>&1; then
            echo 'workers_api_capability=usable'
          else
            echo 'workers_api_capability=unusable_or_insufficient'
          fi
          rm -f /tmp/user-token.json /tmp/workers.json
          echo 'No credential value is printed or persisted.'
