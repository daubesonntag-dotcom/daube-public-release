    <circle cx="147" cy="121" r="7"/><circle cx="165" cy="136" r="6"/><circle cx="182" cy="148" r="5"/><circle cx="227" cy="100" r="7"/><circle cx="229" cy="124" r="5"/><circle cx="301" cy="110" r="7"/><circle cx="284" cy="129" r="5"/>
    <path d="M1565 218c35-43 67-62 103-78M1557 218c21-49 24-74 17-105M1547 219c-5-44-24-70-57-95" fill="none"/>
