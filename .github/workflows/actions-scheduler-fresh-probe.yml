name: Fresh GitHub Actions Scheduler Probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/actions-scheduler-fresh-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Prove runner assignment and step execution
        run: |
          set -euo pipefail
          printf 'DAUBE_GITHUB_ACTIONS_SCHEDULER_PROBE=PASS\n'
          printf 'GITHUB_RUN_ID=%s\n' "$GITHUB_RUN_ID"
          printf 'GITHUB_SHA=%s\n' "$GITHUB_SHA"
