name: Commerce Resource Farm bridge encrypted rescue

on:
  push:
    paths:
      - '.github/workflows/commerce-resource-farm-bridge-rescue.yml'
      - 'release/commerce-farm-bridge-rescue/request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-private-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate rescue request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            if ! git diff-tree --no-commit-id --name-only -r HEAD | grep -Fxq 'release/commerce-farm-bridge-rescue/request.json'; then
              echo 'pending=false' >> "$GITHUB_OUTPUT"
              echo 'NO_REQUEST_EVENT' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if [[ ! -f release/commerce-farm-bridge-rescue/request.json ]]; then
            echo 'pending=false' >> "$GITHUB_OUTPUT"
            echo 'NO_PENDING_REQUEST' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          request_id="$(jq -r '.requestId' release/commerce-farm-bridge-rescue/request.json)"
          expected_sha="$(jq -r '.expectedSha' release/commerce-farm-bridge-rescue/request.json)"
          profile="$(jq -r '.verificationProfile' release/commerce-farm-bridge-rescue/request.json)"
          [[ "$request_id" =~ ^[a-z0-9-]{8,80}$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$profile" == 'resource-farm-integration-v1' ]]
          echo 'pending=true' >> "$GITHUB_OUTPUT"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Generate one-run encryption identity
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          umask 077
          openssl req -x509 -newkey rsa:3072 -sha256 -nodes \
            -subj "/CN=daube-commerce-farm-bridge-${REQUEST_ID}" \
            -keyout /tmp/rescue-private.pem \
            -out /tmp/rescue-cert.pem \
            -days 1 >/dev/null 2>&1
          cert_b64="$(base64 -w0 /tmp/rescue-cert.pem)"
          body_b64="$(printf '%s' "$cert_b64" | base64 -w0)"
          key_path="release/commerce-farm-bridge-rescue/${REQUEST_ID}/recipient-cert.b64"
          gh api --method PUT -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${key_path}" \
            -f message="ci(farm-bridge): publish ephemeral recipient ${REQUEST_ID}" \
            -f content="$body_b64" -f branch="$GITHUB_REF_NAME" >/dev/null
          echo "RECIPIENT_READY ${REQUEST_ID}"

      - name: Await encrypted exact-SHA payload
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          payload_path="release/commerce-farm-bridge-rescue/${REQUEST_ID}/payload.cms.b64"
          found=0
          for attempt in $(seq 1 90); do
            if gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${payload_path}?ref=${GITHUB_REF_NAME}" \
              --jq '.content' >/tmp/github-content.b64 2>/dev/null; then
              tr -d '\n' </tmp/github-content.b64 | base64 -d >/tmp/payload-text.b64
              tr -d '\n' </tmp/payload-text.b64 | base64 -d >/tmp/payload.cms
              found=1
              break
            fi
            sleep 4
          done
          [[ "$found" == '1' ]] || { echo '::error::encrypted payload not received'; exit 71; }

      - name: Decrypt exact-SHA bridge bundle
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
          PROFILE: ${{ steps.request.outputs.profile }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/commerce-farm-bridge
          openssl cms -decrypt -binary -inform DER \
            -in /tmp/payload.cms -recip /tmp/rescue-cert.pem -inkey /tmp/rescue-private.pem \
            -out /tmp/commerce-farm-bridge.tar.gz
          tar -xzf /tmp/commerce-farm-bridge.tar.gz -C /tmp/commerce-farm-bridge
          cd /tmp/commerce-farm-bridge
          [[ "$(jq -r '.expectedSha' manifest.json)" == "$EXPECTED_SHA" ]]
          [[ "$(jq -r '.verificationProfile' manifest.json)" == "$PROFILE" ]]
          jq -e '.containsSecrets == false and .sourceVisibility == "private"' manifest.json >/dev/null
          test -f src/resource-farm-integration.ts
          test -f tests/resource-farm-integration.test.mjs

      - name: Typecheck and test bridge
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/commerce-farm-bridge
          npm exec --yes --package=typescript@5.8.3 -- \
            tsc --strict --target ES2022 --module NodeNext --moduleResolution NodeNext \
            --outDir dist --rootDir src src/resource-farm-integration.ts
          node --test tests/resource-farm-integration.test.mjs
          printf '%s\n' '["typescript-5.8.3-strict","resource-farm-integration-node-tests"]' > /tmp/bridge-checks.json

      - name: Emit sanitized execution receipt
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
          PROFILE: ${{ steps.request.outputs.profile }}
        run: |
          set -euo pipefail
          cd /tmp/commerce-farm-bridge
          python3 - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          files=['src/resource-farm-integration.ts','tests/resource-farm-integration.test.mjs']
          hashes={name:'sha256:'+hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files}
          receipt={
            'schema':'daube.commerce-resource-farm-bridge-rescue.v1',
            'ok':True,
            'requestId':os.environ['REQUEST_ID'],
            'sourceRevision':os.environ['EXPECTED_SHA'],
            'verificationProfile':os.environ['PROFILE'],
            'executor':'github-public-hosted-ubuntu',
            'runnerOs':platform.platform(),
            'privateSourcePublished':False,
            'secretsReceived':False,
            'productionMutationPerformed':False,
            'checks':json.loads(Path('/tmp/bridge-checks.json').read_text()),
            'files':hashes,
          }
          Path('/tmp/commerce-farm-bridge-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
          PY

      - uses: actions/upload-artifact@v4
        if: ${{ steps.request.outputs.pending == 'true' }}
        with:
          name: commerce-farm-bridge-rescue-${{ steps.request.outputs.request_id }}
          path: /tmp/commerce-farm-bridge-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish sanitized receipt
        if: ${{ steps.request.outputs.pending == 'true' && success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          receipt_path="release/commerce-farm-bridge-rescue/${REQUEST_ID}/receipt.json"
          body_b64="$(base64 -w0 /tmp/commerce-farm-bridge-receipt.json)"
          gh api --method PUT -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${receipt_path}" \
            -f message="ci(farm-bridge): publish sanitized receipt ${REQUEST_ID}" \
            -f content="$body_b64" -f branch="$GITHUB_REF_NAME" >/dev/null

      - name: Retire completed request and encrypted payload
        if: ${{ steps.request.outputs.pending == 'true' && success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          for path in \
            "release/commerce-farm-bridge-rescue/${REQUEST_ID}/payload.cms.b64" \
            "release/commerce-farm-bridge-rescue/${REQUEST_ID}/recipient-cert.b64" \
            "release/commerce-farm-bridge-rescue/request.json"; do
            sha="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
            if [[ -n "$sha" ]]; then
              gh api --method DELETE -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/contents/${path}" \
                -f message="ci(farm-bridge): retire completed request ${REQUEST_ID}" \
                -f sha="$sha" -f branch="$GITHUB_REF_NAME" >/dev/null
            fi
          done

      - name: Destroy ephemeral material
        if: ${{ always() && steps.request.outputs.pending == 'true' }}
        shell: bash
        run: |
          rm -rf /tmp/commerce-farm-bridge /tmp/commerce-farm-bridge.tar.gz /tmp/payload.cms \
            /tmp/payload-text.b64 /tmp/github-content.b64 /tmp/rescue-private.pem /tmp/rescue-cert.pem \
            /tmp/commerce-farm-bridge-receipt.json /tmp/bridge-checks.json /tmp/npm-cache
