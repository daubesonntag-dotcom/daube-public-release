<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://daubesonntag.com/payment/return/"><title>Payment Status — D’AUBE SONNTAG</title><style>:root{--bg:#f5f2e9;--ink:#252722;--muted:#5d635b;--line:rgba(37,39,34,.14)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui}.top{display:flex;justify-content:space-between;padding:28px clamp(22px,7vw,100px);border-bottom:1px solid var(--line)}.brand{color:inherit;text-decoration:none;font:500 13px Georgia,serif;letter-spacing:.2em}.hero{max-width:920px;padding:clamp(70px,12vw,150px) clamp(22px,8vw,120px)}.k{font-size:11px;letter-spacing:.28em;color:#687064}.hero h1{font:400 clamp(52px,8vw,100px)/.92 Georgia,serif;letter-spacing:-.045em;margin:22px 0}.lead{font:400 clamp(18px,2vw,25px)/1.55 Georgia,serif;color:#51564e}.detail{margin:26px 0;padding:18px 20px;border:1px solid var(--line);line-height:1.65;color:var(--muted);overflow-wrap:anywhere}.btn{display:inline-block;margin-top:8px;padding:14px 20px;border:1px solid var(--ink);background:var(--ink);color:#faf8f2;text-decoration:none;font-size:13px}</style></head><body><header class="top"><a class="brand" href="/">D’AUBE SONNTAG</a></header><main class="hero"><p class="k">PAYMENT STATUS</p><h1 id="title">Đang xác minh thanh toán.</h1><p class="lead">Trang này không suy ra trạng thái paid chỉ từ việc bạn quay lại từ cổng thanh toán. Trạng thái được đọc từ commerce runtime.</p><div class="detail" id="detail" aria-live="polite">Đang đọc order trong phiên hiện tại…</div><a class="btn" href="/products/micro-shop-launch-system/">Quay lại sản phẩm</a></main><script>const API='https://commerce.daubesonntag.com',KEY='daube-commerce-last-order-v1',title=document.getElementById('title'),detail=document.getElementById('detail');const id=sessionStorage.getItem(KEY);async function run(){if(!id){title.textContent='Chưa có order để xác minh.';detail.textContent='Không tìm thấy order hợp lệ trong phiên trình duyệt này. Không có trạng thái thanh toán nào được suy diễn.';return}try{const r=await fetch(API+'/v1/orders/'+encodeURIComponent(id),{headers:{Accept:'application/json'},credentials:'omit',cache:'no-store'});if(!r.ok)throw new Error('status');const x=await r.json();const paid=['PAID','FULFILLMENT_PENDING','FULFILLED'].includes(x.status);title.textContent=paid?'Thanh toán đã được xác minh.':'Đang xác minh thanh toán.';detail.textContent='Order '+x.orderId+' · '+x.status+' · '+x.nextAction+(paid?' · provider/reconciliation state đã được commerce runtime chấp nhận.':' · chưa ghi nhận paid từ việc quay lại trang này.')}catch{title.textContent='Chưa thể đọc trạng thái.';detail.textContent='Commerce runtime tạm thời chưa phản hồi. Không có trạng thái paid nào được suy diễn từ lỗi này.'}}run();</script></body></html>
