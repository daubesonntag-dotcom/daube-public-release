name: Cloudflare Builds state probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-builds-state-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 4457584ea99f52180c778f28e98e3400
      DAUBE_WORKER_NAME: daube-commerce
    steps:
      - name: Inspect sanitized Builds state
        shell: bash
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' "$1"; }
          api "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" > /tmp/scripts.json
          TAG="$(jq -r --arg n "$DAUBE_WORKER_NAME" '.result[]? | select(.id==$n) | .tag // empty' /tmp/scripts.json | head -n1)"
          [[ -n "$TAG" ]] || { echo 'worker_tag=missing'; exit 2; }
          echo 'worker_tag=present'
          code="$(curl -sS -o /tmp/triggers.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/workers/${TAG}/triggers" || true)"
          echo "triggers_http=${code}"
          if [[ "$code" == '200' ]]; then
            jq -c '{success, result:[.result[]? | {trigger_name,trigger_uuid,deleted_on,build_token_name,repo_connection:(.repo_connection|if . then {provider_type,provider_account_id,provider_account_name,repo_id,repo_name,repo_connection_uuid,deleted_on} else null end)}]}' /tmp/triggers.json
          fi
          code2="$(curl -sS -o /tmp/tokens.json -w '%{http_code}' -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/tokens" || true)"
          echo "build_tokens_http=${code2}"
          if [[ "$code2" == '200' ]]; then jq -c '{success,count:(.result|length),tokens:[.result[]?|{build_token_name,build_token_uuid,owner_type}]}' /tmp/tokens.json; fi
          rm -f /tmp/scripts.json /tmp/triggers.json /tmp/tokens.json
          echo 'No credential values were printed or persisted.'
