name: Work Arcade encrypted exact-SHA admission rescue

on:
  push:
    branches:
      - ops/work-arcade-encrypted-admission-20260829
    paths:
      - '.github/workflows/work-arcade-encrypted-admission-rescue.yml'
      - 'release/work-arcade-admission-rescue/request.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout public control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate rescue request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f release/work-arcade-admission-rescue/request.json ]]; then
            echo 'pending=false' >> "$GITHUB_OUTPUT"
            echo 'NO_PENDING_REQUEST' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          request_id="$(jq -r '.requestId' release/work-arcade-admission-rescue/request.json)"
          expected_sha="$(jq -r '.expectedSha' release/work-arcade-admission-rescue/request.json)"
          profile="$(jq -r '.verificationProfile' release/work-arcade-admission-rescue/request.json)"
          [[ "$request_id" =~ ^[a-z0-9-]{8,80}$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$profile" == 'full-suite-v1' ]]
          echo 'pending=true' >> "$GITHUB_OUTPUT"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Generate ephemeral recipient
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          umask 077
          openssl req -x509 -newkey rsa:3072 -sha256 -nodes \
            -subj "/CN=daube-work-arcade-admission-${REQUEST_ID}" \
            -keyout /tmp/rescue-private.pem -out /tmp/rescue-cert.pem -days 1 >/dev/null 2>&1
          cert_b64="$(base64 -w0 /tmp/rescue-cert.pem)"
          body_b64="$(printf '%s' "$cert_b64" | base64 -w0)"
          key_path="release/work-arcade-admission-rescue/${REQUEST_ID}/recipient-cert.b64"
          gh api --method PUT -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${key_path}" \
            -f message="ci(work-arcade): publish ephemeral recipient ${REQUEST_ID}" \
            -f content="$body_b64" -f branch="$GITHUB_REF_NAME" >/dev/null
          echo "RECIPIENT_READY ${REQUEST_ID}"

      - name: Await ciphertext payload
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          payload_path="release/work-arcade-admission-rescue/${REQUEST_ID}/payload.cms.b64"
          found=0
          for attempt in $(seq 1 120); do
            if gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${payload_path}?ref=${GITHUB_REF_NAME}" \
              --jq '.content' >/tmp/github-content.b64 2>/dev/null; then
              tr -d '\n' </tmp/github-content.b64 | base64 -d >/tmp/payload-text.b64
              tr -d '\n' </tmp/payload-text.b64 | base64 -d >/tmp/payload.cms
              found=1
              break
            fi
            sleep 4
          done
          [[ "$found" == '1' ]] || { echo '::error::encrypted payload not received'; exit 71; }

      - name: Decrypt and verify source manifest
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
          PROFILE: ${{ steps.request.outputs.profile }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/work-arcade-source
          openssl cms -decrypt -binary -inform DER \
            -in /tmp/payload.cms -recip /tmp/rescue-cert.pem -inkey /tmp/rescue-private.pem \
            -out /tmp/work-arcade-source.tar.gz
          tar -xzf /tmp/work-arcade-source.tar.gz -C /tmp/work-arcade-source
          cd /tmp/work-arcade-source
          [[ "$(jq -r '.expectedSha' manifest.json)" == "$EXPECTED_SHA" ]]
          [[ "$(jq -r '.verificationProfile' manifest.json)" == "$PROFILE" ]]
          jq -e '.containsSecrets == false and .sourceVisibility == "private" and (.files | type == "object")' manifest.json >/dev/null
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          for rel, expected in manifest['files'].items():
              p=Path(rel)
              if not p.is_file():
                  raise SystemExit(f'missing bundle file: {rel}')
              actual='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f'hash mismatch: {rel}')
          print(f"verified_bundle_files={len(manifest['files'])}")
          PY
          test -f tools/run_all_admission.py
          test -f policies/admission-python-requirements.txt
          test -f requirements-ci.txt

      - name: Install pinned validator dependencies
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement /tmp/work-arcade-source/policies/admission-python-requirements.txt

      - name: Capture remote Ubuntu environment
        if: ${{ steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/work-arcade-source/artifacts
          cd /tmp/work-arcade-source
          python3 - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          def out(*cmd): return subprocess.check_output(cmd, text=True).strip()
          receipt={
            'schema':'daube.work-arcade.remote-runner-environment.v1',
            'sourceSha':os.environ['EXPECTED_SHA'],
            'provider':'github-actions-public-encrypted-rescue',
            'runnerOs':os.environ.get('RUNNER_OS'),
            'runnerArch':os.environ.get('RUNNER_ARCH'),
            'platform':platform.platform(),
            'python':out('python3','--version'),
            'node':out('node','--version'),
            'githubRunId':os.environ.get('GITHUB_RUN_ID'),
            'githubRunAttempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
            'privateSourcePublished':False,
          }
          Path('artifacts/remote-runner-environment.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Run exact full admission suite
        id: suite
        if: ${{ steps.request.outputs.pending == 'true' }}
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          set -euo pipefail
          cd /tmp/work-arcade-source
          python3 tools/run_all_admission.py \
            --provider github-actions-public-encrypted-rescue \
            --ref "$EXPECTED_SHA"

      - name: Assemble sanitized evidence
        if: ${{ always() && steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/work-arcade-sanitized
          for f in admission-receipt.json readiness-reconciled.json remote-runner-environment.json; do
            if [[ -f "/tmp/work-arcade-source/artifacts/$f" ]]; then
              cp "/tmp/work-arcade-source/artifacts/$f" "/tmp/work-arcade-sanitized/$f"
            fi
          done
          if [[ -f /tmp/work-arcade-sanitized/admission-receipt.json ]]; then
            sha256sum /tmp/work-arcade-sanitized/admission-receipt.json > /tmp/work-arcade-sanitized/admission-receipt.json.sha256
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          status='passed' if os.environ.get('SUITE_OUTCOME') == 'success' else 'failed'
          summary={
            'schema':'daube.work-arcade.external-admission-summary.v1',
            'requestId':os.environ['REQUEST_ID'],
            'sourceSha':os.environ['EXPECTED_SHA'],
            'provider':'github-actions-public-encrypted-rescue',
            'suiteOutcome':status,
            'privateSourcePublished':False,
          }
          Path('/tmp/work-arcade-sanitized/summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload sanitized evidence artifact
        if: ${{ always() && steps.request.outputs.pending == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: work-arcade-encrypted-admission-${{ steps.request.outputs.request_id }}
          path: /tmp/work-arcade-sanitized/
          if-no-files-found: error
          retention-days: 30

      - name: Publish sanitized summary
        if: ${{ always() && steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          for name in summary.json admission-receipt.json admission-receipt.json.sha256 remote-runner-environment.json readiness-reconciled.json; do
            path="/tmp/work-arcade-sanitized/$name"
            [[ -f "$path" ]] || continue
            target="release/work-arcade-admission-rescue/${REQUEST_ID}/${name}"
            body_b64="$(base64 -w0 "$path")"
            gh api --method PUT -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${target}" \
              -f message="ci(work-arcade): publish sanitized ${name} ${REQUEST_ID}" \
              -f content="$body_b64" -f branch="$GITHUB_REF_NAME" >/dev/null
          done

      - name: Retire request and ciphertext
        if: ${{ always() && steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail
          for path in \
            "release/work-arcade-admission-rescue/${REQUEST_ID}/payload.cms.b64" \
            "release/work-arcade-admission-rescue/${REQUEST_ID}/recipient-cert.b64" \
            "release/work-arcade-admission-rescue/request.json"; do
            sha="$(gh api -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq '.sha' 2>/dev/null || true)"
            if [[ -n "$sha" ]]; then
              gh api --method DELETE -H 'Accept: application/vnd.github+json' \
                "repos/${GITHUB_REPOSITORY}/contents/${path}" \
                -f message="ci(work-arcade): retire rescue material ${REQUEST_ID}" \
                -f sha="$sha" -f branch="$GITHUB_REF_NAME" >/dev/null
            fi
          done

      - name: Destroy ephemeral private material
        if: ${{ always() && steps.request.outputs.pending == 'true' }}
        shell: bash
        run: |
          rm -rf /tmp/work-arcade-source /tmp/work-arcade-source.tar.gz /tmp/work-arcade-sanitized \
            /tmp/payload.cms /tmp/payload-text.b64 /tmp/github-content.b64 \
            /tmp/rescue-private.pem /tmp/rescue-cert.pem

      - name: Enforce suite result
        if: ${{ always() && steps.request.outputs.pending == 'true' }}
        shell: bash
        env:
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        run: |
          test "$SUITE_OUTCOME" = success
