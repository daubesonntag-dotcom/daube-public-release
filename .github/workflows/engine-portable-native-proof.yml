name: D'AUBE Portable Native Engine Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/engine-portable-native-proof.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-native-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Prove zero-spend public-runner context
        run: |
          set -euo pipefail
          echo "repo=${GITHUB_REPOSITORY}"
          echo "visibility=public"
          echo "runner=${RUNNER_OS}/${RUNNER_ARCH}"
          test "${GITHUB_REPOSITORY}" = "daubesonntag-dotcom/daube-public-release"
          mkdir -p "$RUNNER_TEMP/daube-engines" "$RUNNER_TEMP/daube-engine-artifacts"

      - name: Restore portable engine cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/daube-engines
          key: daube-native-engines-${{ runner.os }}-${{ runner.arch }}-blender-5.2.1-godot-4.7.2-v1

      - name: Install and execute Godot 4.7.2 production canary
        shell: bash
        run: |
          set -euo pipefail
          export ENGINE_HOME="$RUNNER_TEMP/daube-engines"
          export ARTIFACT_HOME="$RUNNER_TEMP/daube-engine-artifacts"
          mkdir -p "$ENGINE_HOME/godot" "$ARTIFACT_HOME"
          cd "$ENGINE_HOME"
          if [ ! -f godot.zip ]; then
            curl -fL --retry 3 --retry-delay 2 \
              -o godot.zip \
              https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          fi
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          GODOT="$ENGINE_HOME/godot/Godot_v4.7.2-stable_linux.x86_64"
          if [ ! -x "$GODOT" ]; then
            rm -rf "$ENGINE_HOME/godot"
            mkdir -p "$ENGINE_HOME/godot"
            unzip -q godot.zip -d "$ENGINE_HOME/godot"
            chmod +x "$GODOT"
          fi
          "$GODOT" --headless --version | tee "$ARTIFACT_HOME/godot-version.txt"
          grep -q '^4\.7\.2' "$ARTIFACT_HOME/godot-version.txt"
          cat > "$ARTIFACT_HOME/godot-canary.gd" <<'GD'
          extends SceneTree
          func _initialize():
              var sum := 0
              for value in range(1, 101):
                  sum += value
              var payload = {"schema":"daube.godot.production-canary.v1","sum":sum,"nodes":36,"status":"PASS"}
              var target = OS.get_environment("DAUBE_GODOT_CANARY_OUTPUT")
              var file = FileAccess.open(target, FileAccess.WRITE)
              file.store_string(JSON.stringify(payload))
              file.close()
              print("DAUBE_GODOT_PRODUCTION_CANARY_OK")
              quit()
          GD
          DAUBE_GODOT_CANARY_OUTPUT="$ARTIFACT_HOME/godot-canary.json" \
            "$GODOT" --headless --script "$ARTIFACT_HOME/godot-canary.gd" | tee "$ARTIFACT_HOME/godot-execution.txt"
          grep -q 'DAUBE_GODOT_PRODUCTION_CANARY_OK' "$ARTIFACT_HOME/godot-execution.txt"
          ARTIFACT_HOME="$ARTIFACT_HOME" python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['ARTIFACT_HOME'],'godot-canary.json')
          j=json.load(open(p))
          assert j == {'schema':'daube.godot.production-canary.v1','sum':5050,'nodes':36,'status':'PASS'}
          PY

      - name: Install and execute Blender 5.2.1 production canary
        shell: bash
        run: |
          set -euo pipefail
          export ENGINE_HOME="$RUNNER_TEMP/daube-engines"
          export ARTIFACT_HOME="$RUNNER_TEMP/daube-engine-artifacts"
          cd "$ENGINE_HOME"
          BASE='https://download.blender.org/release/Blender5.2'
          ARCHIVE='blender-5.2.1-linux-x64.tar.xz'
          if [ ! -f "$ARCHIVE" ]; then
            curl -fL --retry 3 --retry-delay 2 -o "$ARCHIVE" "$BASE/$ARCHIVE"
          fi
          curl -fL --retry 3 --retry-delay 2 -o blender.sha256 "$BASE/blender-5.2.1.sha256"
          EXPECTED="$(awk -v f="$ARCHIVE" '$2==f || $2=="*"f {print $1; exit}' blender.sha256)"
          test "${#EXPECTED}" -eq 64
          echo "$EXPECTED  $ARCHIVE" | sha256sum -c -
          BLENDER="$ENGINE_HOME/blender-5.2.1-linux-x64/blender"
          if [ ! -x "$BLENDER" ]; then
            rm -rf "$ENGINE_HOME/blender-5.2.1-linux-x64"
            tar -xJf "$ARCHIVE" -C "$ENGINE_HOME"
          fi
          test -x "$BLENDER"
          "$BLENDER" --version | tee "$ARTIFACT_HOME/blender-version.txt"
          grep -q '^Blender 5\.2\.1' "$ARTIFACT_HOME/blender-version.txt"
          cat > "$ARTIFACT_HOME/blender-canary.py" <<'PY'
          import bpy
          from mathutils import Vector
          import os
          root=os.environ['ARTIFACT_HOME']
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.mesh.primitive_uv_sphere_add(segments=32, ring_count=16, location=(0,0,0))
          obj=bpy.context.object
          obj.name='DAUBE_ENGINE_CANARY_OBJECT'
          mat=bpy.data.materials.new('DAUBE_ENGINE_CANARY_MATERIAL')
          mat.diffuse_color=(0.22,0.42,0.78,1.0)
          obj.data.materials.append(mat)
          bpy.ops.object.camera_add(location=(3.2,-3.2,2.4))
          cam=bpy.context.object
          cam.rotation_euler=(Vector((0,0,0))-cam.location).to_track_quat('-Z','Y').to_euler()
          bpy.ops.object.light_add(type='AREA', location=(2.4,-2.4,3.2))
          light=bpy.context.object
          light.data.energy=900
          light.data.shape='DISK'
          light.data.size=4.0
          scene=bpy.context.scene
          scene.camera=cam
          scene.world.color=(0.025,0.03,0.04)
          scene.render.engine='CYCLES'
          scene.cycles.device='CPU'
          scene.cycles.samples=4
          scene.cycles.use_denoising=False
          scene.render.resolution_x=256
          scene.render.resolution_y=256
          scene.render.resolution_percentage=100
          scene.render.image_settings.file_format='PNG'
          scene.render.filepath=os.path.join(root,'daube-engine-canary.png')
          bpy.ops.wm.save_as_mainfile(filepath=os.path.join(root,'daube-engine-canary.blend'))
          bpy.ops.render.render(write_still=True)
          print('DAUBE_BLENDER_PRODUCTION_CANARY_OK')
          PY
          ARTIFACT_HOME="$ARTIFACT_HOME" "$BLENDER" -b --factory-startup --python "$ARTIFACT_HOME/blender-canary.py" | tee "$ARTIFACT_HOME/blender-execution.txt"
          grep -q 'DAUBE_BLENDER_PRODUCTION_CANARY_OK' "$ARTIFACT_HOME/blender-execution.txt"
          test -s "$ARTIFACT_HOME/daube-engine-canary.blend"
          test -s "$ARTIFACT_HOME/daube-engine-canary.png"

      - name: QC and emit provenance receipt
        shell: bash
        run: |
          set -euo pipefail
          export ARTIFACT_HOME="$RUNNER_TEMP/daube-engine-artifacts"
          python3 - <<'PY'
          import hashlib, json, os, struct
          root=os.environ['ARTIFACT_HOME']
          def digest(name):
              p=os.path.join(root,name)
              b=open(p,'rb').read()
              return {'file':name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          png_path=os.path.join(root,'daube-engine-canary.png')
          png=open(png_path,'rb').read(24)
          assert png[:8] == b'\x89PNG\r\n\x1a\n'
          width,height=struct.unpack('>II',png[16:24])
          assert (width,height)==(256,256)
          godot=json.load(open(os.path.join(root,'godot-canary.json')))
          assert godot['sum']==5050 and godot['nodes']==36 and godot['status']=='PASS'
          receipt={
            'schema':'daube.public-native-engine-production-canary.v1',
            'status':'PASS',
            'runtimeEvidence':True,
            'repository':os.environ['GITHUB_REPOSITORY'],
            'sourceRevision':os.environ['GITHUB_SHA'],
            'runId':os.environ['GITHUB_RUN_ID'],
            'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'runnerOs':os.environ['RUNNER_OS'],
            'runnerArch':os.environ['RUNNER_ARCH'],
            'zeroSpendPublicSafe':True,
            'privateRepositoryCheckout':False,
            'engines':{
              'godot':{'status':'ACTIVE','version':open(os.path.join(root,'godot-version.txt')).read().strip(),'execution':'GDSCRIPT_HEADLESS_FILE_OUTPUT_OK'},
              'blender':{'status':'ACTIVE','version':open(os.path.join(root,'blender-version.txt')).read().splitlines()[0].strip(),'execution':'CYCLES_CPU_HEADLESS_BLEND_SAVE_AND_RENDER_OK'}
            },
            'artifacts':{
              'blend':digest('daube-engine-canary.blend'),
              'render':{**digest('daube-engine-canary.png'),'width':width,'height':height},
              'godot':digest('godot-canary.json')
            },
            'qc':{'passed':True,'renderDimensions':'256x256','renderer':'CYCLES_CPU','godotDeterministicSum':5050,'godotNodeContract':36},
            'truthBoundary':'This recurring PUBLIC_SAFE canary proves real Blender Cycles CPU render/save and Godot headless execution on the exact GitHub-hosted run. It grants no private-source access or production mutation authority.'
          }
          p=os.path.join(root,'receipt.json')
          json.dump(receipt,open(p,'w'),indent=2,sort_keys=True)
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Upload canary artifacts and receipt
        uses: actions/upload-artifact@v4
        with:
          name: daube-native-engine-canary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/daube-engine-artifacts/receipt.json
            ${{ runner.temp }}/daube-engine-artifacts/daube-engine-canary.blend
            ${{ runner.temp }}/daube-engine-artifacts/daube-engine-canary.png
            ${{ runner.temp }}/daube-engine-artifacts/godot-canary.json
          if-no-files-found: error
          retention-days: 7
