name: Sovereign Agent Contract

on:
  push:
    branches:
      - main
    paths:
      - 'farm/sovereign-agent/**'
      - '.github/workflows/sovereign-agent-contract.yml'
  pull_request:
    paths:
      - 'farm/sovereign-agent/**'
      - '.github/workflows/sovereign-agent-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sovereign-agent-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile farm/sovereign-agent/direct-agent.py
          bash -n farm/sovereign-agent/install.sh
          bash -n farm/sovereign-agent/install-termux.sh
      - name: Runtime-kind contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          path=Path('farm/sovereign-agent/direct-agent.py')
          spec=importlib.util.spec_from_file_location('agent_kind',path)
          agent=importlib.util.module_from_spec(spec); spec.loader.exec_module(agent)
          old_prefix=os.environ.get('PREFIX'); old_termux=os.environ.get('TERMUX_VERSION')
          try:
            os.environ['PREFIX']='/data/data/com.termux/files/usr'
            os.environ.pop('TERMUX_VERSION',None)
            assert agent.runtime_kind()=='android-termux'
            os.environ['PREFIX']='/usr'
            os.environ.pop('TERMUX_VERSION',None)
            assert agent.runtime_kind()=='linux-host'
          finally:
            if old_prefix is None: os.environ.pop('PREFIX',None)
            else: os.environ['PREFIX']=old_prefix
            if old_termux is None: os.environ.pop('TERMUX_VERSION',None)
            else: os.environ['TERMUX_VERSION']=old_termux
          print('runtime-kind contracts: PASS')
          PY
      - name: Anti-cloud classification contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path('farm/sovereign-agent/direct-agent.py')
          spec=importlib.util.spec_from_file_location('agent',path)
          agent=importlib.util.module_from_spec(spec); spec.loader.exec_module(agent)
          cases=[
            (['Microsoft Corporation','Virtual Machine'],'microsoft-azure'),
            (['Amazon EC2'],'amazon-ec2'),
            (['Google Compute Engine'],'google-compute'),
            (['Oracle Cloud'],'oracle-cloud'),
            (['DigitalOcean'],'digitalocean'),
          ]
          for signals,expected in cases:
            agent.read_first=lambda _paths,s=signals:s
            agent.metadata_probe=lambda *_args,**_kwargs:False
            result=agent.cloud_heuristic()
            assert result['detected'] is True, (signals,result)
            assert result['providerHint']==expected, (signals,result)
          agent.read_first=lambda _paths:['Dell Inc.','OptiPlex 7090']
          agent.metadata_probe=lambda *_args,**_kwargs:False
          local=agent.cloud_heuristic()
          assert local['detected'] is False, local
          print('anti-cloud classification contracts: PASS')
          PY
      - name: OpenSSL CLI Ed25519 contract
        shell: bash
        run: |
          set -euo pipefail
          key="$(mktemp)"; msg="$(mktemp)"; sig="$(mktemp)"; pub="$(mktemp)"
          trap 'rm -f "$key" "$msg" "$sig" "$pub"' EXIT
          openssl genpkey -algorithm ED25519 -out "$key"
          openssl pkey -in "$key" -pubout -out "$pub"
          printf '%s' '{"daube":"sovereign-agent-contract"}' > "$msg"
          openssl pkeyutl -sign -rawin -inkey "$key" -in "$msg" -out "$sig"
          openssl pkeyutl -verify -rawin -pubin -inkey "$pub" -in "$msg" -sigfile "$sig"
      - name: libcrypto ctypes Ed25519 raw fallback contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, importlib.util, pathlib, shutil, subprocess, tempfile
          path=pathlib.Path('farm/sovereign-agent/direct-agent.py')
          spec=importlib.util.spec_from_file_location('agent_fallback', path)
          agent=importlib.util.module_from_spec(spec); spec.loader.exec_module(agent)
          real_which=shutil.which
          with tempfile.TemporaryDirectory() as tmp:
              root=pathlib.Path(tmp)
              agent.HOME=root
              agent.KEY=root/'host-ed25519.pem'
              agent.RAW_KEY=root/'host-ed25519.raw'
              agent.PUB=root/'host-ed25519.pub.pem'
              agent.LATEST=root/'latest-direct-proof.json'
              agent.shutil.which=lambda name: None if name=='openssl' else real_which(name)
              agent.require_runtime()
              public_pem, fingerprint=agent.ensure_identity()
              assert agent.RAW_KEY.exists() and len(agent.RAW_KEY.read_bytes())==32
              assert not agent.KEY.exists()
              payload={'daube':'libcrypto-raw-fallback-contract'}
              signature=base64.b64decode(agent.sign(payload))
              assert len(signature)==64
              msg=root/'msg.json'; sigfile=root/'sig.bin'; pub=root/'pub.pem'
              msg.write_bytes(agent.canonical_json(payload)); sigfile.write_bytes(signature); pub.write_text(public_pem)
              subprocess.check_call([
                  real_which('openssl'),'pkeyutl','-verify','-rawin','-pubin','-inkey',str(pub),
                  '-in',str(msg),'-sigfile',str(sigfile)
              ])
              assert fingerprint==agent.hashlib.sha256(public_pem.encode()).hexdigest()
          print('libcrypto raw fallback contract: PASS')
          PY
      - name: Termux PEM one-shot fallback contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, importlib.util, pathlib, shutil, subprocess, tempfile
          path=pathlib.Path('farm/sovereign-agent/direct-agent.py')
          spec=importlib.util.spec_from_file_location('agent_pem_fallback', path)
          agent=importlib.util.module_from_spec(spec); spec.loader.exec_module(agent)
          openssl=shutil.which('openssl')
          assert openssl
          with tempfile.TemporaryDirectory() as tmp:
              root=pathlib.Path(tmp)
              agent.HOME=root
              agent.KEY=root/'host-ed25519.pem'
              agent.RAW_KEY=root/'host-ed25519.raw'
              agent.PUB=root/'host-ed25519.pub.pem'
              agent.LATEST=root/'latest-direct-proof.json'
              subprocess.check_call([openssl,'genpkey','-algorithm','ED25519','-out',str(agent.KEY)])
              subprocess.check_call([openssl,'pkey','-in',str(agent.KEY),'-pubout','-out',str(agent.PUB)])
              public_pem=agent.PUB.read_text()
              payload={'daube':'termux-pem-one-shot-fallback'}
              # Reproduce the Android class of failure after a valid PEM identity
              # already exists: the CLI frontend fails, but the same identity must
              # continue through libcrypto without key rotation.
              agent._openssl_sign_pem_file=lambda *_args,**_kwargs: (_ for _ in ()).throw(
                  subprocess.CalledProcessError(1,['openssl','pkeyutl','-sign'])
              )
              signature=base64.b64decode(agent.sign(payload))
              assert len(signature)==64
              msg=root/'msg.json'; sigfile=root/'sig.bin'; pub=root/'verify-pub.pem'
              msg.write_bytes(agent.canonical_json(payload)); sigfile.write_bytes(signature); pub.write_text(public_pem)
              subprocess.check_call([
                  openssl,'pkeyutl','-verify','-rawin','-pubin','-inkey',str(pub),
                  '-in',str(msg),'-sigfile',str(sigfile)
              ])
          print('Termux PEM fallback contract: PASS')
          PY
